  - name: label_matrix_hai_outcomes
    description: >
      Wide table of the hai outcomes family, one row per hospital-window (spine key), built from int_spine_hai_outcomes.
      Published to the features namespace and registered with Feast (feature_store/definitions.py). A missing value is null, never zero.
    meta:
      classification: Confidential
    columns:
      - name: spine_key
        data_type: varchar
        description: "The hospital-window key: CCN and window year. The Feast entity."
        data_tests: [unique, not_null]
      - name: event_timestamp
        data_type: timestamp with time zone
        description: The window start at 00:00 UTC. The point-in-time join time; every value is the latest period that ends strictly before it.
      - name: hai_1__sir__number
        data_type: double
        description: HAI_1, sir of the window's published outcome (int_spine_hai_outcomes). A label, never a predictor.
      - name: hai_1__alignment_status__category
        data_type: varchar
        description: HAI_1, alignment status of the window's published outcome (int_spine_hai_outcomes). A label, never a predictor.
