# The feature phase: research joins built from gold (the hospital-window spine, the as-of alignment steps and the SCD2 histories), not stored beside it.
# The models are views in the build's DuckDB file (the spine and the CMI year models are tables there); the gold selections exclude the tag features.
# Registry controls come from the gold control bridge through the bridge filter models (models/features/bridge, one per retired seed) and the formula recipes in
# dbt/seeds/features/. Only the filter models read bridge_measure_control.
# Text carried over from the archive of the silver models at beab859 (features/archive_manifest.json).
version: 2

models:
  - name: int_cmi_holds
    description: >
      CCN and year pairs whose chosen CMI rows disagree on the CMI or the data year; no CMI is chosen (failure modes
      301 and 312). The year basis is rule (int_cmi_hospital_years) or data (int_cmi_hospital_data_years).
    meta:
      classification: Public
    columns:
      - name: year_basis
        data_type: varchar
        description: rule or data.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [rule, data]
      - name: ccn
        data_type: varchar
        description: The hospital's CCN.
      - name: fiscal_year
        data_type: integer
        description: The rule or data fiscal year, by the year basis.
        data_tests: [not_null]
      - name: hold_reason
        data_type: varchar
        description: values_disagree.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [values_disagree]
      - name: year_key
        data_type: varchar
        description: Year basis, CCN and fiscal year.
        data_tests: [unique, not_null]
      - name: file_count
        data_type: bigint
        description: The most files that carry the CCN-year among its disagreeing rows.
      - name: row_count
        data_type: bigint
        description: Chosen CMI rows of the CCN-year.

  - name: int_cmi_hospital_data_years
    description: >
      One case-mix index per CCN and discharge (data) fiscal year, from the latest rule year that publishes the data
      year, then that rule year's best stage; only data years stated in the file names count (failure modes 310 to
      312). The FY 2020 data year comes from the FY 2023 proposed rule, the only file that publishes it.
    meta:
      classification: Public
    columns:
      - name: ccn
        data_type: varchar
        description: The hospital's CCN.
      - name: data_fiscal_year
        data_type: integer
        description: The discharge fiscal year of the CMI data.
        data_tests: [not_null]
      - name: rule_fiscal_year
        data_type: integer
        description: The payment-rule fiscal year of the file the CMI comes from.
        data_tests: [not_null]
      - name: rule_stage
        data_type: varchar
        description: 'The rule stage of the chosen files: correction, final, interim, proposed, notice or unspecified.'
        data_tests:
          - accepted_values:
              arguments:
                values: [correction, final, proposed, unspecified]
      - name: cmi
        data_type: double
        description: The chosen unadjusted CMI.
        data_tests: [not_null]
      - name: cases
        data_type: double
        description: The cases the file publishes; a separate column, never substituted for the CMI.
      - name: relative_weights
        data_type: double
        description: The relative weights the file publishes, where it does; a separate column.
      - name: transfer_adjusted_cmi
        data_type: double
        description: The transfer-adjusted CMI where the file publishes it; a different measure, never substituted for cmi.
      - name: member_sha256
        data_type: varchar
        description: SHA-256 of the file the chosen row comes from.
      - name: file_count
        data_type: bigint
        description: Best-stage files that carry the CCN in that data year and agree.
      - name: year_key
        data_type: varchar
        description: CCN and data fiscal year.
        data_tests: [unique, not_null]

  - name: int_cmi_hospital_years
    description: >
      One case-mix index per CCN and payment-rule fiscal year from the files of the year's best rule stage
      (correction, final, interim, proposed, notice, unspecified); disagreeing CCN-years are in int_cmi_holds instead
      (failure modes 300 to 302).
    meta:
      classification: Public
    columns:
      - name: ccn
        data_type: varchar
        description: The hospital's CCN.
      - name: rule_fiscal_year
        data_type: integer
        description: The payment-rule fiscal year of the chosen files.
      - name: data_fiscal_year
        data_type: integer
        description: The discharge fiscal year of the CMI data, when the file name states it.
      - name: rule_stage
        data_type: varchar
        description: 'The rule stage of the chosen files: correction, final, interim, proposed, notice or unspecified.'
        data_tests:
          - accepted_values:
              arguments:
                values: [correction, final, proposed, unspecified]
      - name: cmi
        data_type: double
        description: The chosen unadjusted CMI.
        data_tests: [not_null]
      - name: cases
        data_type: double
        description: The cases the file publishes; a separate column, never substituted for the CMI.
      - name: relative_weights
        data_type: double
        description: The relative weights the file publishes, where it does; a separate column.
      - name: transfer_adjusted_cmi
        data_type: double
        description: The transfer-adjusted CMI where the file publishes it; a different measure, never substituted for cmi.
      - name: member_sha256
        data_type: varchar
        description: SHA-256 of the file the chosen row comes from.
      - name: file_count
        data_type: bigint
        description: Best-stage files that carry the CCN in that rule year and agree.
      - name: year_key
        data_type: varchar
        description: CCN and rule fiscal year.
        data_tests: [unique, not_null]

  - name: int_hospital_hgi_history
    description: >
      SCD2 history of each hospital's Hospital General Information description (state, county name, ZIP, hospital
      type, ownership text, emergency services), dated by release dates only. The overall rating is a measure that AL2
      aligns and is not tracked. Two files on one release date that disagree for a CCN are held for that date (silver
      step 7.3).
    meta:
      classification: Public
    columns:
      - name: ccn
        data_type: varchar
        description: The hospital's CCN.
        data_tests: [not_null]
      - name: version_number
        data_type: bigint
        description: Position of the version among the key's versions, from 1.
      - name: valid_from
        data_type: date
        description: Release date of the version's first release (inclusive).
        data_tests: [not_null]
      - name: release_count
        data_type: bigint
        description: Releases in the version.
      - name: first_member_sha256
        data_type: varchar
        description: SHA-256 of the version's first Hospital General Information file.
      - name: is_after_gap
        data_type: boolean
        description: True when the version starts after a release without the key.
      - name: state_code
        data_type: varchar
        description: The state code, as published.
      - name: county_name
        data_type: varchar
        description: The county name, as published.
      - name: zip_code
        data_type: varchar
        description: The ZIP code, as published.
      - name: hospital_type
        data_type: varchar
        description: The hospital type, as published.
      - name: hospital_ownership
        data_type: varchar
        description: The ownership text, as published.
      - name: has_emergency_services
        data_type: boolean
        description: True when the hospital reports emergency services.
      - name: valid_to
        data_type: date
        description: Date of the first later release that differs or lacks the key; null while current.
      - name: is_current
        data_type: boolean
        description: True when the version reaches the latest release.
      - name: history_key
        data_type: varchar
        description: CCN and valid_from.
        data_tests: [unique, not_null]

  - name: int_hospital_ownership_history
    description: >
      SCD2 history of each hospital enrollment's organization owners by owner ID and role: share, owner name and the
      private-equity and REIT flags, dated by release period ends only. Organization owners only, so no individual's
      name enters history (failure mode 676); a release that lists an owner twice with different terms is held (silver
      step 7.3). Owner IDs are padded to 10 digits (failure mode 714). One missing release is bridged, never a held
      one, and counted in bridged_releases (owner decision Oct 10 2026, failure mode 715).
    meta:
      classification: Confidential
    columns:
      - name: enrollment_id
        data_type: varchar
        description: The hospital's enrollment ID.
        data_tests: [not_null]
      - name: associate_id_owner
        data_type: varchar
        description: The owner's associate ID, padded to 10 digits.
      - name: role_code
        data_type: varchar
        description: The owner's role code.
      - name: version_number
        data_type: bigint
        description: Position of the version among the key's versions, from 1.
      - name: valid_from
        data_type: date
        description: Period end of the version's first release (inclusive).
        data_tests: [not_null]
      - name: release_count
        data_type: bigint
        description: Releases in the version.
      - name: bridged_releases
        data_type: bigint
        description: Releases without the owner that this version covers (a fill); 0 when the owner is in every release.
        data_tests: [not_null]
      - name: first_member_sha256
        data_type: varchar
        description: SHA-256 of the version's first owner file.
      - name: is_after_gap
        data_type: boolean
        description: True when the version starts after a release without the key.
      - name: percentage_ownership
        data_type: double
        description: The published ownership share, 0 to 100; null when blank.
      - name: organization_name_owner
        data_type: varchar
        description: The owner organization's name.
      - name: private_equity_company_owner
        data_type: boolean
        description: True when the release flags the owner as a private equity company; null when the release does not publish the flag.
      - name: reit_owner
        data_type: boolean
        description: True when the release flags the owner as a real estate investment trust (REIT); null when the release does not publish the flag.
      - name: valid_to
        data_type: date
        description: Date of the first later release that differs or lacks the key; null while current.
      - name: is_current
        data_type: boolean
        description: True when the version reaches the latest release.
      - name: history_key
        data_type: varchar
        description: Enrollment ID, owner ID, role code and valid_from.
        data_tests: [unique, not_null]

  - name: int_hospital_pos_history
    description: >
      SCD2 history of each hospital's Provider of Services attributes: one row per CCN and version, dated by snapshot
      period ends only (valid_from inclusive, valid_to exclusive, null while current). A change in a tracked
      attribute, compared null-safely, or a return after a snapshot without the CCN starts a version; an absent
      snapshot closes it. A snapshot that lists one CCN with disagreeing values is held for that snapshot. Values as
      published; fills stay on the spine (silver step 7.3, failure modes 670 to 677).
    meta:
      classification: Confidential
    columns:
      - name: ccn
        data_type: varchar
        description: The hospital's CCN.
        data_tests: [not_null]
      - name: version_number
        data_type: bigint
        description: Position of the version among the key's versions, from 1.
      - name: valid_from
        data_type: date
        description: Period end of the version's first snapshot.
        data_tests: [not_null]
      - name: release_count
        data_type: bigint
        description: Snapshots in the version.
      - name: first_member_sha256
        data_type: varchar
        description: SHA-256 of the version's first POS file.
      - name: is_after_gap
        data_type: boolean
        description: True when the version starts after a snapshot without the CCN.
      - name: state_code
        data_type: varchar
        description: The POS state code.
      - name: county_fips
        data_type: varchar
        description: The county as 5-character FIPS, as fct_pos_snapshot gives it.
      - name: ssa_county_code
        data_type: varchar
        description: 5-character SSA state and county code.
      - name: zip_code
        data_type: varchar
        description: The ZIP code from the snapshot.
      - name: provider_subtype_code
        data_type: varchar
        description: POS provider subtype, 2 characters.
      - name: control_type_code
        data_type: varchar
        description: POS type of control (ownership), 2 characters.
      - name: termination_code
        data_type: varchar
        description: POS termination code; 00 is active.
      - name: cbsa_urban_rural_code
        data_type: varchar
        description: The core-based statistical area (CBSA) urban or rural code of the snapshot.
      - name: bed_count
        data_type: integer
        description: Beds as the snapshot states them.
      - name: certified_bed_count
        data_type: integer
        description: Certified beds as the snapshot states them.
      - name: valid_to
        data_type: date
        description: Period end of the first later snapshot that differs or lacks the CCN; null while current.
      - name: is_current
        data_type: boolean
        description: True when the version reaches the latest snapshot.
      - name: history_key
        data_type: varchar
        description: CCN and valid_from.
        data_tests: [unique, not_null]

  - name: int_hospital_spine
    description: >
      One row per hospital (CCN) and calendar-year HAI window (2018, 2019 and 2021 to 2024 in the stored releases), as
      of the window start: the POS snapshot that ends in the 12 months before the window, the CMI of the fiscal year
      that ends before it and the population flags (failure modes 306 to 317). Primary population: a CMI, a POS state
      in the 50 states and DC, no Veterans Health Administration, no critical access and no Maryland hospital
      (Maryland is paid under its own all-payer model). The sensitivity population adds critical access and Maryland
      hospitals. Connecticut stays in both. A missing state, ZIP, county or classification is filled only from a source
      whose period ends strictly before the window start (the as-of rule): the CCN's latest earlier POS snapshot within
      24 months of the start, the latest enrollment row that ends before the start, or the latest HUD quarter that ends
      before the start for a ZIP that HUD places in one county only. Each filled field names its source and that
      source's period end. A later snapshot, an enrollment row or HUD quarter that ends on or after the start and the
      CCN's SSA state code are never used. Connecticut windows also get their planning region when the ZIP lies in one
      region. A ZIP split across counties or regions gives none (failure modes 612 to 618, 631, 698 and 701).
    meta:
      classification: Confidential
    columns:
      - name: ccn
        data_type: varchar
        description: The CCN from the HAI windows.
        data_tests: [not_null]
      - name: window_year
        data_type: bigint
        description: The calendar year of the HAI window.
        data_tests: [not_null]
      - name: window_start
        data_type: date
        description: First day of the calendar-year window.
      - name: hai_measure_count
        data_type: bigint
        description: Distinct HAI measure IDs the hospital has in the window.
      - name: pos_period_end
        data_type: date
        description: End of the POS snapshot used; null when the hospital is not in the snapshot before the window.
      - name: state_code
        data_type: varchar
        description: The state code, filled in the order the state source names.
      - name: state_source
        data_type: varchar
        description: >
          Where the state comes from: pos_own (the window's own snapshot), pos_earlier (the CCN's latest earlier snapshot),
          enrollment (the latest enrollment row that ends before the start); null when no source has it.
        data_tests:
          - accepted_values:
              arguments:
                values: [pos_own, pos_earlier, enrollment]
      - name: state_source_period_end
        data_type: date
        description: End of the period of the source that gave the state; always before window_start; null when the state is null.
      - name: zip_code
        data_type: varchar
        description: >
          The hospital's 5-digit ZIP from its own POS snapshot, else its latest earlier snapshot, else the latest enrollment
          row that ends before the window start; used for the county and planning-region fills and the ZIP-based linkage.
      - name: zip_source
        data_type: varchar
        description: Where the ZIP comes from, as for state_source; null when no source has it.
        data_tests:
          - accepted_values:
              arguments:
                values: [pos_own, pos_earlier, enrollment]
      - name: zip_source_period_end
        data_type: date
        description: End of the period of the source that gave the ZIP; always before window_start; null when the ZIP is null.
      - name: county_fips
        data_type: varchar
        description: >
          The county as 5-character FIPS: the own or latest earlier snapshot's county, else the single HUD county of the
          ZIP in the latest HUD quarter that ends before the window start (county_source).
      - name: county_source
        data_type: varchar
        description: >
          Where the county comes from: pos_own, pos_earlier or hud_quarter; null when no source has it.
        data_tests:
          - accepted_values:
              arguments:
                values: [pos_own, pos_earlier, hud_quarter]
      - name: county_source_period_end
        data_type: date
        description: End of the snapshot period or HUD quarter that gave the county; always before window_start; null when the county is null.
      - name: planning_region_fips
        data_type: varchar
        description: A Connecticut hospital's planning region from its ZIP in the latest HUD quarter that ends before the window start; null elsewhere.
      - name: planning_region_source
        data_type: varchar
        description: hud_quarter when the ZIP lies in one planning region; null otherwise.
        data_tests:
          - accepted_values:
              arguments:
                values: [hud_quarter]
      - name: planning_region_source_period_end
        data_type: date
        description: End of the HUD quarter that gave the planning region; always before window_start; null when the region is null.
      - name: provider_subtype_code
        data_type: varchar
        description: The window's own snapshot provider subtype, else the latest earlier snapshot's (classification_source).
      - name: control_type_code
        data_type: varchar
        description: The window's own snapshot type of control, else the latest earlier snapshot's (classification_source).
      - name: classification_source
        data_type: varchar
        description: >
          Where the provider subtype and control type come from: pos_own (the window's own snapshot) or pos_earlier (the
          CCN's latest earlier snapshot within 24 months); null when neither exists. A later snapshot never gives them.
        data_tests:
          - accepted_values:
              arguments:
                values: [pos_own, pos_earlier]
      - name: classification_source_period_end
        data_type: date
        description: End of the snapshot period that gave the classification; always before window_start; null when classification_source is null.
      - name: bed_count
        data_type: integer
        description: Beds from the window's own POS snapshot; null without one.
      - name: certified_bed_count
        data_type: integer
        description: Certified beds from the window's own POS snapshot; null without one.
      - name: is_active
        data_type: boolean
        description: POS active flag of the window's own snapshot; null without one.
      - name: cmi
        data_type: double
        description: The unadjusted CMI of the fiscal year that ends before the window; null when absent or held.
      - name: cmi_data_fiscal_year
        data_type: integer
        description: The CMI's discharge fiscal year, the window year minus 1.
      - name: cmi_rule_fiscal_year
        data_type: integer
        description: The payment-rule fiscal year of the CMI's file.
      - name: cmi_rule_stage
        data_type: varchar
        description: The rule stage of the CMI's file.
        data_tests:
          - accepted_values:
              arguments:
                values: [correction, final, proposed, unspecified]
      - name: cmi_cases
        data_type: double
        description: The cases the CMI file publishes.
      - name: has_pos_snapshot
        data_type: boolean
        description: True when the hospital is in the POS snapshot that ends in the 12 months before the window.
      - name: has_cmi
        data_type: boolean
        description: True when a CMI exists for the data year before the window, held or not.
      - name: is_cmi_held
        data_type: boolean
        description: True when the CMI of that data year is held in int_cmi_holds.
        data_tests: [not_null]
      - name: is_critical_access
        data_type: boolean
        description: True when positions 3 and 4 of the CCN are 13.
      - name: is_veterans_affairs
        data_type: boolean
        description: True when the CCN ends in F.
      - name: is_state_or_dc
        data_type: boolean
        description: True when the filled state is one of the 50 states or DC.
      - name: is_connecticut
        data_type: boolean
        description: True when the filled state is Connecticut; stays in both populations.
      - name: is_maryland
        data_type: boolean
        description: True when the POS state is Maryland; out of the primary population, in the sensitivity run.
        data_tests: [not_null]
      - name: spine_key
        data_type: varchar
        description: CCN and window year.
        data_tests: [unique, not_null]
      - name: is_primary_population
        data_type: boolean
        description: In the primary model population.
        data_tests: [not_null]
      - name: is_sensitivity_population
        data_type: boolean
        description: In the sensitivity-run population (adds critical access and Maryland hospitals).
        data_tests: [not_null]

  - name: int_spine_hai_outcomes
    description: >
      AL1 outcome: one row per spine hospital-window (calendar year) and HAI infection type, with the published SIR,
      bounds, observed and predicted counts and exposure by exact measure ID, tokens kept as text, the SIR footnote
      codes and the spine's population flags. Parts from releases after the last 2015-baseline review are held and
      counted. Every type stays separate; no target is chosen here.
    meta:
      classification: Confidential
    columns:
      - name: ccn
        data_type: varchar
        description: The hospital's CCN.
      - name: window_year
        data_type: bigint
        description: The calendar year of the HAI window.
      - name: window_start
        data_type: date
        description: First day of the calendar-year window.
      - name: hai_type
        data_type: varchar
        description: HAI_1 (CLABSI) to HAI_6 (C. difficile).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [HAI_1, HAI_2, HAI_3, HAI_4, HAI_5, HAI_6]
      - name: measure_name
        data_type: varchar
        description: The published name of the SIR part; null when none is published.
      - name: sir_text
        data_type: varchar
        description: The published standardized infection ratio (SIR) text; tokens (Not Available, --, N/A) stay text.
      - name: sir
        data_type: double
        description: The standardized infection ratio (SIR) as a number; null for a token or a part not published.
      - name: sir_footnote
        data_type: varchar
        description: The footnote published with the standardized infection ratio (SIR).
      - name: ci_lower_text
        data_type: varchar
        description: The published lower confidence bound text; tokens (Not Available, --, N/A) stay text.
      - name: ci_lower
        data_type: double
        description: The lower confidence bound as a number; null for a token or a part not published.
      - name: ci_lower_footnote
        data_type: varchar
        description: The footnote published with the lower confidence bound.
      - name: ci_upper_text
        data_type: varchar
        description: The published upper confidence bound text; tokens (Not Available, --, N/A) stay text.
      - name: ci_upper
        data_type: double
        description: The upper confidence bound as a number; null for a token or a part not published.
      - name: ci_upper_footnote
        data_type: varchar
        description: The footnote published with the upper confidence bound.
      - name: observed_text
        data_type: varchar
        description: The published observed infections (measure part NUMERATOR) text; tokens (Not Available, --, N/A) stay text.
      - name: observed
        data_type: double
        description: The observed infections (measure part NUMERATOR) as a number; null for a token or a part not published.
      - name: observed_footnote
        data_type: varchar
        description: The footnote published with the observed infections (measure part NUMERATOR).
      - name: predicted_text
        data_type: varchar
        description: The published predicted infections (measure part ELIGCASES) text; tokens (Not Available, --, N/A) stay text.
      - name: predicted
        data_type: double
        description: The predicted infections (measure part ELIGCASES) as a number; null for a token or a part not published.
      - name: predicted_footnote
        data_type: varchar
        description: The footnote published with the predicted infections (measure part ELIGCASES).
      - name: exposure_text
        data_type: varchar
        description: The published exposure (measure part DOPC) text; tokens (Not Available, --, N/A) stay text.
      - name: exposure
        data_type: double
        description: The exposure (measure part DOPC) as a number; null for a token or a part not published.
      - name: exposure_footnote
        data_type: varchar
        description: The footnote published with the exposure (measure part DOPC).
      - name: sir_compared_to_national
        data_type: varchar
        description: The SIR part's compared-to-national category as published.
      - name: sir_footnote_codes
        data_type: varchar
        description: The leading footnote codes of sir_footnote as numbers, sorted and comma-joined; null when there are none.
      - name: release_date
        data_type: date
        description: The latest release date among the published parts.
      - name: published_parts
        data_type: bigint
        description: Parts published in releases up to the last 2015-baseline review.
      - name: baseline_held_parts
        data_type: bigint
        description: Parts from later releases, held until reviewed and never used.
      - name: staging_held_parts
        data_type: bigint
        description: Distinct measure IDs that staging held for the window and type.
      - name: has_sir
        data_type: boolean
        description: True when the SIR text is a plain number.
      - name: spine_key
        data_type: varchar
        description: Hospital and window year, as in int_hospital_spine.
        data_tests: [not_null]
      - name: is_primary_population
        data_type: boolean
        description: In the primary model population, as in int_hospital_spine.
      - name: is_sensitivity_population
        data_type: boolean
        description: In the sensitivity-run population, as in int_hospital_spine.
      - name: is_connecticut
        data_type: boolean
        description: True when the spine state is Connecticut.
      - name: is_maryland
        data_type: boolean
        description: True when the spine state is Maryland.
      - name: outcome_key
        data_type: varchar
        description: Spine key and infection type.
        data_tests: [unique, not_null]
      - name: alignment_status
        data_type: varchar
        description: aligned (a part published), held_in_staging (parts held, none published) or not_in_source.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [aligned, held_in_staging, not_in_source]

  - name: int_spine_linkage
    description: >
      AL4b linkage: one row per spine hospital-window and linkage field. L002: the share of the hospital ZIP's
      residential addresses in its county or planning region, from the latest HUD quarter that ends before the start.
      L001: the hospital's service-area ZIPs and cases in the latest data year before the window, suppressed rows left
      out. Linkage only, never a predictor (failure mode 638).
    meta:
      classification: Confidential
    columns:
      - name: spine_key
        data_type: varchar
        description: Hospital and window year, as in int_hospital_spine.
      - name: ccn
        data_type: varchar
        description: The hospital's CCN.
      - name: window_year
        data_type: bigint
        description: The calendar year of the HAI window.
      - name: window_start
        data_type: date
        description: First day of the calendar-year window.
      - name: county_fips
        data_type: varchar
        description: The spine's county.
      - name: planning_region_fips
        data_type: varchar
        description: The spine's Connecticut planning region; null elsewhere.
      - name: measure_source
        data_type: varchar
        description: hud or hsa.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [hud, hsa]
      - name: measure_control
        data_type: varchar
        description: L002 for the HUD share, L001 for the service area.
        data_tests:
          - accepted_values:
              arguments:
                values: [L001, L002]
      - name: field
        data_type: varchar
        description: zip_residential_share, service_area_zips or service_area_cases.
        data_tests:
          - accepted_values:
              arguments:
                values: [service_area_cases, service_area_zips, zip_residential_share]
      - name: review_decision
        data_type: varchar
        description: Always linkage_only.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [linkage_only]
      - name: period_end
        data_type: date
        description: End of the HUD quarter or the service-area data year used; null when not aligned.
      - name: value_text
        data_type: varchar
        description: The value as text.
      - name: value_number
        data_type: double
        description: The ZIP's residential share (HUD res_ratio) or the service-area ZIP count or case total.
      - name: value_note
        data_type: varchar
        description: published_counts_only for the service area; null otherwise.
        data_tests:
          - accepted_values:
              arguments:
                values: [published_counts_only]
      - name: alignment_status
        data_type: varchar
        description: aligned, no_period_before_start or not_in_source.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [aligned, no_period_before_start, not_in_source]
      - name: is_primary_population
        data_type: boolean
        description: In the primary model population, as in int_hospital_spine.
      - name: is_sensitivity_population
        data_type: boolean
        description: In the sensitivity-run population, as in int_hospital_spine.
      - name: is_connecticut
        data_type: boolean
        description: True when the spine state is Connecticut.
      - name: is_maryland
        data_type: boolean
        description: True when the spine state is Maryland.
      - name: age_months
        data_type: bigint
        description: Months from period_end to the window start; null when not aligned.
      - name: alignment_key
        data_type: varchar
        description: Spine key, source, registry control and field.
        data_tests: [unique, not_null]

  # Models that read the registry controls of the gold control bridge and the formula recipes.
  - name: int_registry_measure_windows
    description: >
      One row per registry measure control of families S14 to S16, hospital and measurement window, for exactly the
      measure ID and value column the gold control bridge names for source_seed registry_measure_sources (failure
      modes 323 to 327). value_number is set only for plain numbers; categories and tokens stay in value_text. Staging
      a measure does not make it a predictor.
    meta:
      classification: Public
    columns:
      - name: measure_control
        data_type: varchar
        description: The registry measure control ID.
        data_tests: [not_null]
      - name: entity_id
        data_type: varchar
        description: The hospital's CCN, as the window facts name their entity.
      - name: measure_id
        data_type: varchar
        description: The published measure ID the control names.
      - name: window_start
        data_type: date
        description: First day of the measurement window.
      - name: window_end
        data_type: date
        description: Last day of the measurement window.
      - name: value_text
        data_type: varchar
        description: 'The value of the control''s column as published: a number, a category or a token.'
      - name: footnote_text
        data_type: varchar
        description: The footnote published with the value.
      - name: sample_text
        data_type: varchar
        description: The sample size published with the value, as text; null for HCAHPS.
      - name: release_date
        data_type: date
        description: Date of the release that holds the window.
      - name: member_sha256
        data_type: varchar
        description: SHA-256 of the stored file the row comes from.
      - name: value_number
        data_type: double
        description: The value as a number when the text is a plain number; null for a category or a token.
      - name: registry_window_key
        data_type: varchar
        description: Measure control, entity, window start and window end.
        data_tests: [unique, not_null]

  - name: int_cost_report_measures
    description: >
      One row per cost report and registry measure control of the cost-report recipe whose numerator the report
      publishes, computed by the cost-report recipe (failure modes 339 and 340): value, code, ratio, per_day
      (numerator over reporting days) or ratio_per_day_denominator (numerator over the denominator per reporting day).
      A zero or missing denominator gives a null value_number, never infinity. Staging a measure does not make it a
      predictor; review_decision is the registry's.
    meta:
      classification: Public
    columns:
      - name: rpt_rec_num
        data_type: varchar
        description: The cost report's record number.
      - name: ccn
        data_type: varchar
        description: The hospital's CCN.
      - name: fiscal_year
        data_type: bigint
        description: The cost report's fiscal year.
      - name: measure_control
        data_type: varchar
        description: The registry measure control ID.
        data_tests: [not_null]
      - name: rule
        data_type: varchar
        description: 'The recipe rule: value, code, ratio, per_day or ratio_per_day_denominator.'
        data_tests:
          - accepted_values:
              arguments:
                values: [code, per_day, ratio, ratio_per_day_denominator, value]
      - name: review_decision
        data_type: varchar
        description: The registry control's review decision, from dim_registry_control; null when the control has none.
        data_tests:
          - accepted_values:
              arguments:
                values: [hold_definition, retain_conditional]
      - name: numerator
        data_type: double
        description: The amount of the recipe's value or numerator column; null for a code rule.
      - name: denominator
        data_type: double
        description: The amount of the recipe's denominator column (ratio and ratio_per_day_denominator); null for the other rules.
      - name: value_code
        data_type: varchar
        description: The published code of a code rule (type of control or provider type); null for the other rules.
      - name: value_number
        data_type: double
        description: The value by the rule; null for a code rule and for a zero or missing denominator or reporting-day count.
      - name: measure_key
        data_type: varchar
        description: Report record number and measure control.
        data_tests: [unique, not_null]

  - name: int_impact_measures
    description: >
      One row per impact-file release, CCN and registry measure field of source CMS_IPPS (family S04) whose value is
      published, by the impact recipe (failure mode 353): value, code or ratio (C040, average daily census over beds;
      a zero or missing denominator gives null). Staging a measure does not make it a predictor.
    meta:
      classification: Public
    columns:
      - name: member_sha256
        data_type: varchar
        description: SHA-256 of the impact file the value comes from.
      - name: sheet_name
        data_type: varchar
        description: The workbook sheet of the value; null for a text file.
      - name: family
        data_type: varchar
        description: The impact file's sheet family as the fact carries it (for example impact or impact01).
      - name: rule_fiscal_year
        data_type: integer
        description: The payment-rule fiscal year of the impact file.
      - name: rule_stage
        data_type: varchar
        description: 'The rule stages of the file joined with +: correction, final, interim, notice, proposed or unspecified.'
        data_tests:
          - accepted_values:
              arguments:
                values: [correction, correction+final, correction+interim+final, correction+notice, final, interim+final, notice, proposed, proposed+notice, unspecified]
      - name: ccn
        data_type: varchar
        description: The hospital's CCN.
      - name: measure_control
        data_type: varchar
        description: The registry measure control ID.
        data_tests: [not_null]
      - name: field
        data_type: varchar
        description: The impact-file field the recipe names (the numerator field of a ratio).
      - name: rule
        data_type: varchar
        description: 'The recipe rule: value, code or ratio.'
        data_tests:
          - accepted_values:
              arguments:
                values: [code, ratio, value]
      - name: review_decision
        data_type: varchar
        description: The registry control's review decision, from dim_registry_control; null when the control has none.
        data_tests:
          - accepted_values:
              arguments:
                values: [retain_conditional]
      - name: value_code
        data_type: varchar
        description: The published text of a code field; null for the other rules.
      - name: value_number
        data_type: double
        description: >
          The value by the rule (the field, or the field over the denominator field); null for a code rule and for a
          zero or missing denominator.
      - name: measure_key
        data_type: varchar
        description: File checksum, sheet name, CCN, measure control and field.
        data_tests: [unique, not_null]

  - name: int_mup_measures
    description: >
      One row per Medicare inpatient provider summary and registry measure field of sources CMS-MUP-PROVIDER and
      CMS_MEDICARE_PROVIDER (family S08) whose value or numerator is published, by the Medicare inpatient recipe:
      value, ratio (a null or zero denominator gives null) or drg_share (C117, the published discharges of DRG 870 to
      872 over the provider total in the same data year, from the year's one DRG file, which can be an earlier
      release; small cells are not published, so the share can be low). C084 has one row per race field; held and
      closed controls give no rows (failure modes 356, 357 and 360 to 363). Staging a measure does not make it a
      predictor.
    meta:
      classification: Public
    columns:
      - name: member_sha256
        data_type: varchar
        description: SHA-256 of the stored file the row comes from.
      - name: ccn
        data_type: varchar
        description: The hospital's CCN.
      - name: data_year
        data_type: integer
        description: The data year of the provider summary.
      - name: release_year
        data_type: integer
        description: The release year of the provider summary file.
      - name: measure_control
        data_type: varchar
        description: The registry measure control ID.
        data_tests: [not_null]
      - name: field
        data_type: varchar
        description: The provider-summary field the recipe names as the value or numerator.
      - name: rule
        data_type: varchar
        description: 'The recipe rule: value, ratio or drg_share.'
        data_tests:
          - accepted_values:
              arguments:
                values: [drg_share, ratio, value]
      - name: review_decision
        data_type: varchar
        description: The registry control's review decision, from dim_registry_control; null when the control has none.
        data_tests:
          - accepted_values:
              arguments:
                values: [hold_definition, retain_conditional]
      - name: value_number
        data_type: double
        description: The value by the rule; null for a null or zero denominator.
      - name: measure_key
        data_type: varchar
        description: File checksum, CCN, measure control and field.
        data_tests: [unique, not_null]

  - name: int_occmix_measures
    description: >
      Six S03 registry controls per survey row. C030 to C034 retain conditional definitions and review decisions. C043
      is unavailable from this source and always null; registry revision 3 closes it as unavailable from public
      sources (STG-007). Staging does not approve model use or resolve source timing.
    meta:
      classification: Public
    columns:
      - name: survey_row_key
        data_type: varchar
        description: The survey row's key (the silver unique key of fct_occupational_mix_survey).
      - name: member_sha256
        data_type: varchar
        description: SHA-256 of the survey file the row comes from.
      - name: sheet_name
        data_type: varchar
        description: The workbook sheet of the survey row; null for a text file.
      - name: ccn
        data_type: varchar
        description: The hospital's CCN.
      - name: survey_start_date
        data_type: date
        description: First day of the survey period.
      - name: survey_end_date
        data_type: date
        description: Last day of the survey period.
      - name: rule_fiscal_years
        data_type: integer[]
        description: The payment-rule fiscal years of the files that carry the survey row.
      - name: rule_stages
        data_type: varchar[]
        description: The rule stages of those files.
      - name: hold_reason
        data_type: varchar
        description: >
          Why staging holds the row: deleted_survey_record, invalid_provider_id, invalid_survey_period or
          duplicate_provider_period; null when not held.
        data_tests:
          - accepted_values:
              arguments:
                values: [deleted_survey_record, duplicate_provider_period, invalid_provider_id, invalid_survey_period]
      - name: measure_control
        data_type: varchar
        description: Registry control identifier.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [C030, C031, C032, C033, C034, C043]
      - name: definition
        data_type: varchar
        description: The control's definition, from the occupational-mix recipe.
      - name: review_decision
        data_type: varchar
        description: The registry control's review decision, from dim_registry_control; null when the control has none.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Reviewed; Candidate; conditional on valid scope and timing; [B06](notes kept outside the repository)", closed_unavailable_public_sources, retain_conditional]
      - name: source_status
        data_type: varchar
        description: Conditional availability or an unavailable source definition.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [available_conditional, unavailable_source_definition]
      - name: measure_key
        data_type: varchar
        description: Survey row key and measure control.
        data_tests: [unique, not_null]
      - name: value_number
        data_type: double
        description: The control's value by the recipe's formula and guard; null for a held row, a failed guard and C043.

  - name: int_validation_measure_windows
    description: >
      Group D registry controls per component measure, hospital and window, from the exact IDs the gold control bridge
      names (source_seed validation_measures); a reviewed renamed ID enters under the exact ID only where the hospital
      and window have no exact-ID row (the gold window facts already carry it); tokens stay text with a null number
      (failure modes 629 and 630). Controls C289, C290, C291 and children, comparison_only.
    meta:
      classification: Confidential
    columns:
      - name: measure_control
        data_type: varchar
        description: Registry control identifier.
        data_tests: [not_null]
      - name: review_decision
        data_type: varchar
        description: The registry control's review decision, from dim_registry_control; null when the control has none.
        data_tests:
          - accepted_values:
              arguments:
                values: [comparison_only]
      - name: entity_id
        data_type: varchar
        description: The hospital's CCN, as the window facts name their entity.
      - name: measure_id
        data_type: varchar
        description: The measure ID the control names (the reviewed ID where the published ID was renamed).
      - name: published_measure_id
        data_type: varchar
        description: The measure ID as published; differs from measure_id only for an aliased rename.
        data_tests: [not_null]
      - name: window_start
        data_type: date
        description: First day of the measurement window.
      - name: window_end
        data_type: date
        description: Last day of the measurement window.
      - name: value_text
        data_type: varchar
        description: The value as published; a token stays text.
      - name: footnote_text
        data_type: varchar
        description: The footnote published with the value.
      - name: release_date
        data_type: date
        description: Date of the release that holds the window.
      - name: member_sha256
        data_type: varchar
        description: SHA-256 of the stored file the row comes from.
      - name: value_number
        data_type: double
        description: The value as a number when it is a plain number; null otherwise.
      - name: validation_key
        data_type: varchar
        description: Control, measure, hospital and window.
        data_tests: [unique, not_null]

  - name: int_validation_program_values
    description: >
      HAC Reduction and VBP registry controls per field, hospital and program fiscal year, from the fields the gold
      control bridge names (source_seed validation_measures); tokens and the reviewed odd value stay text with a null
      number.
    meta:
      classification: Confidential
    columns:
      - name: measure_control
        data_type: varchar
        description: Registry control identifier.
        data_tests: [not_null]
      - name: review_decision
        data_type: varchar
        description: The registry control's review decision, from dim_registry_control; null when the control has none.
        data_tests:
          - accepted_values:
              arguments:
                values: [comparison_only, exclude_primary]
      - name: ccn
        data_type: varchar
        description: The hospital's CCN.
      - name: fiscal_year
        data_type: integer
        description: The program fiscal year.
      - name: field
        data_type: varchar
        description: >
          The published field the control reads: payment_reduction, total_hac_score,
          unweighted_normalized_safety_domain_score, weighted_safety_domain_score or total_performance_score.
        data_tests:
          - accepted_values:
              arguments:
                values: [payment_reduction, total_hac_score, total_performance_score, unweighted_normalized_safety_domain_score, weighted_safety_domain_score]
      - name: value_text
        data_type: varchar
        description: The value as published; tokens and the reviewed odd value stay text.
      - name: release_date
        data_type: date
        description: Date of the release that holds the program year.
      - name: member_sha256
        data_type: varchar
        description: SHA-256 of the stored file the row comes from.
      - name: value_number
        data_type: double
        description: The value as a number when it is a plain number; null otherwise.
      - name: program_value_key
        data_type: varchar
        description: Control, field, hospital and fiscal year.
        data_tests: [unique, not_null]

  - name: int_spine_care_compare_measures
    description: >
      AL2: one row per spine hospital-window and Care Compare process or structure control (the gold control bridge,
      source_seed registry_measure_sources, families S13 to S16). Each control takes the latest measure window that
      ends before the HAI window starts; the overall rating (C284) takes the latest Hospital General Information
      release dated before the start, and two files on one date that disagree are held. Values stay as published with
      each row's age in months; C141's spellings map to one category each. No age limit and no eligibility choice.
    meta:
      classification: Confidential
    columns:
      - name: spine_key
        data_type: varchar
        description: Hospital and window year, as in int_hospital_spine.
        data_tests: [not_null]
      - name: ccn
        data_type: varchar
        description: The hospital's CCN.
      - name: window_year
        data_type: bigint
        description: The calendar year of the HAI window.
      - name: window_start
        data_type: date
        description: First day of the calendar-year window.
      - name: measure_control
        data_type: varchar
        description: Registry control identifier from the gold control bridge.
        data_tests: [not_null]
      - name: fact
        data_type: varchar
        description: The gold table that holds the control's value (a gold fact or bridge).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [fct_hcahps_window, fct_hgi_release, fct_maternal_health_window, fct_timely_effective_care_window]
      - name: review_decision
        data_type: varchar
        description: The registry control's review decision, from dim_registry_control; null when the control has none.
        data_tests:
          - accepted_values:
              arguments:
                values: [comparison_only, exclude_primary, hold_definition, hold_observations, retain_conditional]
      - name: measure_id
        data_type: varchar
        description: The measure ID of the chosen window; null for the overall rating (C284) and without a period.
      - name: value_text
        data_type: varchar
        description: The value as published; null when the two files of a release date disagree.
      - name: value_number
        data_type: double
        description: The value as a number when it is a plain number; null otherwise and when the two files of a release date disagree.
      - name: value_category
        data_type: varchar
        description: C141 only; low, medium, high or very high, null for the Not Available token.
        data_tests:
          - accepted_values:
              arguments:
                values: [low, medium, high, very high]
      - name: footnote_text
        data_type: varchar
        description: The footnote published with the value.
      - name: sample_text
        data_type: varchar
        description: The sample size published with the value, as text; null for HCAHPS and the overall rating.
      - name: period_start
        data_type: date
        description: First day of the chosen measure window; null for the overall rating and without a period.
      - name: period_end
        data_type: date
        description: Last day of the chosen measure window, or the release date for the overall rating; null without a period.
      - name: release_date
        data_type: date
        description: Release date of the chosen window or Hospital General Information release.
      - name: release_file_count
        data_type: bigint
        description: Release files behind the chosen period (1 for a measure window).
      - name: age_months
        data_type: bigint
        description: Calendar months from the period end to the window start; kept without a limit.
      - name: alignment_status
        data_type: varchar
        description: >
          aligned; no_period_before_start (the hospital has periods for the control, none ending before the start);
          held_in_staging (a held window before the start, or two release files that disagree); not_in_source.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [aligned, no_period_before_start, held_in_staging, not_in_source]
      - name: is_primary_population
        data_type: boolean
        description: In the primary model population, as in int_hospital_spine.
      - name: is_sensitivity_population
        data_type: boolean
        description: In the sensitivity-run population, as in int_hospital_spine.
      - name: is_connecticut
        data_type: boolean
        description: True when the spine state is Connecticut.
      - name: is_maryland
        data_type: boolean
        description: True when the spine state is Maryland.
      - name: alignment_key
        data_type: varchar
        description: Spine key and registry control.
        data_tests: [unique, not_null]

  - name: int_spine_hospital_measures
    description: >
      AL3a: one row per spine hospital-window and hospital finance or operations control by source and field (cost
      reports, IPPS impact files, Medicare inpatient summaries, occupational-mix surveys). Each takes the latest
      period that ends before the HAI window starts: the report period, the rule fiscal year (Oct 1 to Sep 30, most
      final stage), the data year or the survey. Values that disagree for one period are held; occupational-mix copies
      within 0.0001 count as one value. Age in months, no limit; no eligibility choice.
    meta:
      classification: Confidential
    columns:
      - name: spine_key
        data_type: varchar
        description: Hospital and window year, as in int_hospital_spine.
      - name: ccn
        data_type: varchar
        description: The hospital's CCN.
      - name: window_year
        data_type: bigint
        description: The calendar year of the HAI window.
      - name: window_start
        data_type: date
        description: First day of the calendar-year window.
      - name: measure_source
        data_type: varchar
        description: cost_report, ipps_impact, medicare_inpatient or occupational_mix.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [cost_report, ipps_impact, medicare_inpatient, occupational_mix]
      - name: measure_control
        data_type: varchar
        description: Registry control identifier.
      - name: field
        data_type: varchar
        description: >
          The recipe field: value for a cost report, the impact field, the Medicare inpatient field or the occupational-
          mix output column; none for a held or closed control.
      - name: review_decision
        data_type: varchar
        description: The registry control's review decision, from dim_registry_control; null when the control has none.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Reviewed; Candidate; conditional on valid scope and timing; [B06](notes kept outside the repository)", closed_not_predictor, closed_unavailable_public_sources, hold_definition, hold_observations, retain_conditional]
      - name: period_start
        data_type: date
        description: First day of the chosen period; null when no period is chosen.
      - name: period_end
        data_type: date
        description: Last day of the chosen period (report, rule fiscal year, data year or survey); null when no period is chosen.
      - name: rule_fiscal_year
        data_type: integer
        description: The payment-rule fiscal year of the chosen impact file or survey copy; null for cost reports and Medicare inpatient data.
      - name: rule_stage
        data_type: varchar
        description: The rule stages of the chosen impact file joined with +; null for the other sources.
        data_tests:
          - accepted_values:
              arguments:
                values: [correction, correction+final, correction+interim+final, correction+notice, final, interim+final, notice, proposed, proposed+notice, unspecified]
      - name: period_copy_count
        data_type: bigint
        description: Reports, files or copies behind the chosen period.
      - name: is_primary_population
        data_type: boolean
        description: In the primary model population, as in int_hospital_spine.
      - name: is_sensitivity_population
        data_type: boolean
        description: In the sensitivity-run population, as in int_hospital_spine.
      - name: is_connecticut
        data_type: boolean
        description: True when the spine state is Connecticut.
      - name: is_maryland
        data_type: boolean
        description: True when the spine state is Maryland.
      - name: value_code
        data_type: varchar
        description: The published code of a code rule (cost report or impact); null for the other rules and when the values of one period disagree.
      - name: value_number
        data_type: double
        description: The value as a number; null when the values of one period disagree.
      - name: age_months
        data_type: bigint
        description: Calendar months from the period end to the window start, kept without a limit; null without a period.
      - name: alignment_status
        data_type: varchar
        description: aligned, no_period_before_start, held_in_staging (values that disagree, or only held survey rows) or not_in_source.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [aligned, no_period_before_start, held_in_staging, not_in_source]
      - name: alignment_key
        data_type: varchar
        description: Spine key, measure source, registry control and field.
        data_tests: [unique, not_null]

  - name: int_spine_operations_measures
    description: >
      AL3b: one row per spine hospital-window and operations control (the HHS and ONC recipe and the ownership bridge
      rows). HHS capacity: the weeks of the calendar year before the window (ratio of sums for two fields, a sum of
      7-day sums, a mean of 7-day averages; a CCN-week with two HHS hospitals skipped and counted). ONC: the latest
      performance period ending before the start. Ownership: the latest owner release before the start through the
      enrollment CCN, private equity and REIT flags from ownership roles only (Y or not_reported). Change of
      ownership: events in the year before the start (C069) and months since the latest (C070).
    meta:
      classification: Confidential
    columns:
      - name: spine_key
        data_type: varchar
        description: Hospital and window year, as in int_hospital_spine.
      - name: ccn
        data_type: varchar
        description: The hospital's CCN.
      - name: window_year
        data_type: bigint
        description: The calendar year of the HAI window.
      - name: window_start
        data_type: date
        description: First day of the calendar-year window.
      - name: measure_source
        data_type: varchar
        description: hhs_capacity, onc or ownership.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [hhs_capacity, onc, ownership]
      - name: measure_control
        data_type: varchar
        description: Registry control identifier.
      - name: review_decision
        data_type: varchar
        description: The registry control's review decision, from dim_registry_control; null when the control has none.
        data_tests:
          - accepted_values:
              arguments:
                values: [closed_not_predictor, linkage_only, retain_conditional]
      - name: period_start
        data_type: date
        description: First day of the chosen period; null when no period is chosen.
      - name: period_end
        data_type: date
        description: Last day of the chosen period; null when no period is chosen.
      - name: unit_count
        data_type: bigint
        description: Usable weeks, period rows, owner rows or events behind the value.
      - name: skipped_count
        data_type: bigint
        description: HHS weeks skipped because two HHS hospitals share the CCN.
      - name: is_primary_population
        data_type: boolean
        description: In the primary model population, as in int_hospital_spine.
      - name: is_sensitivity_population
        data_type: boolean
        description: In the sensitivity-run population, as in int_hospital_spine.
      - name: is_connecticut
        data_type: boolean
        description: True when the spine state is Connecticut.
      - name: is_maryland
        data_type: boolean
        description: True when the spine state is Maryland.
      - name: value_text
        data_type: varchar
        description: The value as text (a flag, a developer list or an owner list); null when the values disagree.
      - name: value_number
        data_type: double
        description: The value as a number; null when the values disagree or the control has no number.
      - name: age_months
        data_type: bigint
        description: Calendar months from the period end to the window start, kept without a limit; null without a period.
      - name: alignment_status
        data_type: varchar
        description: aligned, no_period_before_start, held_in_staging or not_in_source.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [aligned, no_period_before_start, held_in_staging, not_in_source]
      - name: alignment_key
        data_type: varchar
        description: Spine key, measure source and registry control.
        data_tests: [unique, not_null]

  - name: int_spine_validation_measures
    description: >
      AL5: one row per spine hospital-window and validation control and measure (the gold control bridge, source_seed
      validation_measures). PSI-90 and PSI-13 take the latest period ending strictly before the window start.
      Other validation outcomes take the published period that matches the window itself: the equal calendar-year
      window first, otherwise the largest overlap, then the latest end. HAC and VBP program years are placed by the
      HAI measure period HAC publishes for each fiscal year. This is a non-Feast training support table.
      Validation outcomes are compared with the HAI window, never used to predict it: no predictor model reads this
      table.
    meta:
      classification: Confidential
    columns:
      - name: spine_key
        data_type: varchar
        description: Hospital and window year, as in int_hospital_spine.
      - name: ccn
        data_type: varchar
        description: The hospital's CCN.
      - name: window_year
        data_type: bigint
        description: The calendar year of the HAI window.
      - name: window_start
        data_type: date
        description: First day of the calendar-year window.
      - name: measure_control
        data_type: varchar
        description: Registry control identifier.
      - name: measure
        data_type: varchar
        description: >
          The component measure ID of a window control, or the published field of a program control (the gold column
          without its _published or _number suffix).
      - name: fact
        data_type: varchar
        description: The gold table that holds the control's value (a gold fact).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [fct_complications_deaths_window, fct_hac_program_year, fct_hrrp_window, fct_unplanned_visits_window, fct_vbp_program_year]
      - name: review_decision
        data_type: varchar
        description: The registry control's review decision, from dim_registry_control; null when the control has none.
        data_tests:
          - accepted_values:
              arguments:
                values: [comparison_only, exclude_primary]
      - name: value_text
        data_type: varchar
        description: The value as published; null without a matching period.
      - name: value_number
        data_type: double
        description: The value as a number when it is a plain number; null otherwise.
      - name: footnote_text
        data_type: varchar
        description: The footnote published with the value; null for a program year.
      - name: period_start
        data_type: date
        description: First day of the matched period; null without a matching period.
      - name: period_end
        data_type: date
        description: Last day of the matched period; null without a matching period.
      - name: fiscal_year
        data_type: integer
        description: The program fiscal year of a HAC or VBP row; null for a window measure.
      - name: release_date
        data_type: date
        description: Release date of the matched period.
      - name: overlap_days
        data_type: bigint
        description: Days the chosen period shares with the HAI window, zero for a strictly prior PSI period.
      - name: is_primary_population
        data_type: boolean
        description: In the primary model population, as in int_hospital_spine.
      - name: is_sensitivity_population
        data_type: boolean
        description: In the sensitivity-run population, as in int_hospital_spine.
      - name: is_connecticut
        data_type: boolean
        description: True when the spine state is Connecticut.
      - name: is_maryland
        data_type: boolean
        description: True when the spine state is Maryland.
      - name: alignment_status
        data_type: varchar
        description: aligned, no_matching_period, held_in_staging or not_in_source.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [aligned, no_matching_period, held_in_staging, not_in_source]
      - name: alignment_key
        data_type: varchar
        description: Spine key, registry control and measure.
        data_tests: [unique, not_null]

  - name: int_spine_county_measures
    description: >
      AL4a: one row per spine hospital-window and county control-field from PLACES, Medicare Geographic Variation, CDC
      WONDER, Mapping Medicare Disparities and RUCC, through the hospital's POS county: the latest data year (RUCC
      vintage) that ends before the HAI window starts. PLACES: all-state measure-years only, the latest release of
      each data year. WONDER 2018 to 2020 from the single-race database. Connecticut matches on its old county or its
      planning region.
    meta:
      classification: Confidential
    columns:
      - name: spine_key
        data_type: varchar
        description: Hospital and window year, as in int_hospital_spine.
      - name: ccn
        data_type: varchar
        description: The hospital's CCN.
      - name: window_year
        data_type: bigint
        description: The calendar year of the HAI window.
      - name: window_start
        data_type: date
        description: First day of the calendar-year window.
      - name: county_fips
        data_type: varchar
        description: The spine's county as 5-character FIPS.
      - name: measure_source
        data_type: varchar
        description: places, geographic_variation, wonder, mmd or rucc.
        data_tests:
          - accepted_values:
              arguments:
                values: [geographic_variation, mmd, places, rucc, wonder]
      - name: measure_control
        data_type: varchar
        description: Registry control identifier.
      - name: field
        data_type: varchar
        description: >
          The component the control reads: a PLACES measure with its value type (AgeAdjPrv or CrdPrv), a geographic-
          variation field, the WONDER rate, prevalence for MMD or rucc_code.
      - name: review_decision
        data_type: varchar
        description: The registry control's review decision, from dim_registry_control; null when the control has none.
        data_tests:
          - accepted_values:
              arguments:
                values: [hold_definition, retain_conditional, retain_conditional_crude_definition]
      - name: period_end
        data_type: date
        description: Last day of the data year (RUCC vintage) used; null when no period is used.
      - name: is_primary_population
        data_type: boolean
        description: In the primary model population, as in int_hospital_spine.
      - name: is_sensitivity_population
        data_type: boolean
        description: In the sensitivity-run population, as in int_hospital_spine.
      - name: is_connecticut
        data_type: boolean
        description: True when the spine state is Connecticut.
      - name: is_maryland
        data_type: boolean
        description: True when the spine state is Maryland.
      - name: value_text
        data_type: varchar
        description: The value as published; null when the values of one period disagree.
      - name: value_number
        data_type: double
        description: The value as a number when it is one; null otherwise.
      - name: age_months
        data_type: bigint
        description: Calendar months from the period end to the window start, kept without a limit; null without a period.
      - name: is_primary_county_join
        data_type: boolean
        description: False only for hospitals with neither a county nor a planning region.
      - name: alignment_status
        data_type: varchar
        description: aligned, no_period_before_start, held_in_staging or not_in_source.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [aligned, no_period_before_start, held_in_staging, not_in_source]
      - name: alignment_key
        data_type: varchar
        description: Spine key, source, registry control and field.
        data_tests: [unique, not_null]

  - name: int_spine_county_context
    description: >
      AL4b: one row per spine hospital-window and county context control-field. ACS and SVI (the vintage or edition
      whose period ends before the window), SAIPE, SAHIE (all-group rows, latest file) and BLS (annual averages): the
      latest period that ends before the start. HPSA and MUA: designations in force at the start, rebuilt from the
      designation and withdrawal dates, with the highest score as published at the capture; undated withdrawals and
      the 1970 date hold the window. RUCA from the hospital ZIP's code. HUD shares and the hospital service area are
      in int_spine_linkage. Counties come from the filled spine; Connecticut matches on its old county or its planning
      region (failure modes 604 to 611 and 634 to 637).
    meta:
      classification: Confidential
    columns:
      - name: spine_key
        data_type: varchar
        description: Hospital and window year, as in int_hospital_spine.
      - name: ccn
        data_type: varchar
        description: The hospital's CCN.
      - name: window_year
        data_type: bigint
        description: The calendar year of the HAI window.
      - name: window_start
        data_type: date
        description: First day of the calendar-year window.
      - name: county_fips
        data_type: varchar
        description: The spine's county as 5-character FIPS.
      - name: planning_region_fips
        data_type: varchar
        description: The spine's Connecticut planning region; null elsewhere.
      - name: measure_source
        data_type: varchar
        description: acs, svi, saipe, sahie, bls, hpsa, mua or ruca.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [acs, svi, saipe, sahie, bls, hpsa, mua, ruca]
      - name: measure_control
        data_type: varchar
        description: Registry control identifier.
      - name: field
        data_type: varchar
        description: >
          The component the control reads: an ACS concept or SVI field, a SAIPE, SAHIE or BLS measure,
          designations_in_force or highest_score for HPSA and MUA, or the RUCA field.
      - name: review_decision
        data_type: varchar
        description: The registry control's review decision, from dim_registry_control; null when the control has none.
        data_tests:
          - accepted_values:
              arguments:
                values: [hold_definition, retain_conditional]
      - name: period_end
        data_type: date
        description: Last day of the data period used (for HPSA and MUA, the day before the window start); null when no period is used.
      - name: value_text
        data_type: varchar
        description: The value as published or as a count; null when the values of one period disagree or the window is held.
      - name: value_number
        data_type: double
        description: The value as a number when it is one; null otherwise.
      - name: value_note
        data_type: varchar
        description: >
          score_as_published_at_capture for HPSA and MUA scores (none_in_force when no designation is in force),
          zip_code_approximation for RUCA; null otherwise.
        data_tests:
          - accepted_values:
              arguments:
                values: [none_in_force, score_as_published_at_capture, zip_code_approximation]
      - name: alignment_status
        data_type: varchar
        description: aligned, no_period_before_start, held_in_staging or not_in_source.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [aligned, no_period_before_start, held_in_staging, not_in_source]
      - name: is_primary_population
        data_type: boolean
        description: In the primary model population, as in int_hospital_spine.
      - name: is_sensitivity_population
        data_type: boolean
        description: In the sensitivity-run population, as in int_hospital_spine.
      - name: is_connecticut
        data_type: boolean
        description: True when the spine state is Connecticut.
      - name: is_maryland
        data_type: boolean
        description: True when the spine state is Maryland.
      - name: age_months
        data_type: bigint
        description: Calendar months from the period end to the window start, kept without a limit; null without a period.
      - name: alignment_key
        data_type: varchar
        description: Spine key, source, registry control and field.
        data_tests: [unique, not_null]

  - name: int_hai_outcome_values
    description: >
      HAI registry controls (main-hai-pdc and C283's children) per outcome row and field with a published value, from
      the part the gold control bridge names (source_seed hai_outcome_measures); tokens stay text with a null number.
      Staging approves no use.
    meta:
      classification: Public
    columns:
      - name: measure_control
        data_type: varchar
        description: Registry control identifier.
        data_tests: [not_null]
      - name: review_decision
        data_type: varchar
        description: The registry control's review decision, from dim_registry_control; null when the control has none.
        data_tests:
          - accepted_values:
              arguments:
                values: [exclude_primary]
      - name: outcome_key
        data_type: varchar
        description: Spine key and infection type of the outcome row, as in int_spine_hai_outcomes.
      - name: field
        data_type: varchar
        description: 'The outcome field the control reads: sir, ci_lower, ci_upper, observed, predicted or sir_compared_to_national.'
        data_tests:
          - accepted_values:
              arguments:
                values: [sir, ci_lower, ci_upper, observed, predicted, sir_compared_to_national]
      - name: value_text
        data_type: varchar
        description: The published text of the part; tokens stay text.
      - name: value_number
        data_type: double
        description: The part as a number; null for a token and for sir_compared_to_national.
      - name: outcome_value_key
        data_type: varchar
        description: Control, field and outcome key.
        data_tests: [unique, not_null]

