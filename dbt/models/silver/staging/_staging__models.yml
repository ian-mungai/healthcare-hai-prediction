  - name: stg_bronze__file_labels
    description: >
      One row per loaded IPPS and occupational-mix object with its labels from the generated map
      (scripts/lakehouse/ipps_file_labels.py, seed ipps_occmix_copy_labels), read from its names and stored container,
      never from capture time (failure modes 178 to 182).
    columns:
      - name: copy_key
        description: Bronze table and object key, the model's key.
        data_tests: [unique, not_null]
      - name: bronze_table
        description: The bronze table the copy belongs to.
      - name: object_key
        description: The loaded object.
      - name: member_sha256
        description: SHA-256 of the file the object holds.
      - name: file_name
        description: The file's own name.
      - name: label_source
        description: Where the labels come from.
        data_tests:
          - accepted_values:
              arguments:
                values: [names, override]
      - name: family
        description: A descriptive family name, without years, dates, stages or versions.
      - name: role
        description: Data, or a description of the data.
        data_tests:
          - accepted_values:
              arguments:
                values: [data, description]
      - name: rule_fiscal_year
        description: The fiscal year of the rule that published the file.
      - name: data_fiscal_year
        description: For a CMI file published with a later rule, the discharge fiscal year of its data.
      - name: identity_year
        description: The data fiscal year when there is one, otherwise the rule fiscal year; copies must agree on it.
      - name: rule_stage
        description: The rule stages the names mention (proposed, final, correction, interim, notice), joined with '+'.
      - name: is_label_checksum_match
        description: True when the label row was generated for the same file checksum.

  - name: stg_bronze__twin_comparison
    description: >
      One row per text/workbook twin pair (seed ipps_occmix_twins): the text layout, the workbook sheet that matches
      best, data rows on each side, matched rows, and the pair's status and preferred file (failure modes 183 to 190).
    columns:
      - name: twin_key
        description: Text and workbook checksums, the model's key.
        data_tests: [unique, not_null]
      - name: text_table
        description: The bronze table holding the text file.
      - name: text_sha256
        description: SHA-256 of the text file.
      - name: workbook_table
        description: The bronze table holding the workbook.
      - name: workbook_sha256
        description: SHA-256 of the workbook.
      - name: text_layout
        description: How the text file's fields are separated.
        data_tests:
          - accepted_values:
              arguments:
                values: [tab, comma, fixed_width, empty]
      - name: compared_sheet
        description: The workbook sheet with the most rows matching the text file.
      - name: text_data_rows
        description: Rows with a number in the text file.
      - name: workbook_data_rows
        description: Rows with a number in the compared sheet.
      - name: matched_rows
        description: Data rows, aligned by position, whose fields all match.
      - name: twin_status
        description: agree, differ, or not_compared when the text file cannot be split.
        data_tests:
          - accepted_values:
              arguments:
                values: [agree, differ, not_compared]
      - name: preferred_sha256
        description: The file intermediate models read; null when the pair differs.

  - name: stg_bronze__file_selection
    description: >
      One row per distinct stored file: whether intermediate models may read it. Not selected while its labels are
      held, or when a twin pair excludes it (failure modes 172 and 187).
    columns:
      - name: file_key
        description: Bronze table and member SHA-256, the model's key.
        data_tests: [unique, not_null]
      - name: bronze_table
        description: The bronze table holding the file.
      - name: member_sha256
        description: SHA-256 of the file.
      - name: is_label_held
        description: True when the owner holds the file's labels.
      - name: has_label_conflict
        description: True when the file's copies disagree on role or identity year.
      - name: twin_pair_count
        description: Twin pairs the file belongs to.
      - name: is_twin_excluded
        description: True when any of its twin pairs prefers the other file or differs.
      - name: is_selected
        description: True when intermediate models may read the file.
        data_tests: [not_null]

  - name: stg_bronze__sheet_selection
    description: >
      One row per workbook sheet in the IPPS and occupational-mix sheet tables: whether intermediate models may read it.
      A twin-excluded workbook keeps every sheet that no selected text file of the same release covers row for row; all
      sheets of a selected workbook are selected and none of a held workbook (failure modes 267 to 278).
    columns:
      - name: sheet_key
        description: Bronze table, member SHA-256 and sheet name, the model's key.
        data_tests: [unique, not_null]
      - name: file_key
        description: Bronze table and member SHA-256 of the workbook.
      - name: bronze_table
        description: The bronze table holding the workbook.
      - name: member_sha256
        description: SHA-256 of the workbook.
      - name: sheet_name
        description: The sheet as published.
      - name: sheet_rows
        description: Rows in the sheet.
      - name: data_rows
        description: Rows with a number in the sheet.
      - name: sheet_status
        description: >
          file_selected (the workbook is selected), kept (no selected text covers the sheet), covered (a selected text
          of the same release matches every data row), twin_differs (the compared sheet of a twin pair that differs) or
          label_held (the workbook's labels are held).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [file_selected, kept, covered, twin_differs, label_held]
      - name: covering_sha256
        description: For a covered sheet, the smallest checksum of a selected text file that covers it.
      - name: is_selected
        description: True when intermediate models may read the sheet.
        data_tests: [not_null]

