  - name: int_validation_program_holds
    description: >
      HAC Reduction and VBP rows the program-year models leave out, with the reason, row count, hold key and the sorted
      checksums of the files they come from.
    columns:
      - name: hold_key
        description: >
          md5 of the table, reason, ccn and fiscal year with every null written as <null> (the silver hold-key encoding:
          ccn in the entity slot, fiscal year in the window-start slot).
        data_tests: [unique, not_null]
      - name: member_sha256s
        description: Sorted checksums of the files that contribute to the hold.
      - name: hold_reason
        description: no_key, no_fiscal_year, label_held, undated_release, same_date_conflict or repeated_in_file.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [no_key, no_fiscal_year, label_held, undated_release, same_date_conflict, repeated_in_file]

  - name: int_silver_build_marker
    description: >
      One row naming the dbt run that wrote the build file and the DuckDB version that wrote it, built after the kept
      models it names (amendment A28). Great Expectations validation (scripts/lakehouse/silver.py validate) refuses a
      build file without it and binds its result to this row (silver step 6, failure modes 639, 646 and 647). On a real
      build the launcher passes the run, the dbt tree hash, the bronze pins and the Git revision; a missing or
      unrecorded value stops compilation, and the on-run-end hook keeps the row only after a gold-eligible build
      (scripts/lakehouse/provenance.py, D1 section 10). Fixture and lint builds read unrecorded for the four provenance columns.
    columns:
      - name: dbt_invocation_id
        description: The dbt invocation that built this file.
        data_tests: [unique, not_null]
      - name: git_revision
        description: The Git revision of the checkout on a real build; the dbt variable git_revision, or unrecorded, on a fixture build.
        data_tests: [not_null]
      - name: duckdb_version
        description: version() of the DuckDB that wrote the file.
        data_tests: [not_null]
      - name: run_id
        description: The launcher run that built this file.
        data_tests: [not_null]
      - name: dbt_tree_sha256
        description: The launcher's hash of the run's snapshot of the dbt project and its packages.
        data_tests: [not_null]
      - name: bronze_pins_sha256
        description: SHA-256 of the run's pins.json, the bronze snapshot IDs the build read.
        data_tests: [not_null]
      - name: pins_json
        description: The text of the run's pins.json; its SHA-256 is bronze_pins_sha256.
        data_tests: [not_null]
