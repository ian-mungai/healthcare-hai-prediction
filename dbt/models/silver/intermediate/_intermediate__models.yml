version: 2

models:
  - name: int_hai_hospital_windows
    description: >
      One HAI hospital row per entity, measure ID and measurement window, from the file with the latest stored release
      (BRZ-002; failure modes 230 to 236, data/lakehouse_planning/hai_windows_20261004/failure_modes.md). Windows whose
      latest release holds two rows are held in int_hai_window_holds instead.
    columns:
      - name: window_key
        description: Entity, measure ID, window start and window end, the model's key.
        data_tests: [unique, not_null]
      - name: entity_id
        description: The CMS Certification Number (facility_id, or provider_id in older layouts).
        data_tests: [not_null]
      - name: measure_id
        description: The CMS measure ID.
        data_tests: [not_null]
      - name: window_start
        description: First day of the measurement window, parsed from m/d/yyyy.
        data_tests: [not_null]
      - name: window_end
        description: Last day of the measurement window.
        data_tests: [not_null]
      - name: measure_name
        description: The measure name as published in the chosen row.
      - name: score
        description: The published score, as text; typing happens in later models.
      - name: footnote
        description: The published footnote code, as text.
      - name: member_sha256
        description: SHA-256 of the file the chosen row comes from.
        data_tests: [not_null]
      - name: object_key
        description: Object key of the loaded copy of that file.
      - name: release_date
        description: The file's latest publication date; the latest across files carrying the window.
        data_tests: [not_null]
      - name: release_file_count
        description: Distinct files that carry the window in any release.

  - name: int_hai_state_windows
    description: >
      One HAI state row per entity, measure ID and measurement window, from the file with the latest stored release
      (BRZ-002; failure modes 230 to 236, data/lakehouse_planning/hai_windows_20261004/failure_modes.md). Windows whose
      latest release holds two rows are held in int_hai_window_holds instead.
    columns:
      - name: window_key
        description: Entity, measure ID, window start and window end, the model's key.
        data_tests: [unique, not_null]
      - name: entity_id
        description: The two-letter state code.
        data_tests: [not_null]
      - name: measure_id
        description: The CMS measure ID.
        data_tests: [not_null]
      - name: window_start
        description: First day of the measurement window, parsed from m/d/yyyy.
        data_tests: [not_null]
      - name: window_end
        description: Last day of the measurement window.
        data_tests: [not_null]
      - name: measure_name
        description: The measure name as published in the chosen row.
      - name: score
        description: The published score, as text; typing happens in later models.
      - name: footnote
        description: The published footnote code, as text.
      - name: member_sha256
        description: SHA-256 of the file the chosen row comes from.
        data_tests: [not_null]
      - name: object_key
        description: Object key of the loaded copy of that file.
      - name: release_date
        description: The file's latest publication date; the latest across files carrying the window.
        data_tests: [not_null]
      - name: release_file_count
        description: Distinct files that carry the window in any release.

  - name: int_hai_national_windows
    description: >
      One HAI national row per entity, measure ID and measurement window, from the file with the latest stored release
      (BRZ-002; failure modes 230 to 236, data/lakehouse_planning/hai_windows_20261004/failure_modes.md). Windows whose
      latest release holds two rows are held in int_hai_window_holds instead.
    columns:
      - name: window_key
        description: Entity, measure ID, window start and window end, the model's key.
        data_tests: [unique, not_null]
      - name: entity_id
        description: Always US.
        data_tests: [not_null]
      - name: measure_id
        description: The CMS measure ID.
        data_tests: [not_null]
      - name: window_start
        description: First day of the measurement window, parsed from m/d/yyyy.
        data_tests: [not_null]
      - name: window_end
        description: Last day of the measurement window.
        data_tests: [not_null]
      - name: measure_name
        description: The measure name as published in the chosen row.
      - name: score
        description: The published score, as text; typing happens in later models.
      - name: footnote
        description: The published footnote code, as text.
      - name: member_sha256
        description: SHA-256 of the file the chosen row comes from.
        data_tests: [not_null]
      - name: object_key
        description: Object key of the loaded copy of that file.
      - name: release_date
        description: The file's latest publication date; the latest across files carrying the window.
        data_tests: [not_null]
      - name: release_file_count
        description: Distinct files that carry the window in any release.

  - name: int_hai_window_holds
    description: >
      HAI rows the window models leave out, by reason: no_key, unparsed_date, label_held, undated_release,
      same_date_conflict (two files at the latest release date) or repeated_in_file (failure modes 232 to 235).
    columns:
      - name: bronze_table
        description: The bronze HAI table the rows come from.
        data_tests: [not_null]
      - name: hold_reason
        description: Why the rows are left out.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [no_key, unparsed_date, label_held, undated_release, same_date_conflict, repeated_in_file]
      - name: entity_id
        description: The entity, when the rows have one.
      - name: measure_id
        description: The measure ID, when the rows have one.
      - name: window_start
        description: The window start, for window-level holds.
      - name: window_end
        description: The window end, for window-level holds.
      - name: row_count
        description: Rows left out for this reason and key.
        data_tests: [not_null]

  - name: int_pos_hospital_snapshots
    description: >
      One Provider of Services hospital row (category 01) per CCN and snapshot, the snapshot dated by the catalog
      coverage in the pos_file_periods seed (failure modes 280 to 292, data/lakehouse_planning/hospital_spine_20261005/
      failure_modes.md). Codes are left-padded, the county is 5-character FIPS from both padded parts, counts, switches
      and dates are typed; values that do not fit their kind are null and fail assert_pos_values_cast. Every hospital
      row stays; the population flags let later models filter.
    columns:
      - name: snapshot_key
        description: CCN (or the raw provider number when it is not a valid CCN) and the snapshot's period end.
        data_tests: [unique, not_null]
      - name: ccn
        description: The CMS Certification Number, 6 characters of digits and capital letters; null when the provider number is not.
        data_tests: [not_null]
      - name: provider_number
        description: The provider number as published.
      - name: period_start
        description: First day of the snapshot's catalog coverage.
        data_tests: [not_null]
      - name: period_end
        description: Last day of the snapshot's catalog coverage, the snapshot date.
        data_tests: [not_null]
      - name: member_sha256
        description: SHA-256 of the POS file.
        data_tests: [not_null]
      - name: state_code
        description: The POS state code (includes territories, CN and MX).
      - name: county_fips
        description: 5-character county FIPS from the padded FIPS state and county codes; the primary hospital-to-county route.
      - name: ssa_county_code
        description: 5-character SSA state and county code.
      - name: provider_subtype_code
        description: POS provider subtype, 2 characters (01 short term, 11 critical access, and others).
      - name: control_type_code
        description: POS type of control (ownership), 2 characters.
      - name: termination_code
        description: POS termination code; 00 is active.
      - name: is_active
        description: True when the termination code is 00.
      - name: is_state_or_dc
        description: True for the 50 states and DC, the approved universe.
        data_tests: [not_null]
      - name: is_connecticut
        description: True for Connecticut, which stays out of county-level joins (Oct 1 2026).
        data_tests: [not_null]
      - name: is_critical_access_by_ccn
        description: True when CCN positions 3 and 4 are 13 (approved addition to Decision 4).
        data_tests: [not_null]
      - name: is_veterans_affairs
        description: True when the CCN ends in F, a Veterans Health Administration hospital, excluded from the primary model.
        data_tests: [not_null]

  - name: int_cmi_file_rows
    description: >
      Every row of the selected case-mix index files and sheets (label families in the cmi_families variable), split
      into fields (failure modes 293, 295 and 299).
    columns:
      - name: member_sha256
        description: SHA-256 of the file.
        data_tests: [not_null]
      - name: line_number
        description: Line or sheet row number.
        data_tests: [not_null]

  - name: int_cmi_file_layouts
    description: >
      One row per case-mix index file or sheet: header or headerless, and each field's position by exact header name
      from the cmi_layout_columns seed (failure modes 294, 295 and 297).
    columns:
      - name: layout_key
        description: Bronze table, file checksum and sheet name.
        data_tests: [unique, not_null]

  - name: int_cmi_hospital_rows
    description: >
      One row per CCN in each selected case-mix index file and each rule year and stage its copies are labelled with
      (failure modes 293 to 304). The CMI is the unadjusted one; the transfer-adjusted CMI and cases are separate columns
      and are never substituted (Decision 4). The data fiscal year comes only from the file's name, otherwise null.
    columns:
      - name: cmi_row_key
        description: Bronze table, file checksum, sheet, row, rule year and rule stage.
        data_tests: [unique, not_null]
      - name: ccn
        description: The CCN, 6 characters; a 5-digit workbook value is left-padded.
        data_tests: [not_null]
      - name: rule_fiscal_year
        description: The payment-rule fiscal year the file was published with.
        data_tests: [not_null]
      - name: data_fiscal_year
        description: The discharge fiscal year of the CMI data, when the file name states it.
      - name: rule_stage
        description: correction, final, proposed or unspecified, from the generated label.
      - name: cmi
        description: The unadjusted case-mix index at source precision.
      - name: cmi_source_value
        description: The published CMI text, quotes and separators removed.
      - name: transfer_adjusted_cmi
        description: The transfer-adjusted CMI where the file publishes it; a different measure.

  - name: int_cmi_hospital_years
    description: >
      One case-mix index per CCN and payment-rule fiscal year from the files of the year's best rule stage (correction,
      final, interim, proposed, notice, unspecified); disagreeing CCN-years are in int_cmi_holds instead (failure modes
      300 to 302).
    columns:
      - name: year_key
        description: CCN and rule fiscal year.
        data_tests: [unique, not_null]
      - name: cmi
        description: The chosen unadjusted CMI.
        data_tests: [not_null]
      - name: file_count
        description: Best-stage files that carry the CCN in that rule year and agree.

  - name: int_cmi_hospital_data_years
    description: >
      One case-mix index per CCN and discharge (data) fiscal year, from the latest rule year that publishes the data year,
      then that rule year's best stage; only data years stated in the file names count (failure modes 310 to 312). The
      FY 2020 data year comes from the FY 2023 proposed rule, the only file that publishes it.
    columns:
      - name: year_key
        description: CCN and data fiscal year.
        data_tests: [unique, not_null]
      - name: data_fiscal_year
        description: The discharge fiscal year of the CMI data.
        data_tests: [not_null]
      - name: rule_fiscal_year
        description: The payment-rule fiscal year of the file the CMI comes from.
        data_tests: [not_null]
      - name: cmi
        description: The chosen unadjusted CMI.
        data_tests: [not_null]

  - name: int_cmi_holds
    description: >
      CCN and year pairs whose chosen CMI rows disagree on the CMI or the data year; no CMI is chosen (failure modes 301
      and 312). The year basis is rule (int_cmi_hospital_years) or data (int_cmi_hospital_data_years).
    columns:
      - name: year_key
        description: Year basis, CCN and fiscal year.
        data_tests: [unique, not_null]
      - name: year_basis
        description: rule or data.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [rule, data]
      - name: fiscal_year
        description: The rule or data fiscal year, by the year basis.
        data_tests: [not_null]
      - name: hold_reason
        description: values_disagree.
        data_tests: [not_null]

  - name: int_hospital_spine
    description: >
      One row per hospital (CCN) and calendar-year HAI window (2018, 2019 and 2021 to 2024 in the stored releases), as of
      the window start (owner decision, Oct 5 2026): the POS snapshot that ends in the 12 months before the window, the CMI
      of the fiscal year that ends before it and the population flags (failure modes 306 to 317). Primary population:
      a CMI, a POS state in the 50 states and DC, no Veterans Health Administration, no critical access and no Maryland
      hospital (Maryland is paid under its own all-payer model; owner decision, Oct 5 2026). The sensitivity population
      adds critical access and Maryland hospitals. Connecticut stays in both and is flagged for county joins.
    columns:
      - name: spine_key
        description: CCN and window year.
        data_tests: [unique, not_null]
      - name: ccn
        description: The CCN from the HAI windows.
        data_tests: [not_null]
      - name: window_year
        description: The calendar year of the HAI window.
        data_tests: [not_null]
      - name: pos_period_end
        description: End of the POS snapshot used; null when the hospital is not in the snapshot before the window.
      - name: cmi
        description: The unadjusted CMI of the fiscal year that ends before the window; null when absent or held.
      - name: cmi_data_fiscal_year
        description: The CMI's discharge fiscal year, the window year minus 1.
      - name: is_cmi_held
        description: True when the CMI of that data year is held in int_cmi_holds.
        data_tests: [not_null]
      - name: is_maryland
        description: True when the POS state is Maryland; out of the primary population, in the sensitivity run.
        data_tests: [not_null]
      - name: is_primary_population
        description: In the primary model population.
        data_tests: [not_null]
      - name: is_sensitivity_population
        description: In the sensitivity-run population (adds critical access and Maryland hospitals).
        data_tests: [not_null]

  - name: int_cc_timely_effective_windows
    description: >
      One Care Compare timely and effective care row per hospital, measure and measurement window, from the latest stored
      release, by the same window macros as the HAI windows; conflicts are held in int_cc_window_holds (failure modes 318
      to 322, data/lakehouse_planning/group_b_20261005/failure_modes_b1.md). Values stay as published text.
    columns:
      - name: window_key
        description: Entity, measure ID, window start and window end.
        data_tests: [unique, not_null]

  - name: int_cc_maternal_windows
    description: >
      One Care Compare maternal health row per hospital, measure and measurement window, from the latest stored release
      (failure modes 318 to 322). The table has only facility_id, start_date and end_date.
    columns:
      - name: window_key
        description: Entity, measure ID, window start and window end.
        data_tests: [unique, not_null]

  - name: int_cc_hcahps_windows
    description: >
      One Care Compare HCAHPS row per hospital, HCAHPS measure ID and measurement window, from the latest stored release;
      the answer percent, linear mean, star rating, completed surveys and response rate each keep their own column and
      footnote (failure modes 318 to 322).
    columns:
      - name: window_key
        description: Entity, HCAHPS measure ID, window start and window end.
        data_tests: [unique, not_null]

  - name: int_cc_window_holds
    description: >
      Care Compare measure rows the window models leave out, with the reason and row count (failure modes 319 and 322).
    columns:
      - name: hold_reason
        description: no_key, unparsed_date, label_held, undated_release, same_date_conflict or repeated_in_file.
        data_tests: [not_null]

  - name: int_registry_measure_windows
    description: >
      One row per registry measure control of families S14 to S16, hospital and measurement window, for exactly the measure
      ID and value column the registry_measure_sources seed names (failure modes 323 to 327). value_number is set only for
      plain numbers; categories and tokens stay in value_text. Staging a measure does not make it a predictor.
    columns:
      - name: registry_window_key
        description: Measure control, entity, window start and window end.
        data_tests: [unique, not_null]
      - name: measure_control
        description: The registry measure control ID.
        data_tests: [not_null]

  - name: int_hgi_hospital_releases
    description: >
      One Hospital General Information row per CCN and stored file, with the file's release date and the number of files
      on that date (failure modes 328 and 329). The overall rating (registry C284, excluded from the primary predictors) is
      an integer 1 to 5 or null with the text and footnote kept; emergency services is a boolean.
    columns:
      - name: release_key
        description: CCN and file checksum.
        data_tests: [unique, not_null]
      - name: ccn
        description: facility_id, or provider_id in the older layout.
        data_tests: [not_null]
      - name: release_date
        description: The file's latest publication date.
        data_tests: [not_null]

  - name: int_cost_reports
    description: >
      One row per hospital cost report (HCRIS public use file, registry family S01), assigned to the federal fiscal year in
      which the report period starts (Decision 2, approved Oct 1 2026; failure modes 331 to 338). Every report stays, with the
      number of reports of its CCN in that fiscal year; the alignment step chooses between them. Amounts are typed and never
      scaled to 365 days. ZIP is the first 5 digits of a 5-digit ZIP, a ZIP with one trailing hyphen or a hyphenated ZIP+4,
      else null with zip_code_raw kept; rural_urban is urban for U, rural for R, else null with the raw code kept.
    columns:
      - name: rpt_rec_num
        description: The report record number.
        data_tests: [unique, not_null]
      - name: ccn
        description: provider_ccn when it is 6 characters, else null.
        data_tests: [not_null]
      - name: fiscal_year
        description: >
          The federal fiscal year in which the period starts (October to December count toward the next year); the test
          assert_cost_report_fiscal_years fails when it differs from the year in the file name.
      - name: reporting_days
        description: Inclusive days from period_begin to period_end.
      - name: is_full_year
        description: The period ends the day before the anniversary of its start (1 March for a 29 February start).
      - name: reports_in_fiscal_year
        description: The number of reports of this CCN in this fiscal year.

  - name: int_cost_report_measures
    description: >
      One row per cost report and registry measure control of family S01 whose numerator the report publishes, computed by
      the cost_report_measures seed (failure modes 339 and 340): value, code, ratio, per_day (numerator over reporting days)
      or ratio_per_day_denominator (numerator over the denominator per reporting day). A zero or missing denominator gives a
      null value_number, never infinity. Staging a measure does not make it a predictor; review_decision is the registry's.
    columns:
      - name: measure_key
        description: Report record number and measure control.
        data_tests: [unique, not_null]
      - name: measure_control
        description: The registry measure control ID.
        data_tests: [not_null]

  - name: int_impact_file_rows
    description: >
      Every row of the selected IPPS impact public use files of the reviewed families (impact_families), split into fields:
      tab-separated text on tabs, other text as comma-separated values with quoted fields, sheet rows by cell; variable
      description and layout sheets are not read (failure modes 342, 344 and 348).

  - name: int_impact_file_layouts
    description: >
      One row per read impact file or sheet: the header row (the first of the first 5 rows naming a CCN column) and each
      field's position by exact header name from the impact_layout_columns seed (failure modes 343 to 347 and 352).
      assert_impact_files_have_layout fails for a file without one CCN column or with two columns for one field.
    columns:
      - name: layout_key
        description: Bronze table, file checksum and sheet name.
        data_tests: [unique, not_null]

  - name: int_impact_hospital_rows
    description: >
      One row per hospital row of a readable impact file or sheet: a row after the header whose first field is a CCN (a
      5-digit workbook CCN gets its leading zero back), with the number of rows of that CCN in the release (failure modes
      350 and 351).
    columns:
      - name: hospital_row_key
        description: Bronze table, file checksum, sheet name and line number.
        data_tests: [unique, not_null]

  - name: int_impact_holds
    description: >
      One row per impact-file release and CCN held because the CCN appears in more than one row of the release; none of
      its rows is read (failure mode 351).
    columns:
      - name: hold_key
        description: File checksum, sheet name and CCN.
        data_tests: [unique, not_null]

  - name: int_impact_hospital_values
    description: >
      One row per impact-file release (file and sheet), CCN and mapped field, for CCNs that appear once in the release
      (failure modes 349 to 352). value_text is the published text (a SAS missing dot stays as text); value_number is set
      only for a plain number in a numeric field, or a plain number with a percent sign divided by 100. The wage index is
      mapped from FY 2011 only (346). Choosing a release for a hospital-year waits for the alignment step.
    columns:
      - name: value_key
        description: File checksum, sheet name, CCN and field.
        data_tests: [unique, not_null]
      - name: ccn
        description: The hospital CCN, 6 characters.
        data_tests: [not_null]

  - name: int_impact_measures
    description: >
      One row per impact-file release, CCN and registry measure field of source CMS_IPPS (family S04) whose value is
      published, by the impact_measures seed (failure mode 353): value, code or ratio (C040, average daily census over beds;
      a zero or missing denominator gives null). Staging a measure does not make it a predictor.
    columns:
      - name: measure_key
        description: File checksum, sheet name, CCN, measure control and field.
        data_tests: [unique, not_null]
      - name: measure_control
        description: The registry measure control ID.
        data_tests: [not_null]

  - name: int_mup_providers
    description: >
      One row per Medicare inpatient provider summary (CCN) and file, with the data year and release year from the file
      name (any case) and every numeric column typed; a blank (suppressed) value is null (failure modes 355 to 359). The
      chronic-condition shares are published from data year 2017.
    columns:
      - name: provider_key
        description: File checksum and CCN.
        data_tests: [unique, not_null]
      - name: ccn
        description: rndrng_prvdr_ccn, 6 characters.
        data_tests: [not_null]

  - name: int_mup_drg_discharges
    description: >
      One row per Medicare inpatient provider, DRG and file, with the data and release years from the file name and the
      published discharges and averages typed; cells under 11 discharges are not published (failure modes 355, 356, 359
      and 362).
    columns:
      - name: drg_key
        description: File checksum, CCN and DRG code.
        data_tests: [unique, not_null]

  - name: int_mup_measures
    description: >
      One row per Medicare inpatient provider summary and registry measure field of sources CMS-MUP-PROVIDER and
      CMS_MEDICARE_PROVIDER (family S08) whose value or numerator is published, by the mup_measures seed: value, ratio (a
      null or zero denominator gives null) or drg_share (C117, the published discharges of DRG 870 to 872 over the provider
      total in the same data year, from the year's one DRG file, which can be an earlier release; small cells are not
      published, so the share can be low). C084 has one row per race field; held and closed controls give no rows
      (failure modes 356, 357 and 360 to 363). Staging a measure does not make it a predictor.
    columns:
      - name: measure_key
        description: File checksum, CCN, measure control and field.
        data_tests: [unique, not_null]
      - name: measure_control
        description: The registry measure control ID.
        data_tests: [not_null]

  - name: int_hospital_owner_rows
    description: >
      One row per organisation owner row and owner file (release), with the release label and catalog period from the
      ownership_release_periods seed. A flag is true for Y and false for N; a blank flag, and every flag of a file in the
      layout before April 2025, is null; flags_published says whether the file has the private-equity column. Dates and
      shares are typed (failure modes 365 to 371). Choosing a release for a hospital-year waits for the alignment step.
    columns:
      - name: owner_row_key
        description: File checksum and source row number.
        data_tests: [unique, not_null]
      - name: enrollment_id
        description: The hospital's enrollment ID, which links the owner to its enrollment row.
        data_tests: [not_null]
      - name: period_end
        description: Last day of the release's catalog period.
        data_tests: [not_null]
      - name: flags_published
        description: True when the file has the private-equity column (the April 2025 layout and later).
      - name: percentage_ownership
        description: The published share, 0 to 100; null when blank.

  - name: int_hospital_enrollment_rows
    description: >
      One row per hospital enrollment and enrollment file (release), with the release label and catalog period. The CCN
      is the published 6-character CCN or a 5-digit CCN padded to 6; any other value gives a null CCN, and ccn_published
      keeps the published value. A flag is true for Y and false for N; dates are typed (failure modes 365, 366 and 369 to
      371).
    columns:
      - name: enrollment_key
        description: File checksum and enrollment ID.
        data_tests: [unique, not_null]
      - name: period_end
        description: Last day of the release's catalog period.
        data_tests: [not_null]
      - name: ccn
        description: The CCN, 6 characters; null when the published value is not a CCN.

  - name: int_change_of_ownership_rows
    description: >
      One row per change of ownership and change-of-ownership file (release), with the release label and catalog period.
      Each release lists events back to 2016, so one event appears in several files under one event_key; the alignment
      step chooses the release. CCNs follow the enrollment rule, the published values kept (failure modes 365 and 369 to
      372).
    columns:
      - name: chow_row_key
        description: File checksum and source row number.
        data_tests: [unique, not_null]
      - name: event_key
        description: Buyer enrollment ID, seller enrollment ID, effective date and type, joined by |.
        data_tests: [not_null]
      - name: period_end
        description: Last day of the release's catalog period.
        data_tests: [not_null]

  - name: int_hhs_capacity_weeks
    description: >
      One row per HHS hospital (hospital_pk) and collection week, 2019-12-29 to 2024-04-21, with every weekly number typed.
      A count of 1 to 3 is published as -999999: it is null and its column is listed in suppressed_fields; any other
      negative value is null and listed in negative_fields. The CCN follows the B5a rule; a hospital without one keeps its
      hospital_pk. is_corrected and the coverage counts are kept (failure modes 375 to 379).
    columns:
      - name: week_key
        description: hospital_pk and collection week.
        data_tests: [unique, not_null]
      - name: collection_week
        description: First day of the collection week.
        data_tests: [not_null]
      - name: suppressed_fields
        description: The numeric columns published as -999999 (a count of 1 to 3) in this row, sorted.
      - name: negative_fields
        description: The numeric columns published with another negative value in this row, sorted; their values are null.

  - name: int_onc_chpl_linkage_rows
    description: >
      One row per hospital, program year, performance period and certified product of the ONC Promoting Interoperability
      linkage (2023 and 2024). The criterion is true for Y, false for N and null when blank; the telephone column is left
      out (failure modes 380 to 382).
    columns:
      - name: linkage_key
        description: Facility ID, program year, start and end dates and CHPL ID, joined by |.
        data_tests: [unique, not_null]
      - name: program_year
        description: The program year.
        data_tests: [not_null]

  - name: int_onc_attestation_rows
    description: >
      One row per hospital Medicare and Medicaid EHR incentive attestation, program years 2011 to 2017: a series apart
      from the CHPL linkage, with no registry control (failure mode 383).
    columns:
      - name: attestation_key
        description: File checksum and source row number.
        data_tests: [unique, not_null]

  - name: int_occmix_file_rows
    description: Selected occupational-mix rows with raw fields and source lineage. Public data. File and sheet selection preserve existing holds.
    columns:
      - name: source_row_key
        description: Bronze table, checksum, sheet and row number.
        data_tests: [unique, not_null]

  - name: int_occmix_file_layouts
    description: Exact normalized survey header positions per file and sheet. CBSA and S-3 layouts are distinct from survey layouts.
    columns:
      - name: layout_key
        description: Bronze table, checksum and sheet.
        data_tests: [unique, not_null]
      - name: is_survey_layout
        description: All nine required provider, date, salary and paid-hour headers are present.
        data_tests: [not_null]

  - name: int_occmix_survey_rows
    description: >
      Public occupational survey rows per file, sheet and source row. FROM and TO define the survey period.
      Payment rule years remain separate. Deleted records, invalid identifiers, invalid dates and duplicate
      provider-period rows yield no derived values. No source revision is selected for a hospital-period feature.
    columns:
      - name: survey_row_key
        description: Bronze table, checksum, sheet and source row number.
        data_tests: [unique, not_null]
      - name: ccn_published
        description: Published provider identifier before normalization.
      - name: survey_start_date
        description: FROM date, parsed from M/D/YYYY or a workbook ISO midnight timestamp. A missing or invalid value holds the row.
      - name: survey_end_date
        description: TO date, parsed from M/D/YYYY or a workbook ISO midnight timestamp. A missing or invalid value holds the row.
      - name: field_values
        description: Published cells retained in source order, including missing tokens.
      - name: hold_reason
        description: A deletion, invalid key, invalid period or duplicate provider-period row.
        data_tests:
          - accepted_values:
              arguments:
                values: [deleted_survey_record, invalid_provider_id, invalid_survey_period, duplicate_provider_period]
      - name: rn_paid_hour_wage
        description: RN salary dollars divided by positive RN paid hours. It is not a productive-hour wage.
      - name: rn_paid_hour_share
        description: RNHR divided by positive nursehr. Paid hours are not bedside hours per patient-day.
      - name: lpnst_paid_hour_share
        description: Combined LPN/LVN and surgical-technologist paid hours divided by positive nursehr.
      - name: naorat_paid_hour_share
        description: NAORATHR divided by positive nursehr.

  - name: int_occmix_measures
    description: >
      Six S03 registry controls per survey row. C030 to C034 retain conditional definitions and review decisions.
      C043 is unavailable from this source and always null. Staging does not approve model use or resolve source timing.
    columns:
      - name: measure_key
        description: Survey row key and measure control.
        data_tests: [unique, not_null]
      - name: measure_control
        description: Registry control identifier.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [C030, C031, C032, C033, C034, C043]
      - name: source_status
        description: Conditional availability or an unavailable source definition.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [available_conditional, unavailable_source_definition]
