      validation only.
    columns:
      - name: program_key
        description: Hospital and fiscal year.
        data_tests: [unique, not_null]
      - name: unweighted_normalized_clinical_care_domain_score_number
        description: unweighted_normalized_clinical_care_domain_score when it is a plain number; tokens and the reviewed odd value give null (checked by assert_validation_values_cast).
      - name: weighted_normalized_clinical_care_domain_score_number
        description: weighted_normalized_clinical_care_domain_score when it is a plain number; tokens and the reviewed odd value give null (checked by assert_validation_values_cast).
      - name: unweighted_normalized_clinical_outcomes_domain_score_number
        description: unweighted_normalized_clinical_outcomes_domain_score when it is a plain number; tokens and the reviewed odd value give null (checked by assert_validation_values_cast).
      - name: weighted_normalized_clinical_outcomes_domain_score_number
        description: weighted_normalized_clinical_outcomes_domain_score when it is a plain number; tokens and the reviewed odd value give null (checked by assert_validation_values_cast).
      - name: unweighted_person_and_community_engagement_domain_score_number
        description: unweighted_person_and_community_engagement_domain_score when it is a plain number; tokens and the reviewed odd value give null (checked by assert_validation_values_cast).
