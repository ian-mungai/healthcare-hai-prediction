version: 2

models:
  - name: fct_cmi_observation
    description: >-
      One row per int_cmi_hospital_rows row, grain cmi_row_key: every silver column unchanged, then 2 surrogate keys.
    columns:
      - name: cmi_row_key
        description: The silver unique key.
        data_tests:
          - unique
          - not_null
      - name: hospital_sk
        description: Key of dim_hospital for ccn; the unknown member when the natural key is null or unmatched.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hospital')
                field: hospital_sk
      - name: release_sk
        description: Key of dim_release for member_sha256; the unknown member when the natural key is null or unmatched.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_release')
                field: release_sk
    data_tests:
      - dbt_utils.equality:
          name: fct_cmi_observation_values_equal_silver
          arguments:
            compare_model: ref('int_cmi_hospital_rows')
            exclude_columns:
              - hospital_sk
              - release_sk
      - dbt_utils.expression_is_true:
          name: fct_cmi_observation_keys_follow_natural_keys
          arguments:
            expression: >-
              hospital_sk = coalesce((select max(found.lookup_sk) from (select hospital_sk as lookup_sk, ccn as
              lookup_natural from {{ ref('dim_hospital') }}) as found where found.lookup_natural = cast(ccn as
              varchar)), md5('<unknown>')) and release_sk = coalesce((select max(found.lookup_sk) from (select
              release_sk as lookup_sk, member_sha256 as lookup_natural from {{ ref('dim_release') }}) as found where
              found.lookup_natural = cast(member_sha256 as varchar)), md5('<unknown>'))
      - dbt_utils.expression_is_true:
          name: fct_cmi_observation_source_dates_typed
          arguments:
            expression: >-
              typeof(rule_fiscal_year) = 'INTEGER' and typeof(data_fiscal_year) = 'INTEGER'
      - dbt_utils.expression_is_true:
          name: fct_cmi_observation_published_text_typed
          arguments:
            expression: >-
              typeof(cases_text) = 'VARCHAR' and typeof(relative_weights_text) = 'VARCHAR' and
              typeof(transfer_adjusted_cmi_text) = 'VARCHAR' and typeof(transfer_adjusted_cases_text) = 'VARCHAR'
