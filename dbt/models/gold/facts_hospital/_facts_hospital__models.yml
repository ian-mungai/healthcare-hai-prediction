              varchar)), md5('<unknown>')) and release_sk = coalesce((select max(found.lookup_sk) from (select
              release_sk as lookup_sk, member_sha256 as lookup_natural from {{ ref('dim_release') }}) as found where
              found.lookup_natural = cast(member_sha256 as varchar)), md5('<unknown>')) and state_sk = coalesce((select
              max(found.lookup_sk) from (select state_sk as lookup_sk, state_code as lookup_natural from {{
              ref('dim_state') }}) as found where found.lookup_natural = cast(state as varchar)), md5('<unknown>')) and
              zip_sk = coalesce((select max(found.lookup_sk) from (select zip_sk as lookup_sk, zip_code as
