version: 2

models:
  - name: fct_cc_window_hold
    description: >-
      The silver model int_cc_window_holds with every column unchanged and one surrogate key per dimension it joins. One row per hold_key. Keeps
      every row of the silver hold model exactly, with the checksums of the files that contributed to it.
    columns:
      - name: hold_key
        description: The row key of the silver model.
        data_tests:
          - unique
          - not_null
      - name: hospital_sk
        description: Key of dim_hospital; the unknown member for a null or unmatched entity_id.
        data_tests:
          - not_null
          - relationships:
              name: fct_cc_window_hold_hospital_sk_in_dim_hospital
              arguments:
                to: ref('dim_hospital')
                field: hospital_sk
    data_tests:
      - dbt_utils.expression_is_true:
          name: fct_cc_window_hold_hospital_sk_matches_dimension
          arguments:
            expression: >-
              hospital_sk not in (select hospital_sk from {{ ref('dim_hospital') }}) or hospital_sk = case when md5(cast(entity_id as
              varchar)) in (select hospital_sk from {{ ref('dim_hospital') }}) then md5(cast(entity_id as varchar)) else
              md5('<unknown>') end
      - dbt_utils.equality:
          name: fct_cc_window_hold_equals_silver
          arguments:
            compare_model: ref('int_cc_window_holds')
            compare_columns:
              - bronze_table
              - hold_reason
              - entity_id
              - measure_id
              - window_start
              - window_end
              - row_count
              - hold_key
              - member_sha256s
      - dbt_utils.expression_is_true:
          name: fct_cc_window_hold_source_dates_typed
          arguments:
            expression: typeof(window_start) = 'DATE' and typeof(window_end) = 'DATE'
