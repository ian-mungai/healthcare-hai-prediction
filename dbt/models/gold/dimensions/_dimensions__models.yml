                natural_key: code
                expected: '''<unknown>'''
          - surrogate_key_matches_natural_key:
              arguments:
                natural_key: concat_ws('|', code_system, code)
      - name: code_system
        description: The silver model and column the code comes from. The unknown member holds '<unknown>'.
        data_tests:
          - not_null
      - name: code
        description: The code as published.
        data_tests:
