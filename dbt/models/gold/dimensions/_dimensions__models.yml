  - name: dim_county
    description: One row per 5-character county FIPS that a fact's county key carries, plus the unknown member (natural key '<unknown>'). The
      Connecticut planning region and the retired Alaska code flag are deferred (amendment A36).
    meta:
      classification: Public
    columns:
      - name: county_sk
        description: 'Surrogate key: the md5 of the natural key''s text. The unknown member''s key is md5(''<unknown>''), the value a fact takes
          for a null or unmatched natural key.'
        data_tests:
          - unique
          - not_null
          - unknown_member_once
          - unknown_member_natural_key:
              arguments:
                natural_key: county_fips
                expected: '''<unknown>'''
          - surrogate_key_matches_natural_key:
              arguments:
                natural_key: county_fips
      - name: county_fips
        description: The natural key as published. The unknown member holds '<unknown>'.
        data_tests:
          - unique
          - not_null
          - dimension_membership:
              name: dimension_membership_dim_county
              arguments:
                sk_column: county_sk
                sources:
                  - model: int_acs_county_values
                    column: county_fips
                  - model: int_bls_county_series
                    column: county_fips
                  - model: int_gv_county_values
                    column: county_fips
                  - model: int_hpsa_components
                    column: county_fips
                  - model: int_mmd_prevalence
                    column: county_fips
                  - model: int_mua_components
                    column: county_fips
                  - model: int_places_county_values
                    column: county_fips
                  - model: int_pos_hospital_snapshots
                    column: county_fips
                  - model: int_ruca_codes
                    column: county_fips
                  - model: int_rucc_county_codes
                    column: county_fips
                  - model: int_sahie_county_rows
                    column: county_fips
                  - model: int_saipe_county_estimates
                    column: county_fips
                  - model: int_svi_county_values
                    column: county_fips
                  - model: int_wonder_county_deaths
                    column: county_fips
                space: length(natural_key) = 5
  - name: dim_date
    description: One row per day from the earliest to the latest DATE source date of the facts, plus the unknown member. The natural key is the
      date.
    meta:
      classification: Confidential
    columns:
      - name: date_sk
        description: 'Surrogate key: the md5 of the natural key''s text. The unknown member''s key is md5(''<unknown>''), the value a fact takes
          for a null or unmatched natural key.'
        data_tests:
          - unique
          - not_null
          - unknown_member_once
          - unknown_member_natural_key:
              arguments:
                natural_key: calendar_date
                expected: 'null'
          - surrogate_key_matches_natural_key:
              arguments:
                natural_key: calendar_date
      - name: calendar_date
        description: 'The day. Null on the unknown member: the one exception to the ''<unknown>'' natural key (amendment A40 item 1) because the
          key is a DATE.'
        data_tests:
          - unique
      - name: iso_year
        description: ISO 8601 year of the day.
      - name: iso_week
        description: ISO 8601 week of the day.
      - name: month_number
        description: Calendar month, 1 to 12.
      - name: quarter_number
        description: Calendar quarter, 1 to 4.
      - name: calendar_year
        description: Calendar year.
      - name: federal_fiscal_year
        description: 'Federal fiscal year: October 1 starts the next fiscal year.'
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: calendar_date is null or federal_fiscal_year >= calendar_year
      - dim_date_attributes
