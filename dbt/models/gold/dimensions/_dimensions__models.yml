                  - window_end
                  - release_date
              - model: int_cc_hcahps_windows
                column: entity_id
                dates:
                  - window_start
                  - window_end
                  - release_date
              - model: int_cc_hrrp_windows
                column: entity_id
                dates:
                  - window_start
                  - window_end
                  - release_date
              - model: int_cc_maternal_windows
                column: entity_id
                dates:
                  - window_start
                  - window_end
                  - release_date
              - model: int_cc_timely_effective_windows
                column: entity_id
                dates:
                  - window_start
                  - window_end
                  - release_date
              - model: int_cc_unplanned_visits_windows
                column: entity_id
                dates:
                  - window_start
                  - window_end
                  - release_date
              - model: int_cc_window_holds
                column: entity_id
                dates:
                  - window_start
                  - window_end
              - model: int_change_of_ownership_rows
                column: ccn_buyer
                dates:
                  - effective_date
                  - period_start
                  - period_end
              - model: int_change_of_ownership_rows
                column: ccn_seller
                dates:
