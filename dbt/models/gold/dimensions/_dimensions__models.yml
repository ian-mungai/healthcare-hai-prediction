  - name: dim_hospital
    description: One row per hospital CCN (6-character text) that a fact's hospital key carries, plus the unknown member. A state or national
      entity ID is not a hospital and takes the unknown member.
    meta:
      classification: Confidential
    columns:
      - name: hospital_sk
        description: 'Surrogate key: the md5 of the natural key''s text. The unknown member''s key is md5(''<unknown>''), the value a fact takes
          for a null or unmatched natural key.'
        data_tests:
          - unique
          - not_null
          - unknown_member_once
          - unknown_member_natural_key:
              arguments:
                natural_key: ccn
                expected: '''<unknown>'''
          - surrogate_key_matches_natural_key:
              arguments:
                natural_key: ccn
          - gold_fact_keys
      - name: ccn
        description: The CCN as published. The unknown member holds '<unknown>'.
        data_tests:
          - unique
          - not_null
          - dimension_membership:
              name: dimension_membership_dim_hospital
              arguments:
                sk_column: hospital_sk
                sources:
                  - model: int_cc_complications_deaths_windows
                    column: entity_id
                  - model: int_cc_hcahps_windows
                    column: entity_id
                  - model: int_cc_hrrp_windows
                    column: entity_id
                  - model: int_cc_maternal_windows
                    column: entity_id
                  - model: int_cc_timely_effective_windows
                    column: entity_id
                  - model: int_cc_unplanned_visits_windows
                    column: entity_id
                  - model: int_cc_window_holds
                    column: entity_id
                  - model: int_change_of_ownership_rows
                    column: ccn_buyer
                  - model: int_change_of_ownership_rows
                    column: ccn_seller
                  - model: int_cmi_hospital_rows
                    column: ccn
                  - model: int_cost_reports
                    column: ccn
                  - model: int_hac_program_years
                    column: ccn
                  - model: int_hai_hospital_windows
                    column: entity_id
                  - model: int_hai_window_holds
                    column: entity_id
                  - model: int_hgi_hospital_releases
                    column: ccn
                  - model: int_hhs_capacity_weeks
                    column: ccn
                  - model: int_hospital_enrollment_rows
                    column: ccn
                  - model: int_impact_holds
                    column: ccn
                  - model: int_impact_hospital_values
                    column: ccn
                  - model: int_mup_drg_discharges
                    column: ccn
                  - model: int_mup_providers
                    column: ccn
                  - model: int_occmix_survey_rows
                    column: ccn
                  - model: int_onc_attestation_rows
                    column: ccn
                  - model: int_onc_chpl_linkage_rows
                    column: ccn
                  - model: int_pos_hospital_snapshots
                    column: ccn
                  - model: int_validation_program_holds
                    column: ccn
                  - model: int_validation_window_holds
                    column: entity_id
                  - model: int_vbp_program_years
                    column: ccn
                space: length(natural_key) = 6
      - name: first_seen
        description: Earliest DATE value across the source dates of the facts that carry this hospital's key; null when no row has a typed date.
      - name: last_seen
        description: Latest DATE value across the same source dates; null when no row has a typed date.
    data_tests:
      - hospital_seen_dates:
          name: hospital_seen_dates_dim_hospital
          arguments:
            sources:
              - model: int_cc_complications_deaths_windows
                column: entity_id
                dates:
