version: 2

models:
  - name: bridge_county_neighbor
    description: One row per county, neighbor and vintage as Census publishes it, with every silver column unchanged.
    meta:
      classification: Public
    columns:
      - name: edge_key
        description: The row key of the silver model.
        data_tests:
          - unique
          - not_null
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('int_county_adjacency_edges')
  - name: bridge_measure_control
    description: 'Many-to-many of a measure identity (with its value column), a vintage range and a registry control: one row per bridge seed
      row with a non-empty measure key. The only gold model where registry controls meet the data.'
    meta:
      classification: Public
    columns:
      - name: measure_sk
        description: Key of dim_measure.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_measure')
                field: measure_sk
      - name: registry_control_sk
        description: Key of dim_registry_control.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_registry_control')
                field: registry_control_sk
      - name: measure_control
        description: The registry control ID.
        data_tests:
          - not_null
      - name: vintage_start
        description: First vintage the control reads for the identity; null when none.
      - name: vintage_end
        description: Last vintage the control reads for the identity; null when open.
      - name: source_seed
        description: The retired registry-map seed the row came from.
      - name: source_row
        description: The data row number of that seed, counted from 1.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - measure_sk
              - registry_control_sk
              - vintage_start
              - vintage_end
      - bridge_matches_seeds:
          name: bridge_matches_seeds_bridge_measure_control
          arguments:
            seeds:
              - registry_measure_sources_bridge
              - cost_report_measures_bridge
              - impact_measures_bridge
              - mup_measures_bridge
              - occmix_measures_bridge
              - validation_measures_bridge
              - hai_outcome_measures_bridge
              - hhs_onc_measures_bridge
              - ownership_measures_bridge
              - county_health_measures_bridge
              - acs_svi_measures_bridge
              - income_labor_measures_bridge
              - geography_measures_bridge
              - mmd_conditions_bridge
              - shortage_measures_bridge
  - name: bridge_zip_county
    description: One row per ZIP code, county and USPS quarter as HUD publishes it, with every silver column unchanged.
    meta:
      classification: Public
    columns:
      - name: hud_row_key
        description: The row key of the silver model.
        data_tests:
          - unique
          - not_null
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('int_hud_zip_county_quarters')
  - name: dim_census_tract
    description: One row per 11-digit census tract GEOID, plus the unknown member (natural key '<unknown>'). Read from the RUCA tract rows and
      the HPSA geography IDs that are 11 digits; any other HPSA ID takes the unknown member in the fact.
    meta:
      classification: Public
    columns:
      - name: census_tract_sk
        description: 'Surrogate key: the md5 of the natural key''s text. The unknown member''s key is md5(''<unknown>''), the value a fact takes
          for a null or unmatched natural key.'
        data_tests:
          - unique
          - not_null
          - unknown_member_once
          - unknown_member_natural_key:
              arguments:
                natural_key: census_tract_geoid
                expected: '''<unknown>'''
          - surrogate_key_matches_natural_key:
              arguments:
                natural_key: census_tract_geoid
      - name: census_tract_geoid
        description: The natural key as published. The unknown member holds '<unknown>'.
        data_tests:
          - unique
          - not_null
          - dimension_membership:
              name: dimension_membership_dim_census_tract
              arguments:
                sk_column: census_tract_sk
                sources:
                  - model: int_ruca_codes
                    column: geography_id
                    where: geography_type = 'tract'
                  - model: int_hpsa_components
                    column: geography_id
                space: regexp_matches(natural_key, '^[0-9]{11}$')
  - name: dim_change_type
    description: One row per (change of ownership type code system, code) as published, plus the unknown member.
    meta:
      classification: Confidential
    columns:
      - name: change_type_sk
        description: 'Surrogate key: the md5 of the natural key''s text. The unknown member''s key is md5(''<unknown>''), the value a fact takes
          for a null or unmatched natural key.'
        data_tests:
          - unique
          - not_null
          - unknown_member_once
          - unknown_member_natural_key:
              arguments:
                natural_key: code_system
                expected: '''<unknown>'''
          - unknown_member_natural_key:
              arguments:
                natural_key: code
                expected: '''<unknown>'''
          - surrogate_key_matches_natural_key:
              arguments:
                natural_key: concat_ws('|', code_system, code)
      - name: code_system
        description: The silver model and column the code comes from. The unknown member holds '<unknown>'.
        data_tests:
          - not_null
      - name: code
        description: The code as published.
        data_tests:
          - not_null
      - name: code_label
        description: The label from the paired silver column where silver has one; else null.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - code_system
              - code
  - name: dim_condition
