  - name: dim_owner_organization
    description: One row per 10-digit owner associate ID that a fact's owner key carries, plus the unknown member (natural key '<unknown>'). Names
      and flags stay on each release row.
    meta:
      classification: Confidential
    columns:
      - name: owner_organization_sk
        description: 'Surrogate key: the md5 of the natural key''s text. The unknown member''s key is md5(''<unknown>''), the value a fact takes
          for a null or unmatched natural key.'
        data_tests:
          - unique
          - not_null
          - unknown_member_once
          - unknown_member_natural_key:
              arguments:
                natural_key: associate_id
                expected: '''<unknown>'''
          - surrogate_key_matches_natural_key:
              arguments:
                natural_key: associate_id
      - name: associate_id
        description: The natural key as published. The unknown member holds '<unknown>'.
        data_tests:
          - unique
          - not_null
          - dimension_membership:
              name: dimension_membership_dim_owner_organization
              arguments:
                sk_column: owner_organization_sk
                sources:
                  - model: int_change_of_ownership_rows
                    column: associate_id_buyer
                  - model: int_change_of_ownership_rows
                    column: associate_id_seller
                  - model: int_hospital_owner_rows
                    column: associate_id
                space: regexp_matches(natural_key, '^[0-9]{10}$')
