                  - survey_end_date
              - model: int_onc_attestation_rows
                column: ccn
                dates: []
              - model: int_onc_chpl_linkage_rows
                column: ccn
                dates:
                  - start_date
                  - end_date
              - model: int_pos_hospital_snapshots
                column: ccn
                dates:
