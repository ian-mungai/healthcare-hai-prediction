  - name: dim_measure
    description: One row per measure identity (fact, measure_key, value_column), plus the unknown member.
    meta:
      classification: Public
    columns:
      - name: measure_sk
        description: 'Surrogate key: the md5 of the natural key''s text. The unknown member''s key is md5(''<unknown>''), the value a fact takes
          for a null or unmatched natural key.'
        data_tests:
          - unique
          - not_null
          - unknown_member_once
          - unknown_member_natural_key:
              arguments:
                natural_key: measure_identity
                expected: '''<unknown>'''
          - surrogate_key_matches_natural_key:
              arguments:
                natural_key: measure_identity
      - name: measure_identity
        description: 'The identity text: fact, measure key and value column joined by a vertical bar.'
        data_tests:
          - unique
          - not_null
      - name: fact
        description: The gold fact or bridge that holds the value.
      - name: measure_key
        description: The published measure ID or field of a long fact, or the column name of a wide fact.
      - name: value_column
        description: The column that holds the value.
      - name: measure_label
        description: The silver model's measure_name for the key where the model has one; else null.
      - name: unit
        description: The value_unit of int_mmd_prevalence for MMD rows; else null.
      - name: value_kind
        description: 'The type class of the silver column: number, text, boolean or date. Null on the unknown member.'
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - number
                  - text
                  - boolean
                  - date
      - name: vintage_start
        description: First vintage the identity holds, from the seeds; null when none.
      - name: vintage_end
