version: 2

models:
  - name: fct_acs_county_value
    description: One row per row of int_acs_county_values, every silver column unchanged, then the surrogate keys; silver test assert_county_context_values_cast checks the published values.
    meta:
      classification: Public
      fact_type: periodic_snapshot
    columns:
      - name: acs_value_key
        description: The row key of the silver model.
        data_tests:
          - unique
          - not_null
      - name: county_sk
        description: Key of dim_county; the unknown member for a null or unmatched county_fips.
        data_tests:
          - not_null
          - relationships:
              name: relationships_fct_acs_county_value_county_sk
              arguments:
                to: ref('dim_county')
                field: county_sk
      - name: release_sk
        description: Key of dim_release; the unknown member for a null or unmatched member_sha256.
        data_tests:
          - not_null
          - relationships:
              name: relationships_fct_acs_county_value_release_sk
              arguments:
                to: ref('dim_release')
                field: release_sk
      - name: value_number
        description: The silver column of the same name, unchanged.
        meta:
          additivity: non_additive
    data_tests:
      - dbt_utils.equality:
          name: equal_content_fct_acs_county_value
          arguments:
            compare_model: ref('int_acs_county_values')
            compare_columns:
              - member_sha256
              - source_row_number
              - bronze_table
              - vintage
              - concept_id
              - column_name
              - county_fips
              - value_published
              - value_number
              - missing_token
              - is_top_coded
              - is_bottom_coded
              - county_scope
              - acs_value_key
              - is_connecticut
      - dbt_utils.expression_is_true:
          name: keys_follow_natural_keys_fct_acs_county_value
          arguments:
            expression: >-
              county_sk is not distinct from coalesce((select any_value(lookup.sk) from (select county_sk as sk, county_fips as nk from {{ ref('dim_county') }} where county_fips <> '<unknown>') as lookup where lookup.nk = cast(county_fips as varchar)), md5('<unknown>'))
              and release_sk is not distinct from coalesce((select any_value(lookup.sk) from (select release_sk as sk, member_sha256 as nk from {{ ref('dim_release') }} where member_sha256 <> '<unknown>') as lookup where lookup.nk = cast(member_sha256 as varchar)), md5('<unknown>'))
      - dbt_utils.expression_is_true:
          name: typed_vintage_fct_acs_county_value
          arguments:
            expression: typeof(vintage) = 'VARCHAR'
      - dbt_utils.expression_is_true:
          name: typed_text_value_published_fct_acs_county_value
          arguments:
            expression: typeof(value_published) = 'VARCHAR'
      - dbt_utils.expression_is_true:
          name: typed_text_missing_token_fct_acs_county_value
          arguments:
            expression: typeof(missing_token) = 'VARCHAR'
