      fact_type: periodic_snapshot
    columns:
      - name: wonder_row_key
        description: The row key of the silver model.
        data_tests:
          - unique
          - not_null
      - name: county_sk
        description: Key of dim_county; the unknown member for a null or unmatched county_fips.
        data_tests:
          - not_null
          - relationships:
              name: relationships_fct_wonder_county_deaths_county_sk
              arguments:
                to: ref('dim_county')
                field: county_sk
      - name: release_sk
        description: Key of dim_release; the unknown member for a null or unmatched member_sha256.
        data_tests:
          - not_null
          - relationships:
              name: relationships_fct_wonder_county_deaths_release_sk
              arguments:
                to: ref('dim_release')
                field: release_sk
      - name: crude_rate
        description: The silver column of the same name, unchanged.
        meta:
          additivity: non_additive
      - name: crude_rate_lower_95
        description: The silver column of the same name, unchanged.
        meta:
          additivity: non_additive
      - name: crude_rate_standard_error
        description: The silver column of the same name, unchanged.
        meta:
          additivity: non_additive
      - name: crude_rate_upper_95
        description: The silver column of the same name, unchanged.
        meta:
          additivity: non_additive
      - name: deaths
        description: The silver column of the same name, unchanged.
        meta:
          additivity: additive
      - name: population
        description: The silver column of the same name, unchanged.
        meta:
          additivity: semi_additive
          additive_across: [county]
          additivity_note: sum across counties only within one database, excluding repeated-export and held rows
    data_tests:
      - dbt_utils.equality:
          name: equal_content_fct_wonder_county_deaths
          arguments:
            compare_model: ref('int_wonder_county_deaths')
            compare_columns:
              - member_sha256
              - source_row_number
              - wonder_database
              - period_start
              - period_end
              - county_fips
              - data_year
              - deaths_published
              - deaths
              - deaths_token
              - population
              - crude_rate_published
              - crude_rate
              - crude_rate_token
              - crude_rate_lower_95
              - crude_rate_upper_95
              - crude_rate_standard_error
              - hold_reason
              - county_scope
              - wonder_row_key
              - is_connecticut
      - dbt_utils.expression_is_true:
          name: keys_follow_natural_keys_fct_wonder_county_deaths
          arguments:
            expression: >-
              county_sk is not distinct from coalesce((select any_value(lookup.sk) from (select county_sk as sk, county_fips as nk from {{ ref('dim_county') }} where county_fips <> '<unknown>') as lookup where lookup.nk = cast(county_fips as varchar)), md5('<unknown>'))
              and release_sk is not distinct from coalesce((select any_value(lookup.sk) from (select release_sk as sk, member_sha256 as nk from {{ ref('dim_release') }} where member_sha256 <> '<unknown>') as lookup where lookup.nk = cast(member_sha256 as varchar)), md5('<unknown>'))
      - dbt_utils.expression_is_true:
          name: typed_period_start_fct_wonder_county_deaths
          arguments:
            expression: typeof(period_start) = 'DATE'
      - dbt_utils.expression_is_true:
          name: typed_period_end_fct_wonder_county_deaths
          arguments:
            expression: typeof(period_end) = 'DATE'
      - dbt_utils.expression_is_true:
          name: typed_data_year_fct_wonder_county_deaths
          arguments:
            expression: typeof(data_year) = 'INTEGER'
      - dbt_utils.expression_is_true:
          name: typed_text_deaths_published_fct_wonder_county_deaths
          arguments:
            expression: typeof(deaths_published) = 'VARCHAR'
      - dbt_utils.expression_is_true:
          name: typed_text_deaths_token_fct_wonder_county_deaths
          arguments:
            expression: typeof(deaths_token) = 'VARCHAR'
      - dbt_utils.expression_is_true:
          name: typed_text_crude_rate_published_fct_wonder_county_deaths
          arguments:
            expression: typeof(crude_rate_published) = 'VARCHAR'
      - dbt_utils.expression_is_true:
          name: typed_text_crude_rate_token_fct_wonder_county_deaths
          arguments:
            expression: typeof(crude_rate_token) = 'VARCHAR'
