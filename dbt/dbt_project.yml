# dbt project for the silver and gold layers, built by dbt-duckdb in the analytics image (scripts/lakehouse/dbt.sh).
# Bronze is read from the Iceberg catalog attached read-only as `lakehouse`; models are written to a local DuckDB file
# in the ignored data/analytics/dbt/ folder.
name: hai
version: "1.0.0"
config-version: 2
profile: hai

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: []
# Packages install outside the project, which the dbt container mounts read-only: the container sets
# DBT_PACKAGES_INSTALL_PATH to its output mount, and on the host the default is the same ignored folder.
packages-install-path: "{{ env_var('DBT_PACKAGES_INSTALL_PATH', '../data/analytics/dbt/dbt_packages') }}"

flags:
  send_anonymous_usage_stats: false
  use_colors: false

vars:
  # Bronze tables whose stored copies staging resolves (failure modes 166 to 177), with each table's source family.
  copy_tables:
    cms_hai_hospital: hai
    cms_hai_state: hai
    cms_hai_national: hai
    cms_hospital_cost_reports: cost_reports
    cms_ipps_text_lines: ipps
    cms_ipps_sheet_rows: ipps
    cms_ipps_sas: ipps
    cms_occupational_mix_text_lines: occupational_mix
    cms_occupational_mix_text_lines_utf16: occupational_mix
    cms_occupational_mix_sheet_rows: occupational_mix
    cms_provider_of_services: provider_of_services
    cms_cc_hospital_general_information: care_compare
    cms_hospital_enrollments: hospital_ownership
    cms_hospital_owners: hospital_ownership
    cms_change_of_ownership: hospital_ownership
    cms_cc_timely_and_effective_care_hospital: care_compare
    cms_cc_maternal_health_hospital: care_compare
    cms_cc_hcahps_hospital: care_compare
    cms_medicare_inpatient_by_provider: medicare_inpatient
    cms_medicare_inpatient_by_drg: medicare_inpatient
  # Case-mix index files: the label families of the CMI snapshots read as CMI, and the reviewed families that are not CMI,
  # by name or pattern (failure mode 293).
  cmi_families:
    - cmi
    - cmi02
    - cmi03
    - cmi10_v27billeddrg
    - cmi11
    - cmi15_billed_drgs
    - cmi16_fy14mpr_billed_drgs
    - cmi17_v32billed_drg
    - cmi_billed_drg
    - cmi_v28billed
    - cmi_v32billeddrg
    - cmis_billed_drgs
    - cmis_fn07
    - fn06_cmi_billed_drg
    - fn06_cmis
    - fy11nprmcmi
    - provider_cmi
    - providercmi
  cmi_excluded_families: [deleted_om, deleted_s, occmix, prds_hosp10_yr2019, s, s3andoccmixpuf]
  cmi_excluded_family_patterns: ["alt%", "%alternative%"]
  # IPPS impact public use files: the label families read for the S04 fields, and the reviewed families that are not read
  # (failure modes 342 and 343). Sheets that describe the variables are not data (344).
  impact_families:
    - impact
    - impact01
    - impact02
    - pubuse_fr03
    - impact04
    - impact_fr05
    - nprm05pufimpsupp
    - impact06_ext
    - impact07_mar06_nprm07
    - impact07_apr2007
    - impact08
    - impact09
    - impact_puf2
  # Headerless fixed-position files (1994 to 2000), policy alternatives, the regulatory impact table and the FY 2020
  # measure-of-impact supplement.
  impact_excluded_families:
    - impact94
    - impact95
    - impact96
    - impact97
    - impact98
    - impact99
    - impact00
    - impact_alternative_considered
    - impact_table
    - measure_impact_use_supplementary
  impact_excluded_sheet_patterns: ["%descr%", "layout"]

models:
  hai:
    silver:
      +materialized: view
      # Window choices scan every HAI row; tables keep downstream reads fast.
      intermediate:
        +materialized: table
  # dbt-project-evaluator runs only on request (--vars '{run_project_evaluator: true}'); its findings are warnings.
  dbt_project_evaluator:
    +enabled: "{{ var('run_project_evaluator', false) }}"

seeds:
  dbt_project_evaluator:
    +enabled: "{{ var('run_project_evaluator', false) }}"

data_tests:
  dbt_project_evaluator:
    +enabled: "{{ var('run_project_evaluator', false) }}"
    +severity: warn
