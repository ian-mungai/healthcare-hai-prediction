  - name: gold_contract_columns
    description: >
      Generated by scripts/lakehouse/bridge_references.py from the frozen gold contract: every column of every gold model with its
      explicit footnote column and whether it is the model's published measure-key column. The bridge tests
      read it because the dbt container sees only this project. The generator's --check mode fails when this file drifts.
    config:
      column_types:
        gold_model: varchar
        column_name: varchar
        footnote_column: varchar
        is_measure_key: varchar
    columns:
      - name: gold_model
        description: The gold fact, dimension or bridge.
      - name: column_name
        description: A column of that model in the contract.
      - name: footnote_column
        description: The column of the same model that holds this column's footnote; empty when there is none.
      - name: is_measure_key
        description: true for the column of a long fact that holds the published measure ID, field or concept; false otherwise.

  - name: gold_measure_key_evidence
    description: >
      Generated by scripts/lakehouse/bridge_references.py: the published measure key of each ACS, impact, HAI hospital and BLS bridge row with
      the reviewed file that supports it for that control. PLACES, DRG, HCAHPS, SVI and GV keys are checked against gold_measure_id_domains
      instead, and no row rests on registry text. The generator stops
      when a key has no support. The bridge test reads it; the generator's --check mode fails when this file drifts.
    config:
      column_types:
        fact: varchar
        measure_key: varchar
        measure_control: varchar
        basis: varchar
    columns:
      - name: fact
        description: The long fact.
      - name: measure_key
        description: The published measure ID, field or concept.
      - name: measure_control
        description: The registry control the key belongs to.
      - name: basis
        description: acs_variable_map, impact_layout_columns, hai_measure_parts or bls_measure_list.

  - name: gold_measure_key_rules
    description: >
      Generated by scripts/lakehouse/bridge_references.py: how the bridge test validates the published keys of each long fact. A domain row names
      the domain of gold_measure_id_domains whose exact, case-sensitive keys the fact accepts; an identifier row names a wide-source column
      (listed by svi_identifier_columns or gv_identifier_columns) that the fact must not use as a key; an evidence row sends the fact to
      gold_measure_key_evidence; a structural_only row marks a fact with no authoritative domain (the
      HAI state and national facts, which no bridge row names). The generator's --check mode fails when this file drifts.
    config:
      column_types:
        fact: varchar
        rule: varchar
        value: varchar
    columns:
      - name: fact
        description: The long fact.
      - name: rule
        description: domain, identifier, evidence or structural_only.
      - name: value
        description: The domain name for a domain rule, the column for an identifier rule and empty otherwise.

  - name: identity_splits
    description: >
      Generated by scripts/lakehouse/identity_splits.py from the approved list config/lakehouse/identity_classification.csv: the identity rule of
      each code or measure whose label changed across releases. split gives one identity per edition, single_latest one identity with the latest
      label and hold_single_latest one identity with the latest label while their classification is unresolved. The generator stops on a row that is not approved
      or held; its --check mode fails when this file drifts.
    config:
      column_types:
        dimension: varchar
        code_system: varchar
        fact: varchar
        code: varchar
        classification: varchar
        approval_status: varchar
        identity_rule: varchar
    columns:
      - name: dimension
        description: dim_drg, dim_measure or dim_rurality_code.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - dim_drg
                  - dim_measure
                  - dim_rurality_code
      - name: code_system
        description: The silver model and column the code or measure ID comes from.
        data_tests: [not_null]
      - name: fact
        description: The gold fact of a measure; empty for a code.
      - name: code
        description: The published code or measure ID.
        data_tests: [not_null]
      - name: classification
        description: redefined, renamed or unresolved.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - redefined
                  - renamed
                  - unresolved
      - name: approval_status
        description: approved or owner_hold; a row that is only proposed never reaches this seed.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - approved
                  - owner_hold
      - name: identity_rule
        description: split, single_latest or hold_single_latest.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - split
                  - single_latest
                  - hold_single_latest
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - dimension
              - code_system
              - fact
              - code

  - name: source_labels
    description: >
      Generated by scripts/lakehouse/source_labels.py from config/acquisition/source_registry.json and config/acquisition/registry_additions.json: the
      publisher and the registry title of each bronze dataset the registry places, and an empty row for each dataset it lists as unplaced. The
      generator's --check mode fails when this file drifts.
    config:
      column_types:
        dataset_id: varchar
        publisher: varchar
        label: varchar
        source_id: varchar
        placement: varchar
    columns:
      - name: dataset_id
        description: The bronze dataset ID.
        data_tests: [unique, not_null]
      - name: publisher
        description: The publisher of the registry source; empty for an unplaced dataset.
      - name: label
        description: The registry title of the source; empty for an unplaced dataset.
      - name: source_id
        description: The registry source that places the dataset; empty for an unplaced dataset.
      - name: placement
        description: placed or unplaced.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - placed
                  - unplaced

  - name: gold_measure_id_domains
    description: >
      The exact published measure-ID domains of PLACES (measureid), DRG (drg_cd), HCAHPS (hcahps_measure_id), SVI and Geographic Variation
      (column names), the Care Compare families TIMELY, MATERNAL, UNPLANNED and COMPLICATIONS (measure_id), HRRP (measure_name) and the
      MMD conditions (condition), derived from the publisher dictionaries and distinct values already in bronze (SELECT statements only).
      Copied byte-identical from the lead's seed (1,608 rows, SHA-256 f0082754bd8ba09e0959f825f853dde0650e99d96585aa975cc6b204fd718d35); never edited here, and
      regenerated only by scripts/lakehouse/measure_domains.py. Wide domains (SVI, GV) list every published column, identifiers included, so
      a match proves a column exists, not that it is a measure; the bridge test also rejects the identifier columns. Release ranges order
      captures and do not give the data year.
    config:
      column_types:
        domain: varchar
        published_key: varchar
        published_headers: varchar
        source_table: varchar
        source_column: varchar
        first_release: varchar
        last_release: varchar
    columns:
      - name: domain
        description: PLACES, DRG, HCAHPS, SVI, GV, TIMELY, MATERNAL, UNPLANNED, COMPLICATIONS, HRRP or MMD.
      - name: published_key
        description: The stored measure ID, DRG code (leading zeros kept) or column name; compared case-sensitively.
      - name: published_headers
        description: For a wide domain, the publisher headers that normalize to the column, joined by a vertical bar.
      - name: source_table
        description: The bronze table the key came from.
      - name: source_column
        description: The bronze column (long domains) or dictionary table column (wide domains).
      - name: first_release
        description: The earliest captured release that holds the key.
      - name: last_release
        description: The latest captured release that holds the key.

  - name: registry_controls
    description: >
      Generated by scripts/lakehouse/bridge_references.py from the source registry of revision 3 and the append-only additions
      (config/acquisition/registry_additions.json, C258.80 and C258.81). The generator rejects a duplicate ID and its --check mode
      fails when this file drifts. The family of a control is generated from the domain of its sources' source families, or from
      registry_family_supplement for a control with no source family.
    config:
      column_types:
        measure_control: varchar
        parent_control: varchar
        origin: varchar
        family: varchar
    columns:
      - name: measure_control
        description: The registry measure control ID.
      - name: parent_control
        description: The parent control, empty for a top-level control.
      - name: origin
        description: source_registry or registry_additions.
      - name: family
        description: Structure, Process, Outcome, Context or Linkage.

  - name: registry_family_supplement
    description: >
      The reviewed family of each registry control that has no source family (70 controls of the base registry). Read by
      scripts/lakehouse/bridge_references.py, which rejects a control that has a source family, appears twice or is not in the registry,
      and a family outside the five domains. The classification is the owner-confirmed review of Oct 29 2026.
    config:
      column_types:
        measure_control: varchar
        family: varchar
    columns:
      - name: measure_control
        description: The registry measure control ID.
      - name: family
        description: Structure, Process, Outcome, Context or Linkage.

  - name: mmd_condition_units
    description: >
      The reviewed unit of each MMD condition label (percent, or per_100000 for the Sickle Cell Disease rate), written from
      the unit column of mmd_conditions. The unit is source metadata the MMD file does not print; int_mmd_prevalence joins
      it by the published label.
    config:
      column_types:
        condition_label: varchar
        value_unit: varchar
    columns:
      - name: condition_label
        description: The condition label the MMD files print.
        data_tests: [unique, not_null]
      - name: value_unit
        description: percent, or per_100000 where the registry's exact field names a rate per 100,000.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [percent, per_100000]

  - name: alaska_county_code_labels
    description: >
      The reviewed historical name and retired-code status of the six Alaska county codes that Provider of Services rows publish and that no current county list
      carries (02040, 02080, 02120, 02140, 02210, 02260). The published code stays as published; this seed only labels it.
      Names come from the 2003-08-19 NBER SSA-to-FIPS crosswalk msabea.csv (https://data.nber.org/ssa-fips-state-county-crosswalk/msabea.csv, SHA-256
      3ceed55c1b789963ac15c9e15d9dff2056768fd61f42524294cebebb6e836ae6), where the SSA and FIPS columns
      both hold the code. Five codes are deleted county equivalent entities on the Census 1970 and 1980 county-change pages; 02210 is on no Census change page
      and is labelled only by its absence from every later list.
    config:
      column_types:
        county_fips: varchar
        historical_name: varchar
        census_page_name: varchar
        census_page: varchar
        retirement_basis: varchar
        name_source: varchar
        basis_source: varchar
        review_note: varchar
    columns:
      - name: county_fips
        description: The published 5-character county code.
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['02040', '02080', '02120', '02140', '02210', '02260']
      - name: historical_name
        description: The county name the 2003 NBER crosswalk gives the code, in title case.
        data_tests: [not_null]
      - name: census_page_name
        description: The name the Census county-change page prints for the entity; empty when no page lists the code.
      - name: census_page
        description: The decade page (1970 or 1980) that lists the entity as deleted; empty when no page lists the code.
      - name: retirement_basis
        description: census_change_page when a Census page deletes the entity; absent_from_later_lists when the evidence is its absence from the later county lists.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [census_change_page, absent_from_later_lists]
      - name: name_source
        description: nber_msabea_2003, the 2003 NBER file.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [nber_msabea_2003]
      - name: basis_source
        description: The document that supports the retirement basis.
        data_tests: [not_null]
      - name: review_note
        description: What the sources do and do not say about the code.
        data_tests: [not_null]

  - name: census_county_change_events
    description: >
      One row per change event of the Census county-change pages for 1970, 1980, 1990 and 2000 (143 events): the entity, its section's event, the effective date
      and, for a retirement (a deleted entity, or one renamed to another code), its successors. The 1970 Alaska summary item that names no entity is kept as a
      summary row, and the item that names three created entities gives three rows. Generated by scripts/lakehouse/county_change_seed.py from the four committed
      sections of the pages (the decade heading and the change list, in config/acquisition/census_county_changes), each pinned by its change-list digest in
      config/acquisition/census_county_change_candidates.json, with the reader scripts/acquisition/county_change_pages.py; the warehouse never reads the pages or
      the sections. The check of that script regenerates the seed from the sections and requires the same bytes, and compares the events with the reviewed
      golden file config/acquisition/census_county_change_golden.json. The pages cover 1970 to 2000 only; the 2010 and 2020 pages are not collected.
    config:
      column_types:
        page: integer
        event_number: integer
        change_list_sha256: varchar
        state: varchar
        county_fips: varchar
        county_name: varchar
        event_type: varchar
        effective_date: date
        successor_fips: varchar
        row_text: varchar
    columns:
      - name: page
        description: The decade the page covers, from its heading (1970, 1980, 1990 or 2000).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1970, 1980, 1990, 2000]
      - name: event_number
        description: Position of the event on its page, from 1, in page order.
        data_tests: [not_null]
      - name: change_list_sha256
        description: SHA-256 of the page's change list (the section headings and list items), as pinned in config/acquisition/census_county_change_candidates.json.
        data_tests: [not_null]
      - name: state
        description: The state or territory name for the entity's state FIPS code; null for the summary row.
      - name: county_fips
        description: The entity's 5-character code from its (SS-CCC) code; null for the summary row.
        data_tests:
          - not_null:
              config:
                where: "event_type <> 'summary'"
      - name: county_name
        description: The entity name as the page prints it before the code, a trailing comma removed; null for the summary row.
      - name: event_type
        description: created, deleted, renamed_to, renamed_from, name_corrected, boundary_change or summary.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [created, deleted, renamed_to, renamed_from, name_corrected, boundary_change, summary]
      - name: effective_date
        description: The single date the item prints; null when it names none or several.
      - name: successor_fips
        description: For a deleted or renamed_to row, the codes named after the last "to create" (or in the whole item), own code excluded, in text order, joined by semicolons; null otherwise.
      - name: row_text
        description: The item's text with tags removed and white space collapsed.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - page
              - event_number

  - name: pos_file_periods
    description: >
      Generated by scripts/lakehouse/pos_file_periods.py: each loaded Provider of Services file's period, the temporal
      coverage the data.cms.gov catalog gave it, as the acquisition job plan recorded it; names are never parsed.
      Check mode must reproduce it.
    config:
      column_types:
        member_sha256: varchar
        release_id: varchar
        file_name: varchar
        period_start: date
        period_end: date
    columns:
      - name: member_sha256
        description: SHA-256 of the POS file.
        data_tests: [unique, not_null]
      - name: release_id
        description: The capture release the coverage was recorded for.
        data_tests: [not_null]
      - name: file_name
        description: The file name, for reading only.
      - name: period_start
        description: First day of the catalog coverage.
        data_tests: [not_null]
      - name: period_end
        description: Last day of the catalog coverage; the snapshot date.
        data_tests: [not_null]

  - name: cmi_layout_columns
    description: >
      Reviewed header names of the case-mix index files and the field each holds; the unadjusted CMI and the
      transfer-adjusted CMI are separate fields.
    config:
      column_types:
        header_name: varchar
        field: varchar
    columns:
      - name: header_name
        description: A header cell, lower case, quotes removed and spaces collapsed.
        data_tests: [unique, not_null]
      - name: field
        description: ccn, cmi, cases, relative_weights, transfer_adjusted_cmi or transfer_adjusted_cases.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ccn, cmi, cases, relative_weights, transfer_adjusted_cmi, transfer_adjusted_cases]

  - name: impact_layout_columns
    description: >
      Reviewed header names of the IPPS impact files and the field each holds, matched exactly after lower-casing, removing
      quotes and collapsing spaces. A name with a rule_fiscal_year maps only in files of
      that rule year (the wage index columns). The pre-FY 2011 Post Reclass Wage Index and RDAY are deliberately absent.
    config:
      column_types:
        header_name: varchar
        field: varchar
        rule_fiscal_year: integer
    columns:
      - name: header_name
        description: A header cell, lower case, quotes removed and spaces collapsed.
        data_tests: [unique, not_null]
      - name: field
        description: The int_impact_hospital_rows field the column holds.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - ccn
                  - beds
                  - average_daily_census
                  - resident_to_bed_ratio
                  - urgeo
                  - geographic_labor_market_area
                  - dsh_patient_percentage
                  - medicare_percentage
                  - medicaid_percentage
                  - wage_index
                  - operating_ime_factor
                  - capital_ime_factor
                  - medicare_bills
      - name: rule_fiscal_year
        description: The only rule year whose files map this name; empty for every year.

  - name: ownership_release_periods
    description: >
      Generated by scripts/lakehouse/ownership_release_periods.py: each loaded owner, enrollment and change-of-ownership
      file's release label and period, the publisher-stated catalog period its capture receipt records; names are never
      parsed. Check mode must reproduce it.
    config:
      column_types:
        member_sha256: varchar
        bronze_table: varchar
        release_id: varchar
        release_label: varchar
        period_start: date
        period_end: date
    data_tests:
      - unique:
          arguments:
            column_name: "bronze_table || ':' || member_sha256"
    columns:
      - name: member_sha256
        description: SHA-256 of the file.
        data_tests: [not_null]
      - name: bronze_table
        description: The bronze table the file loads into.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [cms_hospital_owners, cms_hospital_enrollments, cms_change_of_ownership]
      - name: release_id
        description: The capture release the period was recorded for.
        data_tests: [not_null]
      - name: release_label
        description: The publisher's release label as the catalog writes it, with the release date.
      - name: period_start
        description: First day of the catalog period.
        data_tests: [not_null]
      - name: period_end
        description: Last day of the catalog period.
        data_tests: [not_null]
  - name: geography_file_periods
    description: >
      Generated by scripts/lakehouse/geography_file_periods.py: each loaded County geography file's vintage and period. HUD files
      take the publisher quarter their capture receipt records, service-area files the catalog coverage their job plan
      records, and RUCC, RUCA and adjacency files the vintage reviewed for their exact published file name; a vintage is a
      reference year, not a publication date. Check mode must reproduce it.
    config:
      column_types:
        member_sha256: varchar
        bronze_table: varchar
        release_id: varchar
        file_name: varchar
        vintage: varchar
        period_start: date
        period_end: date
        period_basis: varchar
    data_tests:
      - unique:
          arguments:
            column_name: "bronze_table || ':' || member_sha256"
    columns:
      - name: member_sha256
        description: SHA-256 of the loaded file.
        data_tests: [not_null]
      - name: bronze_table
        description: The bronze table that loads the file.
        data_tests: [not_null]
      - name: vintage
        description: USPS quarter label (HUD), data year (service areas) or reviewed reference year (RUCC, RUCA, adjacency).
        data_tests: [not_null]
      - name: period_basis
        description: Where the vintage or period comes from.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [receipt_publisher_quarter, job_catalog_coverage, reviewed_file_name, receipt_edition_year, publisher_file_name, capture_date, receipt_database_period]

  - name: acs_variable_map
    description: >
      Reviewed map of the ACS concepts the S18 and S19 controls name: for each concept and loaded vintage, the column that
      carries it and the label that column must publish, or a hold with its reason. Built from
      the bronze labels:
      labels must match after only case, Estimate wording, segment order, listed universe segments and dollar year; units
      that change at the 2017 subject-table redesign are held; summary files are matched by column code.
    config:
      column_types:
        concept_id: varchar
        bronze_table: varchar
        vintage: varchar
        column_name: varchar
        published_label: varchar
        status: varchar
        reason: varchar
    data_tests:
      - unique:
          arguments:
            column_name: "concept_id || ':' || bronze_table || ':' || vintage"
    columns:
      - name: concept_id
        description: The ACS concept, named by its 2023 (or 2017 for detailed tables) column code.
        data_tests: [not_null]
      - name: status
        description: mapped or held.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [mapped, held]

  - name: hhs_reviewed_ccn_matches
    description: >
      HHS capacity facilities that publish no CCN, matched to a CCN only after the owner reviewed the name, ZIP and HHS
      reporting evidence. A match is listed only when the CCN reports no HHS rows under its own CCN.
    config:
      column_types:
        hospital_pk: varchar
        ccn: varchar
        evidence: varchar
    columns:
      - name: hospital_pk
        description: The HHS facility key as published.
        data_tests: [not_null, unique]
      - name: ccn
        description: The CCN the owner confirmed.
        data_tests: [not_null, unique]
      - name: evidence
        description: Why the facility is that hospital.
        data_tests: [not_null]

  - name: measure_id_aliases
    description: >
      Reviewed renames of a published measure ID to the registry's exact ID, each with its evidence. An alias row enters a
      window model only where the same hospital and window have no row under the exact ID. The PSI renames are not listed:
      they wait for a CMS release note.
    config:
      column_types:
        source_model: varchar
        published_measure_id: varchar
        measure_id: varchar
        evidence: varchar
    columns:
      - name: source_model
        description: The window model whose published ID is renamed.
        data_tests: [not_null]
      - name: published_measure_id
        description: The measure ID as published.
        data_tests: [not_null, unique]
      - name: measure_id
        description: The registry's exact measure ID it stands for.
        data_tests: [not_null]
      - name: evidence
        description: Why the two IDs publish the same measure.
        data_tests: [not_null]

  - name: vbp_file_fiscal_years
    description: >
      The reviewed program fiscal year of each Hospital VBP Total Performance Score file that publishes no fiscal_year, by
      its published file name, with the evidence.
    config:
      column_types:
        file_name: varchar
        fiscal_year: integer
        evidence: varchar
    columns:
      - name: file_name
        description: The published file name.
        data_tests: [unique, not_null]
      - name: fiscal_year
        description: The program fiscal year.
        data_tests: [not_null]
      - name: evidence
        description: Why the year is right.
        data_tests: [not_null]
