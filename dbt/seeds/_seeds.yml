version: 2

seeds:
  - name: staging_label_holds
    description: >
      Stored files whose copies carry conflicting labels (fiscal year, rule stage or role). Their rows stay in staging,
      flagged, and are held from intermediate models until the owner decides (failure mode 172).
    config:
      column_types:
        bronze_table: varchar
        member_sha256: varchar
        issue: varchar
        reason: varchar
    columns:
      - name: bronze_table
        description: The bronze table holding the file.
        data_tests: [not_null]
      - name: member_sha256
        description: SHA-256 of the held file.
        data_tests: [unique, not_null]
      - name: issue
        description: The issue register entry.
        data_tests: [not_null]
      - name: reason
        description: Why the labels are held.

  - name: ipps_occmix_copy_labels
    description: >
      Generated by scripts/lakehouse/ipps_file_labels.py from the S3 manifests: each loaded IPPS and occupational-mix
      object's labels (failure modes 178 to 182). Check mode must reproduce it.
    config:
      column_types:
        bronze_table: varchar
        object_key: varchar
        member_sha256: varchar
        snapshot_id: varchar
        data_fiscal_year: integer
        rule_fiscal_year: integer
        data_fiscal_year: integer
        identity_year: integer
    columns:
      - name: bronze_table
        description: The bronze table.
        data_tests: [not_null]
      - name: object_key
        description: The loaded object.
        data_tests: [not_null]
      - name: member_sha256
        description: SHA-256 of the file.
      - name: snapshot_id
        description: The capture snapshot.
      - name: label_source
        description: names or override.
      - name: family
        description: Descriptive family name.
      - name: role
        description: data or description.
      - name: rule_fiscal_year
        description: Fiscal year of the publishing rule.
        data_tests: [not_null]
      - name: data_fiscal_year
        description: Discharge fiscal year of a CMI file's data, when its name gives a later rule.
      - name: identity_year
        description: Data fiscal year when known, otherwise the rule fiscal year.
        data_tests: [not_null]
      - name: rule_stage
        description: Rule stages the names mention.

  - name: ipps_occmix_twins
    description: >
      Generated by scripts/lakehouse/ipps_file_labels.py: text/workbook twin pairs, one text file and one workbook with
      the same stem in one snapshot (failure mode 183).
    config:
      column_types:
        text_table: varchar
        text_sha256: varchar
        workbook_table: varchar
        workbook_sha256: varchar
        stem: varchar
    columns:
      - name: text_table
        description: The bronze table holding the text file.
      - name: text_sha256
        description: SHA-256 of the text file.
        data_tests: [not_null]
      - name: workbook_table
        description: The bronze table holding the workbook.
      - name: workbook_sha256
        description: SHA-256 of the workbook.
        data_tests: [not_null]
      - name: stem
        description: The shared name stem.

  - name: pos_file_periods
    description: >
      Generated by scripts/lakehouse/pos_file_periods.py: each loaded Provider of Services file's period, the temporal
      coverage the data.cms.gov catalog gave it, as the acquisition job plan recorded it; names are never parsed
      (failure modes 280 and 281). Check mode must reproduce it.
    config:
      column_types:
        member_sha256: varchar
        release_id: varchar
        file_name: varchar
        period_start: date
        period_end: date
    columns:
      - name: member_sha256
        description: SHA-256 of the POS file.
        data_tests: [unique, not_null]
      - name: release_id
        description: The capture release the coverage was recorded for.
        data_tests: [not_null]
      - name: file_name
        description: The file name, for reading only.
      - name: period_start
        description: First day of the catalog coverage.
        data_tests: [not_null]
      - name: period_end
        description: Last day of the catalog coverage; the snapshot date.
        data_tests: [not_null]

  - name: cmi_layout_columns
    description: >
      Reviewed header names of the case-mix index files and the field each holds; the unadjusted CMI and the
      transfer-adjusted CMI are separate fields (failure modes 294 and 297).
    config:
      column_types:
        header_name: varchar
        field: varchar
    columns:
      - name: header_name
        description: A header cell, lower case, quotes removed and spaces collapsed.
        data_tests: [unique, not_null]
      - name: field
        description: ccn, cmi, cases, relative_weights, transfer_adjusted_cmi or transfer_adjusted_cases.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ccn, cmi, cases, relative_weights, transfer_adjusted_cmi, transfer_adjusted_cases]
