version: 2

seeds:
  - name: staging_label_holds
    description: >
      Stored files whose copies carry conflicting labels (fiscal year, rule stage or role). Their rows stay in staging,
      flagged, and are held from intermediate models until the owner decides (failure mode 172).
    config:
      column_types:
        bronze_table: varchar
        member_sha256: varchar
        issue: varchar
        reason: varchar
    columns:
      - name: bronze_table
        description: The bronze table holding the file.
        data_tests: [not_null]
      - name: member_sha256
        description: SHA-256 of the held file.
        data_tests: [unique, not_null]
      - name: issue
        description: The issue register entry.
        data_tests: [not_null]
      - name: reason
        description: Why the labels are held.

  - name: ipps_occmix_copy_labels
    description: >
      Generated by scripts/lakehouse/ipps_file_labels.py from the S3 manifests: each loaded IPPS and occupational-mix
      object's labels (failure modes 178 to 182). Check mode must reproduce it.
    config:
      column_types:
        bronze_table: varchar
        object_key: varchar
        member_sha256: varchar
        snapshot_id: varchar
        data_fiscal_year: integer
        rule_fiscal_year: integer
        data_fiscal_year: integer
        identity_year: integer
    columns:
      - name: bronze_table
        description: The bronze table.
        data_tests: [not_null]
      - name: object_key
        description: The loaded object.
        data_tests: [not_null]
      - name: member_sha256
        description: SHA-256 of the file.
      - name: snapshot_id
        description: The capture snapshot.
      - name: label_source
        description: names or override.
      - name: family
        description: Descriptive family name.
      - name: role
        description: data or description.
      - name: rule_fiscal_year
        description: Fiscal year of the publishing rule.
        data_tests: [not_null]
      - name: data_fiscal_year
        description: Discharge fiscal year of a CMI file's data, when its name gives a later rule.
      - name: identity_year
        description: Data fiscal year when known, otherwise the rule fiscal year.
        data_tests: [not_null]
      - name: rule_stage
        description: Rule stages the names mention.

  - name: ipps_occmix_twins
    description: >
      Generated by scripts/lakehouse/ipps_file_labels.py: text/workbook twin pairs, one text file and one workbook with
      the same stem in one snapshot (failure mode 183).
    config:
      column_types:
        text_table: varchar
        text_sha256: varchar
        workbook_table: varchar
        workbook_sha256: varchar
        stem: varchar
    columns:
      - name: text_table
        description: The bronze table holding the text file.
      - name: text_sha256
        description: SHA-256 of the text file.
        data_tests: [not_null]
      - name: workbook_table
        description: The bronze table holding the workbook.
      - name: workbook_sha256
        description: SHA-256 of the workbook.
        data_tests: [not_null]
      - name: stem
        description: The shared name stem.

  - name: pos_file_periods
    description: >
      Generated by scripts/lakehouse/pos_file_periods.py: each loaded Provider of Services file's period, the temporal
      coverage the data.cms.gov catalog gave it, as the acquisition job plan recorded it; names are never parsed
      (failure modes 280 and 281). Check mode must reproduce it.
    config:
      column_types:
        member_sha256: varchar
        release_id: varchar
        file_name: varchar
        period_start: date
        period_end: date
    columns:
      - name: member_sha256
        description: SHA-256 of the POS file.
        data_tests: [unique, not_null]
      - name: release_id
        description: The capture release the coverage was recorded for.
        data_tests: [not_null]
      - name: file_name
        description: The file name, for reading only.
      - name: period_start
        description: First day of the catalog coverage.
        data_tests: [not_null]
      - name: period_end
        description: Last day of the catalog coverage; the snapshot date.
        data_tests: [not_null]

  - name: cmi_layout_columns
    description: >
      Reviewed header names of the case-mix index files and the field each holds; the unadjusted CMI and the
      transfer-adjusted CMI are separate fields (failure modes 294 and 297).
    config:
      column_types:
        header_name: varchar
        field: varchar
    columns:
      - name: header_name
        description: A header cell, lower case, quotes removed and spaces collapsed.
        data_tests: [unique, not_null]
      - name: field
        description: ccn, cmi, cases, relative_weights, transfer_adjusted_cmi or transfer_adjusted_cases.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ccn, cmi, cases, relative_weights, transfer_adjusted_cmi, transfer_adjusted_cases]

  - name: registry_measure_sources
    description: >
      Each registry measure control of families S13 to S16 and the staged model, measure ID and value column that hold it,
      exactly as the source registry names them; renamed IDs are never mapped by guess (failure modes 323 to 326). C139 and
      C140 are facility-level HCAHPS values, read from the H_STAR_RATING row. The staging E2E checks it against the registry.
    config:
      column_types:
        measure_control: varchar
        family: varchar
        source_model: varchar
        source_measure_id: varchar
        value_column: varchar
        footnote_column: varchar
        review_decision: varchar
    columns:
      - name: measure_control
        description: The registry measure control ID.
        data_tests: [unique, not_null]
      - name: family
        description: The registry source family.
        data_tests: [not_null]
      - name: source_model
        description: The staged model that holds the measure.
        data_tests: [not_null]
      - name: source_measure_id
        description: The published measure ID; empty for a column of Hospital General Information.
      - name: value_column
        description: The column holding the value.
        data_tests: [not_null]
      - name: footnote_column
        description: The column holding the value's footnote.
      - name: review_decision
        description: The registry's current review decision, for reading only; staging does not make a measure a predictor.

  - name: cost_report_measures
    description: >
      Each registry measure control of family S01 and how it is computed from the typed cost report: value or code (the
      published column), ratio (numerator / denominator), per_day (numerator / reporting days) or ratio_per_day_denominator
      (numerator / (denominator / reporting days)), as the registry text defines the primary variant (failure modes 339 and
      340). The staging E2E checks the controls against the registry.
    config:
      column_types:
        measure_control: varchar
        rule: varchar
        numerator_column: varchar
        denominator_column: varchar
        review_decision: varchar
    columns:
      - name: measure_control
        description: The registry measure control ID.
        data_tests: [unique, not_null]
      - name: rule
        description: value, code, ratio, per_day or ratio_per_day_denominator.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [value, code, ratio, per_day, ratio_per_day_denominator]
      - name: numerator_column
        description: The typed int_cost_reports column holding the value or numerator.
        data_tests: [not_null]
      - name: denominator_column
        description: The typed column holding the denominator, for ratio rules.
      - name: review_decision
        description: The registry's current review decision, for reading only.

  - name: impact_layout_columns
    description: >
      Reviewed header names of the IPPS impact files and the field each holds, matched exactly after lower-casing, removing
      quotes and collapsing spaces (failure modes 344 to 347 and 352). A name with a rule_fiscal_year maps only in files of
      that rule year (the wage index columns). The pre-FY 2011 Post Reclass Wage Index and RDAY are deliberately absent.
    config:
      column_types:
        header_name: varchar
        field: varchar
        rule_fiscal_year: integer
    columns:
      - name: header_name
        description: A header cell, lower case, quotes removed and spaces collapsed.
        data_tests: [unique, not_null]
      - name: field
        description: The int_impact_hospital_rows field the column holds.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - ccn
                  - beds
                  - average_daily_census
                  - resident_to_bed_ratio
                  - urgeo
                  - geographic_labor_market_area
                  - dsh_patient_percentage
                  - medicare_percentage
                  - medicaid_percentage
                  - wage_index
                  - operating_ime_factor
                  - capital_ime_factor
                  - medicare_bills
      - name: rule_fiscal_year
        description: The only rule year whose files map this name; empty for every year.

  - name: impact_measures
    description: >
      Each registry measure control of source CMS_IPPS (family S04) and the impact-file field that holds it: value or code
      (the published field) or ratio (field / denominator_field); C021 and C026 have two fields each (failure mode 353).
      The staging E2E checks the controls against the registry. C075 (CMI) is staged in group A.
    config:
      column_types:
        measure_control: varchar
        field: varchar
        rule: varchar
        denominator_field: varchar
        review_decision: varchar
    data_tests:
      - unique:
          arguments:
            column_name: "measure_control || ':' || field"
    columns:
      - name: measure_control
        description: The registry measure control ID.
        data_tests: [not_null]
      - name: field
        description: The int_impact_hospital_rows field holding the value or numerator.
        data_tests: [not_null]
      - name: rule
        description: value, code or ratio.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [value, code, ratio]
      - name: denominator_field
        description: The field holding the denominator, for the ratio rule.
      - name: review_decision
        description: The registry's current review decision, for reading only.

  - name: mup_measures
    description: >
      Each registry measure control of sources CMS-MUP-PROVIDER and CMS_MEDICARE_PROVIDER (family S08) and how it is
      computed from the typed Medicare inpatient provider summary: value (the published field), ratio (field /
      denominator_field), drg_share (the published discharges of the listed DRG codes over the provider total) or hold (no
      value: held or closed in the registry). C084 has one row per published race field; its child controls are not
      assigned (failure modes 360 to 363). The staging E2E checks the controls against the registry.
    config:
      column_types:
        measure_control: varchar
        field: varchar
        rule: varchar
        denominator_field: varchar
        drg_codes: varchar
        review_decision: varchar
    data_tests:
      - unique:
          arguments:
            column_name: "measure_control || ':' || coalesce(field, '')"
    columns:
      - name: measure_control
        description: The registry measure control ID.
        data_tests: [not_null]
      - name: field
        description: The int_mup_providers column holding the value or numerator; empty for hold.
      - name: rule
        description: value, ratio, drg_share or hold.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [value, ratio, drg_share, hold]
      - name: denominator_field
        description: The column holding the denominator, for ratio and drg_share.
      - name: drg_codes
        description: The DRG codes of a drg_share, separated by spaces.
      - name: review_decision
        description: The registry's current review decision, for reading only.
  - name: ownership_release_periods
    description: >
      Generated by scripts/lakehouse/ownership_release_periods.py: each loaded owner, enrollment and change-of-ownership
      file's release label and period, the publisher-stated catalog period its capture receipt records; names are never
      parsed (failure mode 365). Check mode must reproduce it.
    config:
      column_types:
        member_sha256: varchar
        bronze_table: varchar
        release_id: varchar
        release_label: varchar
        period_start: date
        period_end: date
    data_tests:
      - unique:
          arguments:
            column_name: "bronze_table || ':' || member_sha256"
    columns:
      - name: member_sha256
        description: SHA-256 of the file.
        data_tests: [not_null]
      - name: bronze_table
        description: The bronze table the file loads into.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [cms_hospital_owners, cms_hospital_enrollments, cms_change_of_ownership]
      - name: release_id
        description: The capture release the period was recorded for.
        data_tests: [not_null]
      - name: release_label
        description: The publisher's release label as the catalog writes it, with the release date.
      - name: period_start
        description: First day of the catalog period.
        data_tests: [not_null]
      - name: period_end
        description: Last day of the catalog period.
        data_tests: [not_null]
  - name: ownership_measures
    description: >
      Each registry measure control of sources CMS_OWNERS, ENROLL and CMS_CHOW (families S06 and S07) and the staged
      model and columns that carry it at source grain; the alignment with the spine computes the measure later (failure
      mode 373). A test checks every named column exists; the staging E2E checks the controls against the registry.
    config:
      column_types:
        measure_control: varchar
        family: varchar
        source_model: varchar
        fields: varchar
        review_decision: varchar
    columns:
      - name: measure_control
        description: The registry measure control ID.
        data_tests: [unique, not_null]
      - name: family
        description: The registry source family.
      - name: source_model
        description: The staged model that carries the control's fields.
        data_tests: [not_null]
      - name: fields
        description: The model's columns the control uses, separated by spaces.
        data_tests: [not_null]
      - name: review_decision
        description: The registry's current review decision, for reading only.
  - name: hhs_onc_measures
    description: >
      Each registry measure control of sources HHS_CAPACITY, HHS and ONC_PI (families S09 and S10), or each child control
      where the registry names fields per child, and the staged model columns that carry it at source grain. Mapping is
      exact (the registry's field names), api_field_name (a name the source truncated, resolved through the stored
      columns.json) or unnamed (C001 and C040 name no HHS field: no columns). A test checks every named column exists; the
      staging E2E checks the controls and the child mappings against the registry and columns.json (failure modes 378
      and 384).
    config:
      column_types:
        measure_control: varchar
        parent_control: varchar
        source_model: varchar
        fields: varchar
        mapping: varchar
        review_decision: varchar
    columns:
      - name: measure_control
        description: The registry measure control or child control ID.
        data_tests: [unique, not_null]
      - name: parent_control
        description: The parent control of a child control; empty for a control the registry links directly.
      - name: source_model
        description: The staged model that carries the control's columns.
        data_tests: [not_null]
      - name: fields
        description: The model's columns the control uses, separated by spaces; empty when unnamed.
      - name: mapping
        description: exact, api_field_name or unnamed.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [exact, api_field_name, unnamed]
      - name: review_decision
        description: The registry's review decision (of the parent, for a child), for reading only.

  - name: occmix_measures
    description: Six S03 controls with the registry's exact definitions and review decisions. C043 has no occupational-mix substitute.
    config:
      column_types:
        measure_control: varchar
        family: varchar
        value_column: varchar
        definition: varchar
        review_decision: varchar
        source_status: varchar
    columns:
      - name: measure_control
        description: Registry control identifier.
        data_tests: [unique, not_null]
      - name: family
        description: S03, occupational mix.
        data_tests: [not_null]
      - name: value_column
        description: Typed survey value column. Empty for C043.
      - name: definition
        description: Exact field or construction in the source registry.
      - name: review_decision
        description: Registry decision, preserved without approving model use.
      - name: source_status
        description: Whether the survey can supply the conditional definition.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [available_conditional, unavailable_source_definition]

  - name: geography_file_periods
    description: >
      Generated by scripts/lakehouse/geography_file_periods.py: each loaded C1 geography file's vintage and period. HUD files
      take the publisher quarter their capture receipt records, service-area files the catalog coverage their job plan
      records, and RUCC, RUCA and adjacency files the vintage reviewed for their exact published file name; a vintage is a
      reference year, not a publication date (failure modes 403, 410 and 416). Check mode must reproduce it.
    config:
      column_types:
        member_sha256: varchar
        bronze_table: varchar
        release_id: varchar
        file_name: varchar
        vintage: varchar
        period_start: date
        period_end: date
        period_basis: varchar
    data_tests:
      - unique:
          arguments:
            column_name: "bronze_table || ':' || member_sha256"
    columns:
      - name: member_sha256
        description: SHA-256 of the loaded file.
        data_tests: [not_null]
      - name: bronze_table
        description: The bronze table that loads the file.
        data_tests: [not_null]
      - name: vintage
        description: USPS quarter label (HUD), data year (service areas) or reviewed reference year (RUCC, RUCA, adjacency).
        data_tests: [not_null]
      - name: period_basis
        description: Where the vintage or period comes from.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [receipt_publisher_quarter, job_catalog_coverage, reviewed_file_name, receipt_edition_year, publisher_file_name, capture_date, receipt_database_period]

  - name: geography_measures
    description: >
      The eight registry controls of S21 RUCC, S22 RUCA, S35 hospital service areas, S36 HUD and S38 adjacency, each with
      the model and fields that carry it and the registry's review decision (failure mode 417). Staging approves no model use.
    config:
      column_types:
        measure_control: varchar
        family: varchar
        source_model: varchar
        fields: varchar
        review_decision: varchar
    columns:
      - name: measure_control
        description: Registry control identifier.
        data_tests: [unique, not_null]
      - name: family
        description: Source family, S21, S22, S35, S36 or S38.
        data_tests: [not_null]
      - name: source_model
        description: The intermediate model that carries the control.
        data_tests: [not_null]
      - name: fields
        description: Space-separated columns of the model that carry the control.
        data_tests: [not_null]
      - name: review_decision
        description: Registry decision, preserved without approving model use.
        data_tests: [not_null]

  - name: acs_variable_map
    description: >
      Reviewed map of the ACS concepts the S18 and S19 controls name: for each concept and loaded vintage, the column that
      carries it and the label that column must publish, or a hold with its reason. Built by
      plans/group_c_20261006/c2/build_variable_map.py from the bronze labels (failure modes 420 to 424):
      labels must match after only case, Estimate wording, segment order, listed universe segments and dollar year; units
      that change at the 2017 subject-table redesign are held; summary files are matched by column code.
    config:
      column_types:
        concept_id: varchar
        bronze_table: varchar
        vintage: varchar
        column_name: varchar
        published_label: varchar
        status: varchar
        reason: varchar
    data_tests:
      - unique:
          arguments:
            column_name: "concept_id || ':' || bronze_table || ':' || vintage"
    columns:
      - name: concept_id
        description: The ACS concept, named by its 2023 (or 2017 for detailed tables) column code.
        data_tests: [not_null]
      - name: status
        description: mapped or held.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [mapped, held]

  - name: acs_svi_measures
    description: >
      The 44 registry controls of S18 ACS and S19 SVI with the ACS concepts or SVI fields that carry each, one row per
      source, and the registry's review decision (failure modes 430 and 432). C177.02 is BLS and is staged in C3.
    config:
      column_types:
        measure_control: varchar
        family: varchar
        source: varchar
        components: varchar
        review_decision: varchar
    columns:
      - name: measure_control
        description: Registry control identifier.
        data_tests: [not_null]
      - name: source
        description: acs, svi or bls.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [acs, svi, bls]
      - name: components
        description: Space-separated ACS concepts or SVI fields; empty for the BLS row.

  - name: income_labor_measures
    description: >
      The registry controls of S24 SAIPE, S25 SAHIE and S29 BLS with the model and columns that carry each and the
      registry's review decision (failure mode 446). C177.01 names only ACS and SVI fields and has no columns here.
    config:
      column_types:
        measure_control: varchar
        family: varchar
        source_model: varchar
        fields: varchar
        review_decision: varchar
    columns:
      - name: measure_control
        description: Registry control identifier.
        data_tests: [unique, not_null]
      - name: source_model
        description: The intermediate model that carries the control.
        data_tests: [not_null]
      - name: fields
        description: Space-separated columns of the model; empty for C177.01.
      - name: review_decision
        description: Registry decision, preserved without approving model use.
        data_tests: [not_null]

  - name: county_health_measures
    description: >
      The 56 registry controls of S20 PLACES, S28 Medicare Geographic Variation and S30 WONDER with the model and the
      PLACES measure IDs, geographic-variation fields or WONDER columns that carry each, and the registry's review decision
      (failure mode 460). C242.02 (ISOLATION before LONELINESS) stays held for definition.
    config:
      column_types:
        measure_control: varchar
        family: varchar
        source_model: varchar
        components: varchar
        review_decision: varchar
    columns:
      - name: measure_control
        description: Registry control identifier.
        data_tests: [unique, not_null]
      - name: source_model
        description: The intermediate model that carries the control.
        data_tests: [not_null]
      - name: components
        description: Space-separated PLACES measure IDs, geographic-variation fields or WONDER columns.
        data_tests: [not_null]
      - name: review_decision
        description: Registry decision, preserved without approving model use.
        data_tests: [not_null]

  - name: mmd_conditions
    description: >
      The reviewed MMD condition map, written by scripts/lakehouse/mmd_conditions.py from the two pinned MMD collection plans:
      each control's condition code, menu label, geography and unit (failure modes 468 and 472). 81 controls, C258.01 to
      C258.81; C258.80 and C258.81 are the user additions of Sep 25 2026.
    config:
      column_types:
        measure_control: varchar
        condition_code: varchar
        condition_label: varchar
        geography_level: varchar
        value_unit: varchar
    columns:
      - name: measure_control
        description: Registry control identifier.
        data_tests: [unique, not_null]
      - name: condition_label
        description: The condition label the MMD files print.
        data_tests: [unique, not_null]
      - name: geography_level
        description: county or state, the geography the plan collected.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [county, state]
      - name: value_unit
        description: percent, or per_100000 where the registry's exact field names a rate per 100,000.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [percent, per_100000]

  - name: shortage_measures
    description: >
      The 85 registry controls of S27 MMD (C258 and C258.01 to C258.81, all held for definition) and S23 HPSA and MUA (C249 to
      C251) with the model and columns that carry each, and the registry's review decision (failure modes 474 and 482).
    config:
      column_types:
        measure_control: varchar
        family: varchar
        source_model: varchar
        components: varchar
        review_decision: varchar
    columns:
      - name: measure_control
        description: Registry control identifier.
        data_tests: [unique, not_null]
      - name: source_model
        description: The intermediate model that carries the control.
        data_tests: [not_null]
      - name: components
        description: Space-separated columns of the model.
        data_tests: [not_null]
      - name: review_decision
        description: Registry decision, preserved without approving model use.
        data_tests: [not_null]

  - name: validation_measures
    description: >
      The registry controls of the group D validation sources: S32 Hospital Readmissions Reduction Program, S33 unplanned
      hospital visits and S34 complications and deaths, each parent once per component, and E038 (PSI-90) and E039 (PSI-13),
      which name no published measure ID and stay unmapped. Each row names the window model, the exact measure ID the registry
      gives and the value column; renamed IDs (OP-32, PSI_90_SAFETY, PSI_13_POST_SEPSIS) are never mapped (failure modes 508,
      509 and 511). All are comparison_only; staging approves no use.
    config:
      column_types:
        measure_control: varchar
        family: varchar
        source_model: varchar
        source_measure_id: varchar
        value_column: varchar
        review_decision: varchar
    columns:
      - name: measure_control
        description: Registry control identifier; a parent appears once per component.
        data_tests: [not_null]
      - name: source_model
        description: The window model that carries the control.
        data_tests: [not_null]
      - name: source_measure_id
        description: The published measure ID or HRRP measure name; empty for E038 and E039.
      - name: value_column
        description: The column holding the value.
        data_tests: [not_null]
      - name: review_decision
        description: Registry decision, preserved without approving model use.
        data_tests: [not_null]
