version: 2

seeds:
  - name: staging_label_holds
    description: >
      Stored files whose copies carry conflicting labels (fiscal year, rule stage or role). Their rows stay in staging,
      flagged, and are held from intermediate models until the owner decides.
    config:
      column_types:
        bronze_table: varchar
        member_sha256: varchar
        issue: varchar
        reason: varchar
    columns:
      - name: bronze_table
        description: The bronze table holding the file.
        data_tests: [not_null]
      - name: member_sha256
        description: SHA-256 of the held file.
        data_tests: [unique, not_null]
      - name: issue
        description: The issue register entry.
        data_tests: [not_null]
      - name: reason
        description: Why the labels are held.

  - name: ipps_occmix_copy_labels
    description: >
      Generated by scripts/lakehouse/ipps_file_labels.py from the S3 manifests: each loaded IPPS and occupational-mix
      object's labels. Check mode must reproduce it.
    config:
      column_types:
        bronze_table: varchar
        object_key: varchar
        member_sha256: varchar
        snapshot_id: varchar
        data_fiscal_year: integer
        rule_fiscal_year: integer
        identity_year: integer
    columns:
      - name: bronze_table
        description: The bronze table.
        data_tests: [not_null]
      - name: object_key
        description: The loaded object.
        data_tests: [not_null]
      - name: member_sha256
        description: SHA-256 of the file.
      - name: snapshot_id
        description: The capture snapshot.
      - name: label_source
        description: names or override.
      - name: family
        description: Descriptive family name.
      - name: role
        description: data or description.
      - name: rule_fiscal_year
        description: Fiscal year of the publishing rule.
        data_tests: [not_null]
      - name: data_fiscal_year
        description: Discharge fiscal year of a CMI file's data, when its name gives a later rule.
      - name: identity_year
        description: Data fiscal year when known, otherwise the rule fiscal year.
        data_tests: [not_null]
      - name: rule_stage
        description: Rule stages the names mention.

  - name: ipps_occmix_twins
    description: >
      Generated by scripts/lakehouse/ipps_file_labels.py: text/workbook twin pairs, one text file and one workbook with
      the same stem in one snapshot.
    config:
      column_types:
        text_table: varchar
        text_sha256: varchar
        workbook_table: varchar
        workbook_sha256: varchar
        stem: varchar
    columns:
      - name: text_table
        description: The bronze table holding the text file.
      - name: text_sha256
        description: SHA-256 of the text file.
        data_tests: [not_null]
      - name: workbook_table
        description: The bronze table holding the workbook.
      - name: workbook_sha256
        description: SHA-256 of the workbook.
        data_tests: [not_null]
      - name: stem
        description: The shared name stem.

  # Gold control bridge seeds (one per retired registry-map seed) and the two reference seeds their tests read.
  - name: registry_measure_sources_bridge
    description: >
      Care Compare and Hospital General Information controls (families S13 to S16): the published measure ID and the typed
      value column that hold each control. Each value column's footnote is the footnote_column of gold_contract_columns.
    config:
      column_types:
        fact: varchar
        measure_key: varchar
        value_column: varchar
        vintage_start: varchar
        vintage_end: varchar
        measure_control: varchar
        review_decision: varchar
        source_seed: varchar
        source_row: integer
    columns:
      - name: fact
        description: The gold fact (or gold bridge) that holds the data, as named in the gold contract.
      - name: measure_key
        description: The published measure ID of a long fact, or the column name of a wide fact; empty for a closed control.
      - name: value_column
        description: The fact column that holds the value; empty for a closed control.
      - name: vintage_start
        description: First vintage the identity holds; empty when no reviewed file gives one.
      - name: vintage_end
        description: Last vintage the identity holds; empty when open.
      - name: measure_control
        description: The registry measure control.
      - name: review_decision
        description: The review decision the retired seed carried, for reading only.
      - name: source_seed
        description: The retired registry-map seed the row came from.
      - name: source_row
        description: The data row number of that seed, counted from 1.

