version: 2

# Formula recipes of the gold control bridge. They are configuration of the feature phase, not gold: the seeds carry the tag features, so the gold builds leave them out.
seeds:
  - name: cost_report_measures_recipe
    description: >
      Cost report controls (family S01): the rule of each control and the cost report columns it reads, one row per input.
    config:
      column_types:
        measure_control: varchar
        rule: varchar
        role: varchar
        fact: varchar
        value_column: varchar
        key_column: varchar
        key_value: varchar
        join_keys: varchar
        aggregation: varchar
        guard: varchar
        group_by: varchar
        period: varchar
        suppression: varchar
        source_row: integer
    columns:
      - name: measure_control
        description: The registry measure control the rule belongs to.
      - name: rule
        description: The rule that computes the control from its inputs (the allowed rules of the recipe are checked by bridge_references).
      - name: role
        description: The role of the input in the rule (value, numerator, denominator, divisor, id, score or context, a column read for grain, filters or joins).
      - name: fact
        description: The gold fact or bridge that holds the input.
      - name: value_column
        description: The column of that fact the input reads; empty when the rule reads a key value instead.
      - name: key_column
        description: The column of a long fact that holds the published key (field, drg_cd or condition_label), for an input read by key; empty otherwise.
      - name: key_value
        description: The published key the input reads (a field name, a condition label or DRG codes separated by a vertical bar); empty when the rule reads a value column.
      - name: join_keys
        description: The columns that join this input to the others of the rule, separated by spaces; empty when none.
      - name: aggregation
        description: How the input is combined across rows (sum, avg, max, count_distinct, bool_or or string_agg_distinct); empty for none.
      - name: guard
        description: The condition under which the input gives a value, as written in the retired seed review.
      - name: group_by
        description: The columns the aggregation groups by, separated by spaces; empty when none.
      - name: period
        description: The period rule of the input, in words; empty when none.
      - name: suppression
        description: How a suppressed or withheld value is treated; empty when none.
      - name: source_row
        description: The data row number of the retired registry-map seed this input came from, counted from 1.

