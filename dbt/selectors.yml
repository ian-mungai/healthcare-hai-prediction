selectors:
  - name: without_features
    description: Every node except the feature phase. A command with no selection builds the silver and gold layers only; select the feature phase with tag:features.
    default: true
    definition:
      union:
        - method: fqn
          value: "*"
        - method: resource_type
          value: source
        - exclude:
            - method: tag
              value: features
