[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
lines-after-imports = 1

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true

[tool.coverage.run]
omit = ["*/scripts/infrastructure/run_e2e.py"]
