[tool.uv]
package = false
required-version = "==0.13.7"
default-groups = []
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux' and platform_machine == 'aarch64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Every group is a separate environment (an image or a tool), so no two install together and each resolves on its own.
conflicts = [
  [{ group = "host" }, { group = "review" }, { group = "dvc" }, { group = "sqlfluff" }, { group = "import_linter" }, { group = "check_jsonschema" }, { group = "analytics" }, { group = "drift" }, { group = "feature_store" }, { group = "spark" }, { group = "mlflow" }, { group = "model_api" }, { group = "orchestration" }, { group = "quality" }, { group = "streamlit" }, { group = "training" }],
]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "T20"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true

[tool.coverage.run]
omit = ["*/scripts/infrastructure/run_e2e.py"]
