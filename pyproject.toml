[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Assertions are the intended failure mechanism in retained pytest safeguards.
"tests/*.py" = ["S101"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true

[tool.coverage.run]
omit = ["*/scripts/infrastructure/run_e2e.py"]
