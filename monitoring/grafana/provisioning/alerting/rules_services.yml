# Service alerts, from the live ECS reads and health probes of the host state exporter (monitoring/host_state_exporter.py).
# The notification policy (policies.yml) sends every alert to the one contact point (contact_points.yml), so no rule names a receiver.
apiVersion: 1

groups:
  - orgId: 1
    name: hai_services
    folder: HAI
    interval: 1m
    rules:
      - uid: service_tasks_missing
        title: ServiceTasksMissing
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'hai_service_tasks_running < bool hai_service_tasks_desired'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: An ECS service runs fewer tasks than it should.
          headline: 'An ECS service runs too few tasks'
          recovered: 'The service runs all its tasks again.'
          affects: 'The service does not run in full.'
          next_step: 'Open the HAI services and disk dashboard to see which service. Then check its tasks in ECS.'
          dashboard: 'HAI services and disk'

      - uid: service_health_down
        title: ServiceHealthDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: '(hai_service_probe_up == bool 0) * on (service) group_left () (hai_service_tasks_desired > bool 0)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The health endpoint of a service that should run does not answer.
          headline: 'A service health check fails'
          recovered: 'The health endpoint of the service answers again.'
          affects: 'The service runs but does not answer.'
          next_step: 'Open the HAI services and disk dashboard to see which service. Read its log on the host.'
          dashboard: 'HAI services and disk'

      - uid: service_tasks_restarting
        title: ServiceTasksRestarting
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'sum by (service) (hai_service_tasks_stopped_recent{stop_code!="UserInitiated"}) > bool 2'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: More than 2 tasks of a service stopped in the last hour, so it is restarting.
          headline: 'A service keeps restarting'
          recovered: 'The service has not restarted more than 2 times in the last hour.'
          affects: 'The service is unstable and may drop requests.'
          next_step: 'Open the HAI services and disk dashboard to see the stop reasons. Read the service log.'
          dashboard: 'HAI services and disk'

      - uid: scratch_disk_low
        title: ScratchDiskLow
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: '(hai_host_disk_free_bytes{volume="scratch"} / hai_host_disk_total_bytes{volume="scratch"}) < bool 0.15'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: The job scratch volume has less than 15 percent free, so the next job may fail for space.
          headline: 'Job scratch disk is low'
          recovered: 'The job scratch volume has enough free space again.'
          affects: 'The next job may fail for lack of space.'
          next_step: 'Free space on the job scratch volume or grow it before the next job.'
          dashboard: 'HAI services and disk'

      - uid: data_disk_low
        title: DataDiskLow
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: '(hai_host_disk_free_bytes{volume="data"} / hai_host_disk_total_bytes{volume="data"}) < bool 0.10'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: The data volume has less than 10 percent free.
          headline: 'Data disk is low'
          recovered: 'The data volume has enough free space again.'
          affects: 'Services that write to the data volume may fail.'
          next_step: 'Free space on the data volume or grow it now.'
          dashboard: 'HAI services and disk'

      - uid: opensearch_cluster_red
        title: OpenSearchClusterRed
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'hai_opensearch_cluster_status == bool 2'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The OpenSearch cluster is red, so OpenMetadata search and lineage reads can fail.
          headline: 'OpenSearch cluster is red'
          recovered: 'The OpenSearch cluster is no longer red.'
          affects: 'OpenMetadata search and lineage reads can fail.'
          next_step: 'Check the OpenSearch task on the host and read its log.'
          dashboard: 'HAI OpenMetadata'

      - uid: opensearch_cluster_yellow
        title: OpenSearchClusterYellow
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 1800, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'hai_opensearch_cluster_status == bool 1'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: The OpenSearch cluster has been yellow for 30 minutes, so some replica shards are not assigned.
          headline: 'OpenSearch cluster is yellow'
          recovered: 'The OpenSearch cluster is no longer yellow.'
          affects: 'Some replica shards are not assigned. Search still works.'
          next_step: 'No urgent action is needed. Check the OpenSearch task if it stays yellow.'
          dashboard: 'HAI OpenMetadata'

      - uid: bootstrap_task_failed
        title: BootstrapTaskFailed
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'hai_bootstrap_task_last_exit_code != bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: The latest run of a one-shot bootstrap task (code fetch, Polaris bootstrap or OpenMetadata bootstrap) did not exit with 0.
          headline: 'A bootstrap task failed'
          recovered: 'The latest run of the bootstrap task exited with 0.'
          affects: 'The service that this task prepares may not work.'
          next_step: 'Read the log of the failed one-shot task. It is the code fetch, the Polaris bootstrap or the OpenMetadata bootstrap.'
          dashboard: 'HAI services and disk'
