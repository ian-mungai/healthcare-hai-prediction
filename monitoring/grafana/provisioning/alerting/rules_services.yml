# Service alerts, from the live ECS reads and health probes of the host state exporter (monitoring/host_state_exporter.py).
# The notification policy (policies.yml) sends every alert to the one contact point (contact_points.yml), so no rule names a receiver.
apiVersion: 1

groups:
  - orgId: 1
    name: hai_services
    folder: HAI
    interval: 1m
    rules:
      - uid: service_tasks_missing
        title: ServiceTasksMissing
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'hai_service_tasks_running < bool hai_service_tasks_desired'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: An ECS service runs fewer tasks than it should.
          headline: 'ECS service runs too few tasks'
          recovered: 'The missing-task warning cleared. The running count may have reached the desired count. The desired count may have been lowered. Either count may also no longer be reported.'
          resolved_affects: 'Work that the service should have done in the gap may be missing.'
          resolved_next: 'Open the HAI services and disk dashboard and check the running and desired counts of the service.'
          affects: 'The service runs fewer tasks than it should.'
          next_step: 'Open the HAI services and disk dashboard to see which service. Then check its tasks in ECS.'
          dashboard: 'HAI services and disk'

      - uid: service_health_down
        title: ServiceHealthDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: '(hai_service_probe_up == bool 0) * on (service) group_left () (hai_service_tasks_desired > bool 0)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'A service that should be running does not pass its health check.'
          headline: 'A service health check fails'
          recovered: 'The service health warning cleared. This also happens when the service is no longer required or stops reporting.'
          resolved_affects: 'Requests to the service in the gap may have failed.'
          resolved_next: 'Check whether the service is still required and whether its health check passes.'
          affects: 'The service may not answer requests.'
          next_step: 'Open the HAI services and disk dashboard to see which service. Read its log on the host.'
          dashboard: 'HAI services and disk'

      - uid: service_tasks_restarting
        title: ServiceTasksRestarting
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'sum by (service) (hai_service_tasks_stopped_recent{stop_code!="UserInitiated"}) > bool 2'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: More than two non-user tasks of this service stopped in the last hour.
          headline: 'Service tasks keep stopping'
          recovered: 'At most two non-user task stops are reported in the last hour.'
          resolved_affects: 'Earlier task stops may have interrupted work.'
          resolved_next: 'Read the stop reasons on the HAI services and disk dashboard.'
          affects: 'The service had more than two task stops that were not started by a user. It may be unstable.'
          next_step: 'Open the HAI services and disk dashboard to see the stop reasons. Read the service log.'
          dashboard: 'HAI services and disk'

      - uid: scratch_disk_low
        title: ScratchDiskLow
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: '(hai_host_disk_free_bytes{volume="scratch"} / hai_host_disk_total_bytes{volume="scratch"}) < bool 0.15'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: The job scratch volume has less than 15 percent free, so the next job may fail for space.
          headline: 'Job scratch disk is low'
          recovered: 'The job scratch volume reports at least 15 percent free or reports nothing.'
          resolved_affects: 'A job that ran while the volume was low may have failed for space.'
          resolved_next: 'Check the recent job runs in Airflow for space errors.'
          affects: 'The next job may fail for lack of space.'
          next_step: 'Free space on the job scratch volume or grow it before the next job.'
          dashboard: 'HAI services and disk'

      - uid: data_disk_low
        title: DataDiskLow
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: '(hai_host_disk_free_bytes{volume="data"} / hai_host_disk_total_bytes{volume="data"}) < bool 0.10'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: The data volume has less than 10 percent free.
          headline: 'Data disk is low'
          recovered: 'The data volume reports at least 10 percent free or reports nothing.'
          resolved_affects: 'A service that wrote to the volume while it was low may have failed.'
          resolved_next: 'Open the HAI services and disk dashboard and check that every service runs.'
          affects: 'Services that write to the data volume may fail.'
          next_step: 'Free space on the data volume or grow it now.'
          dashboard: 'HAI services and disk'

      - uid: opensearch_cluster_red
        title: OpenSearchClusterRed
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'hai_opensearch_cluster_status == bool 2'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The OpenSearch cluster is red, so OpenMetadata search and lineage reads can fail.
          headline: 'OpenSearch cluster is red'
          recovered: 'The cluster is no longer reported red. It may be yellow or green or its status may be unreported.'
          resolved_affects: 'Searches and lineage reads in the red time may have failed.'
          resolved_next: 'Check the cluster state on HAI services and disk (panel OpenSearch cluster status).'
          affects: 'OpenMetadata search and lineage reads can fail.'
          next_step: 'Check the OpenSearch task on the host and read its log. The cluster status is on HAI services and disk.'
          dashboard: 'HAI services and disk'

      - uid: opensearch_cluster_yellow
        title: OpenSearchClusterYellow
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 1800, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'hai_opensearch_cluster_status == bool 1'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: The OpenSearch cluster has been yellow for 30 minutes, so some replica shards are not assigned.
          headline: 'OpenSearch cluster is yellow'
          recovered: 'The cluster is no longer reported yellow. It may be green or red or its status may be unreported.'
          resolved_affects: 'A red cluster would raise its own alert after its five-minute hold.'
          resolved_next: 'Check the current state on HAI services and disk. A red state still needs attention.'
          affects: 'Some replica shards are not assigned. Search still works.'
          next_step: 'Wait and watch the cluster status on HAI services and disk. Check the OpenSearch task if it stays yellow.'
          dashboard: 'HAI services and disk'

      - uid: bootstrap_task_failed
        title: BootstrapTaskFailed
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'hai_bootstrap_task_last_exit_code != bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: The latest run of the setup task named in Details failed.
          headline: 'A bootstrap task failed'
          recovered: 'The latest run of this setup task is not reported as failed.'
          resolved_affects: 'The service may have run without its bootstrap in the meantime.'
          resolved_next: 'Open the HAI services and disk dashboard. Check the service and the panel Last exit code, by one-shot task.'
          affects: 'The service that this setup task prepares may not work.'
          next_step: 'A setup task failed. Read the log of the task named in Details.'
          dashboard: 'HAI services and disk'
