# OpenMetadata alert, from its live health check.
# The notification policy (policies.yml) sends every alert to the one contact point (contact_points.yml), so no rule names a receiver.
apiVersion: 1

groups:
  - orgId: 1
    name: hai_openmetadata
    folder: HAI
    interval: 1m
    rules:
      - uid: openmetadata_unhealthy
        title: OpenMetadataUnhealthy
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'hai_openmetadata_healthy == bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A health check of OpenMetadata reports a failure.
          headline: 'OpenMetadata health check fails'
          recovered: 'OpenMetadata reports healthy or its health is no longer reported. A failed health read drops the series.'
          resolved_affects: 'Catalog updates from the time of the failure may be missing.'
          resolved_next: 'Open the HAI OpenMetadata dashboard and check the panel OpenMetadata healthy.'
          affects: 'The data catalog may be unavailable or out of date.'
          next_step: 'Open the HAI OpenMetadata dashboard to see which check fails.'
          dashboard: 'HAI OpenMetadata'

      - uid: lineage_delivery_failing
        title: LineageDeliveryFailing
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'sum(increase(hai_lineage_events_total{result!="sent"}[15m])) > bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The scheduler could not deliver lineage events to OpenMetadata in the last 15 minutes. The tasks still ran, but the catalog lineage is behind.
          headline: 'Lineage events are not delivered'
          recovered: 'No new lineage delivery failure is reported in the last 15 minutes.'
          resolved_affects: 'Events that failed earlier may not have been delivered, so the catalog lineage may stay behind.'
          resolved_next: 'Check the lineage of the affected run in OpenMetadata.'
          affects: 'The tasks still run, but the catalog lineage is behind.'
          next_step: 'Check that OpenMetadata is up. Check the lineage of the affected run in OpenMetadata.'
          dashboard: 'HAI OpenMetadata'
