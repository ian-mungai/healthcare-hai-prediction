# Drift alert, from the result that the drift check phase pushes at its exit.
# The notification policy (policies.yml) sends every alert to the one contact point (contact_points.yml), so no rule names a receiver.
apiVersion: 1

groups:
  - orgId: 1
    name: hai_drift
    folder: HAI
    interval: 1m
    rules:
      - uid: drift_triggered
        title: DriftTriggered
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: '(hai_drift_triggered == bool 1) and on (job, phase, model_set, job_type, outcome) (hai_job_finish_timestamp_seconds == on (job, phase, model_set, job_type) group_left () max by (job, phase, model_set, job_type) (hai_job_finish_timestamp_seconds))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: The latest drift check of a HAI type reached its trigger share, so its model is due for retraining.
          headline: 'Drift reached retraining trigger'
          recovered: 'The latest drift check of this type no longer shows a trigger. A newer check may also have failed or reported nothing.'
          resolved_affects: 'The trigger is no longer reported. A later check or missing monitoring data can clear this warning. Any training already started continues.'
          resolved_next: 'If you expect a new model, check in Airflow that the requested training_dag run exists.'
          affects: 'The drift rules say this model is due for retraining.'
          next_step: 'The drift workflow makes the retraining decision. In Airflow, check trigger_training and the requested training_dag run.'
          dashboard: 'HAI drift'
