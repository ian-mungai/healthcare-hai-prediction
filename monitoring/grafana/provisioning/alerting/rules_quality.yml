# Data quality alerts, from the dbt and quality gate counts that the layer jobs push themselves (scripts/lakehouse/layer_metrics.py).
# The notification policy (policies.yml) sends every alert to the one contact point (contact_points.yml), so no rule names a receiver.
apiVersion: 1

groups:
  - orgId: 1
    name: hai_quality
    folder: HAI
    interval: 1m
    rules:
      - uid: dbt_tests_failed
        title: DbtTestsFailed
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: '(max by (job, phase, model_set, job_type, outcome) (hai_dbt_tests{status=~"fail|error"}) > bool 0) and on (job, phase, model_set, job_type, outcome) (hai_job_finish_timestamp_seconds == on (job, phase, model_set, job_type) group_left () max by (job, phase, model_set, job_type) (hai_job_finish_timestamp_seconds))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: A dbt test of the layer failed in its latest build.
          headline: 'A dbt test failed'
          recovered: 'The latest build of this layer reports no failed dbt test or reports no test result.'
          resolved_affects: 'The output of the failed build may still be wrong. The layers after it may be behind.'
          resolved_next: 'Check in Airflow that the latest build passed and the later layers ran.'
          affects: 'The data of this layer failed a check, so its output may be wrong or missing.'
          next_step: 'Open Airflow and find the latest build of this layer. Read which dbt test failed.'
          dashboard: 'HAI data quality'

      - uid: quality_checks_failed
        title: QualityChecksFailed
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: '(max by (job, phase, model_set, job_type, outcome, kind) (hai_quality_checks_failed) > bool 0) and on (job, phase, model_set, job_type, outcome) (hai_job_finish_timestamp_seconds == on (job, phase, model_set, job_type) group_left () max by (job, phase, model_set, job_type) (hai_job_finish_timestamp_seconds))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: A quality check of the layer's gate failed in its latest validation.
          headline: 'A quality check failed'
          recovered: 'The latest validation of this layer reports no failed check or reports no check result.'
          resolved_affects: 'The data of the failed validation was not accepted. The layers after it may be behind.'
          resolved_next: 'Check in Airflow that the latest validation passed and the later layers ran.'
          affects: 'The gate of this layer failed, so its data is not accepted.'
          next_step: 'Open Airflow and find the latest validation of this layer. Read which check failed.'
          dashboard: 'HAI data quality'
