# Ingestion alerts, from the counts that the publisher task and the bronze stage job push at their exit.
# The notification policy (policies.yml) sends every alert to the one contact point (contact_points.yml), so no rule names a receiver.
apiVersion: 1

groups:
  - orgId: 1
    name: hai_ingestion
    folder: HAI
    interval: 1m
    rules:
      - uid: publisher_files_missing_after_retry
        title: PublisherFilesMissingAfterRetry
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'max(hai_publisher_files_missing{job="publisher", run_kind="retry"}) > bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: A publisher retry run ended with files that were not captured, so the month's capture is incomplete.
          headline: 'Files missing after retry'
          recovered: 'The latest publisher retry run reports no missing file or reports nothing.'
          resolved_affects: 'A bronze run that started before the capture was complete may have kept the earlier capture of those files.'
          resolved_next: 'Check the carried-over record of the next bronze run.'
          affects: 'The capture of the month is incomplete. Bronze keeps the earlier capture of those files.'
          next_step: 'Open the HAI ingestion dashboard to see how many files are missing. Then read the ingestion run record.'
          dashboard: 'HAI ingestion'
      - uid: bronze_stage_skipped_tables
        title: BronzeStageSkippedTables
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'max(hai_bronze_stage_skipped_tables{job="bronze", phase="stage"}) > bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: The latest bronze stage left tables out of the pipeline run, so those tables are not loaded in it.
          headline: 'Bronze stage skipped tables'
          recovered: 'The latest bronze stage reports no skipped table or reports nothing.'
          resolved_affects: 'The earlier run that skipped tables still lacks them.'
          resolved_next: 'Check that the tables load in the next bronze run.'
          affects: 'The skipped tables are not loaded in the pipeline run.'
          next_step: 'Read the bronze run notice and its run record. Check if the tables should have a source file.'
          dashboard: 'HAI ingestion'
