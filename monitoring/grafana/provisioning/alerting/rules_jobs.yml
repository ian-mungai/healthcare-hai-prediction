# Host job alerts, from the metrics the jobs push themselves (scripts/metrics_push.py). A job is failing when its newest failed or interrupted finish is later than its newest succeeded finish, so a later success clears the alert without any delete.
# The notification policy (policies.yml) sends every alert to the one contact point (contact_points.yml), so no rule names a receiver.
apiVersion: 1

groups:
  - orgId: 1
    name: hai_jobs
    folder: HAI
    interval: 1m
    rules:
      - uid: job_failed
        title: JobFailed
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'max by (job, phase, model_set, job_type) (hai_job_finish_timestamp_seconds{outcome=~"failed|interrupted"}) > bool on (job, phase, model_set, job_type) (max by (job, phase, model_set, job_type) (hai_job_finish_timestamp_seconds{outcome="succeeded"}) or on (job, phase, model_set, job_type) max by (job, phase, model_set, job_type) (hai_job_finish_timestamp_seconds{outcome=~"failed|interrupted"}) * 0)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: A host job phase failed or was interrupted. No later run of it has succeeded.
          headline: 'Host job failed'
          recovered: 'A later success of this job phase is recorded or its failure record is gone.'
          resolved_affects: 'Layers after this job phase may still be behind, because they did not run while it failed.'
          resolved_next: 'Check the latest run of this job phase in Airflow. Check that the DAGs after this layer have run since.'
          affects: 'The job phase did not succeed, so the layers after it do not run on its output.'
          next_step: 'Open Airflow and find the failed run of this job. Read its task log. Fix the cause and rerun the failed task.'
          dashboard: 'HAI host jobs'

      - uid: job_vanished
        title: JobVanished
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: '(time() - hai_job_heartbeat_timestamp_seconds{outcome="running"} > bool 180) * on (job, phase, model_set, job_type) (hai_job_start_timestamp_seconds{outcome="running"} > bool on (job, phase, model_set, job_type) (max by (job, phase, model_set, job_type) (hai_job_finish_timestamp_seconds) or on (job, phase, model_set, job_type) hai_job_start_timestamp_seconds{outcome="running"} * 0))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: A host job phase stopped sending heartbeats for 3 minutes without an exit push, so it was killed or lost. Its last heartbeat shows its memory.
          headline: 'Host job went silent'
          recovered: 'The heartbeat warning cleared. A heartbeat or an exit may have been recorded. Monitoring data may also be missing.'
          resolved_affects: 'The earlier heartbeat gap may have left incomplete work.'
          resolved_next: 'Check the outcome of the affected run in Airflow.'
          affects: 'The job phase was killed or lost, so its output is missing.'
          next_step: 'Open the HAI host jobs dashboard to see the last memory of the job. Then read its task log in Airflow.'
          dashboard: 'HAI host jobs'

      - uid: job_peak_memory_near_cap
        title: JobPeakMemoryNearCap
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: '(max by (job, phase, model_set, job_type) (hai_job_peak_memory_bytes or hai_job_memory_peak_bytes) / scalar(hai_host_job_cap_mib * 1048576)) > bool 0.9'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: A host job phase used more than 90 percent of the host job cap at its peak.
          headline: 'Host job near its memory cap'
          recovered: 'The peak-memory warning cleared. The peak may be within the cap. The peak or the cap reading may also be missing.'
          resolved_affects: 'A larger input can still run out of memory.'
          resolved_next: 'Check the peak memory and the cap on the HAI host jobs dashboard, now and after the next run.'
          affects: 'The job phase may be killed for memory on a larger input.'
          next_step: 'Open the HAI host jobs dashboard to see the peak memory. Plan a higher cap before the next run.'
          dashboard: 'HAI host jobs'

      - uid: pushgateway_down
        title: PushgatewayDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'up{job="pushgateway"} == bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Prometheus cannot scrape the Pushgateway, so job metrics are unavailable to Prometheus.
          headline: 'Pushgateway is down'
          recovered: 'The Pushgateway scrape is no longer reported as failed. The target may also have been removed.'
          resolved_affects: 'Job metrics were unavailable to Prometheus during the gap. Intermediate samples or alerts may be missing.'
          resolved_next: 'Check in Airflow that the jobs of the gap finished.'
          affects: 'Job metrics are unavailable to Prometheus, so the job alerts and the host jobs dashboard go blind.'
          next_step: 'Check that the Pushgateway task runs on the host.'
          dashboard: 'HAI host jobs'

      - uid: online_reload_failed
        title: OnlineReloadFailed
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'max by (feature_set) (hai_online_reload_result{result="failed"}) > bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: The online store reload at host start failed for a feature set, so the store may be empty.
          headline: 'Online store reload failed'
          recovered: 'The latest online reload of this feature set is not reported as failed.'
          resolved_affects: 'The store may still lack the data of the failed reload.'
          resolved_next: 'Open the HAI feature store dashboard and check that the store holds data.'
          affects: 'The online store of this feature set may be empty, so the model API may refuse its predictions.'
          next_step: 'Read the log of the reload step for this feature set to find why it failed.'
          dashboard: 'HAI feature store'
