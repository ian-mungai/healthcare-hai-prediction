          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'up{job="mlflow"} == bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Prometheus cannot read the MLflow metrics through the host state exporter. MLflow or the relay is down.
          headline: 'MLflow metrics are not reachable'
          recovered: 'The MLflow metrics scrape is no longer reported as failed. The target may also have been removed.'
          resolved_affects: 'Metrics are missing for the gap. A training or promotion step in the gap may have failed.'
          resolved_next: 'Check that MLflow answers. Read the failed runs of the gap in Airflow if there are any.'
          affects: 'MLflow metrics are unavailable. Check MLflow itself before you retry training or promotion.'
          next_step: 'Read both the MLflow log and the host state exporter log. Use the HAI MLflow dashboard only for request metrics.'
          dashboard: 'HAI MLflow'

