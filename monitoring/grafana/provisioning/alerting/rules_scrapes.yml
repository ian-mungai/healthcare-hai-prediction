      - uid: postgres_down
        title: PostgresDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'pg_up == bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The Postgres exporter cannot reach Postgres, which Airflow, Polaris and MLflow need.
          headline: 'Postgres is down'
          recovered: 'The Postgres exporter reaches Postgres again.'
          affects: 'Airflow, Polaris and MLflow need Postgres and cannot work without it.'
          next_step: 'Check that the Postgres task runs on the host and read its log.'
          dashboard: 'HAI infrastructure'

      - uid: node_exporter_down
        title: NodeExporterDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'up{job="node_exporter"} == bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
