                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The Postgres exporter cannot reach Postgres, which Airflow, Polaris and MLflow need.
          headline: 'Postgres is down'
          recovered: 'The Postgres exporter no longer reports Postgres as down. It may also have stopped reporting.'
          resolved_affects: 'Calls of Airflow, Polaris or MLflow in the gap may have failed.'
          resolved_next: 'Check in Airflow that the runs of the gap finished.'
          affects: 'Airflow, Polaris and MLflow may fail without Postgres.'
          next_step: 'Check that the Postgres task runs on the host and read its log.'
          dashboard: 'HAI infrastructure'

      - uid: node_exporter_down
        title: NodeExporterDown
