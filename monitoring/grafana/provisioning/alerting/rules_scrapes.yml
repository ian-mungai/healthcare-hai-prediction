          headline: 'Postgres exporter unreachable'
          recovered: 'The Postgres exporter scrape is no longer reported as failed. The target may also have been removed.'
          resolved_affects: 'Postgres metrics are missing for the gap.'
          resolved_next: 'Open the HAI infrastructure dashboard and check the current values.'
          affects: 'Postgres metrics are lost.'
          next_step: 'Check that the Postgres exporter task runs on the host.'
          dashboard: 'HAI infrastructure'

      - uid: postgres_down
        title: PostgresDown
        condition: C
        data:
