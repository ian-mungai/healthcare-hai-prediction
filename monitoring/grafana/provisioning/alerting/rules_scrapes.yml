# Alerts for the built-in endpoints and the exporters of the services that have none (Polaris, OpenMetadata, MLflow, Redis, Postgres and the host).
# The notification policy (policies.yml) sends every alert to the one contact point (contact_points.yml), so no rule names a receiver.
apiVersion: 1

groups:
  - orgId: 1
    name: hai_scrapes
    folder: HAI
    interval: 1m
    rules:
      - uid: polaris_down
        title: PolarisDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'up{job="polaris"} == bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Prometheus cannot scrape Polaris, so the catalog metrics are lost.
          headline: 'Polaris is not reachable'
          recovered: 'Prometheus reaches Polaris again.'
          affects: 'Catalog metrics are lost. Polaris may be down.'
          next_step: 'Check that the Polaris task runs on the host.'
          dashboard: 'HAI Polaris'

      - uid: openmetadata_metrics_down
        title: OpenMetadataMetricsDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'up{job="openmetadata"} == bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Prometheus cannot scrape the OpenMetadata admin port.
          headline: 'OpenMetadata metrics are not reachable'
          recovered: 'Prometheus reaches the OpenMetadata admin port again.'
          affects: 'OpenMetadata metrics are lost. OpenMetadata may be down.'
          next_step: 'Check that OpenMetadata runs on the host.'
          dashboard: 'HAI OpenMetadata'

      - uid: mlflow_metrics_down
        title: MlflowMetricsDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'up{job="mlflow"} == bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Prometheus cannot read the MLflow metrics through the host state exporter. MLflow or the relay is down.
          headline: 'MLflow metrics are not reachable'
          recovered: 'Prometheus reads the MLflow metrics again.'
          affects: 'MLflow or its relay is down, so training and promotion cannot log or read runs.'
          next_step: 'Check that MLflow and its relay run on the host.'
          dashboard: 'HAI MLflow'

      - uid: redis_exporter_down
        title: RedisExporterDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'up{job="redis_exporter"} == bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Prometheus cannot scrape the Redis exporter.
          headline: 'Redis exporter is not reachable'
          recovered: 'Prometheus reaches the Redis exporter again.'
          affects: 'Redis metrics are lost.'
          next_step: 'Check that the Redis exporter task runs on the host.'
          dashboard: 'HAI feature store'

      - uid: redis_down
        title: RedisDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'redis_up == bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The Redis exporter cannot reach Redis, so the online feature store is unavailable.
          headline: 'Redis is down'
          recovered: 'The Redis exporter reaches Redis again.'
          affects: 'The online feature store is unavailable, so the model API cannot read features.'
          next_step: 'Check that the Redis task runs on the host and read its log.'
          dashboard: 'HAI feature store'

      - uid: postgres_exporter_down
        title: PostgresExporterDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'up{job="postgres_exporter"} == bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
