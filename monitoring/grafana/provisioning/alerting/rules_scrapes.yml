                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Prometheus cannot scrape the node exporter.
          headline: 'Node exporter is not reachable'
          recovered: 'Prometheus reaches the node exporter again.'
          affects: 'Host CPU, memory and disk metrics are lost.'
          next_step: 'Check that the node exporter task runs on the host.'
          dashboard: 'HAI host capacity'

      - uid: host_oom_kill
        title: HostOomKill
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'increase(node_vmstat_oom_kill[1h]) > bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
