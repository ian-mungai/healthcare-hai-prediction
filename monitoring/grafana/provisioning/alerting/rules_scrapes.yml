          headline: 'Redis exporter is not reachable'
          recovered: 'The Redis exporter scrape is no longer reported as failed. The target may also have been removed.'
          resolved_affects: 'Redis metrics are missing for the gap.'
          resolved_next: 'Open the HAI feature store dashboard and check the current values.'
          affects: 'Redis metrics are lost.'
          next_step: 'Check that the Redis exporter task runs on the host.'
          dashboard: 'HAI feature store'

