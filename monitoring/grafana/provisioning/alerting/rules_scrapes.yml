              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The Redis exporter cannot reach Redis, so the online feature store is unavailable.
          headline: 'Redis is down'
          recovered: 'The Redis exporter no longer reports Redis as down. It may also have stopped reporting.'
          resolved_affects: 'Requests in the gap may have failed to read features.'
          resolved_next: 'Open the HAI feature store dashboard and check that the store holds data.'
          affects: 'The online feature store may be unavailable, so the model API may fail to read features.'
          next_step: 'Check that the Redis task runs on the host and read its log.'
          dashboard: 'HAI feature store'

