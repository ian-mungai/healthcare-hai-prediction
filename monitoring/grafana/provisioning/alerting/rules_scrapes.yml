# Alerts for the built-in endpoints and the exporters of the services that have none (Polaris, OpenMetadata, MLflow, Redis, Postgres and the host).
# The notification policy (policies.yml) sends every alert to the one contact point (contact_points.yml), so no rule names a receiver.
apiVersion: 1

groups:
  - orgId: 1
    name: hai_scrapes
    folder: HAI
    interval: 1m
    rules:
      - uid: polaris_down
        title: PolarisDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'up{job="polaris"} == bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Prometheus cannot scrape Polaris, so the catalog metrics are lost.
          headline: 'Polaris is not reachable'
          recovered: 'The Polaris scrape is no longer reported as failed. The target may also have been removed.'
          resolved_affects: 'Catalog metrics are missing for the gap.'
          resolved_next: 'Open the HAI Polaris dashboard and check the current state.'
          affects: 'Catalog metrics are lost. Polaris may be down.'
          next_step: 'Check that the Polaris task runs on the host.'
          dashboard: 'HAI Polaris'

      - uid: openmetadata_metrics_down
        title: OpenMetadataMetricsDown
        condition: C
        data:
