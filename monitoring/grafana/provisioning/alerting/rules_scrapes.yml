      - uid: host_oom_kill
        title: HostOomKill
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'increase(node_vmstat_oom_kill[1h]) > bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
