              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Prometheus cannot scrape the OpenMetadata admin port.
          headline: 'OpenMetadata metrics unreachable'
          recovered: 'The OpenMetadata scrape is no longer reported as failed. The target may also have been removed.'
          resolved_affects: 'OpenMetadata metrics are missing for the gap.'
          resolved_next: 'Open the HAI OpenMetadata dashboard and check the current health.'
          affects: 'OpenMetadata metrics are lost. OpenMetadata may be down.'
          next_step: 'Check that OpenMetadata runs on the host.'
          dashboard: 'HAI OpenMetadata'

