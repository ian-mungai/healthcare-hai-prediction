        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: The kernel killed a process for memory in the last hour.
          headline: 'Host killed a process for memory'
          recovered: 'The kernel killed no process for memory in the last hour.'
          affects: 'A job or service stopped, so its work may be incomplete.'
          next_step: 'Open the HAI host capacity dashboard to see the memory. Then find which job or service stopped in Airflow.'
          dashboard: 'HAI host capacity'
