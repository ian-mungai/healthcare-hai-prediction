            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'pg_up == bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
