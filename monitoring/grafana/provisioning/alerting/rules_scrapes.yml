        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: The kernel killed a process for memory in the last hour.
          headline: 'Host killed a process for memory'
          recovered: 'The kernel reports no process killed for memory in the last hour.'
          resolved_affects: 'The killed process may still be down and its work may be incomplete.'
          resolved_next: 'Open the HAI services and disk dashboard. Check the logs for the process that was killed.'
          affects: 'A process on the host was killed for memory, so a job or service may have stopped.'
          next_step: 'Check the host and ECS task logs for the killed process. Use Airflow to inspect a failed job.'
          dashboard: 'HAI host capacity'
