# Every alert goes to the one contact point. Alerts of one rule and job are grouped into one message, and an unresolved alert repeats every 12 hours.
apiVersion: 1

policies:
  - orgId: 1
    receiver: hai_sns
    group_by: [alertname, job]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
