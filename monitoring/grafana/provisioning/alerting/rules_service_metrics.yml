# Alerts on the request, error, latency and heap metrics that Polaris and MLflow expose and on Grafana's own alerting metrics.
# Names and labels are the ones monitoring/known_metrics.json records from the pinned sources. The up alerts of these services stay in rules_scrapes.yml.
# The notification policy (policies.yml) sends every alert to the one contact point (contact_points.yml), so no rule names a receiver.
apiVersion: 1

groups:
  - orgId: 1
    name: hai_service_metrics
    folder: HAI
    interval: 1m
    rules:

      - uid: polaris_server_errors
        title: PolarisServerErrors
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'sum(increase(http_server_requests_seconds_count{job="polaris",status=~"5.."}[10m])) > bool 3'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Polaris answered more than three requests with a 5xx status in ten minutes.
          headline: 'Polaris returns server errors'
          recovered: 'The recorded server-error count is no longer above three in ten minutes.'
          resolved_affects: 'Jobs that used the catalog during the errors may have failed.'
          resolved_next: 'Open the HAI Polaris dashboard and check the jobs of that time in Airflow.'
          affects: 'Catalog reads or writes may fail.'
          next_step: 'Read the Polaris log on the host. The HAI Polaris dashboard shows the error rate.'
          dashboard: 'HAI Polaris'

      - uid: polaris_heap_high
        title: PolarisHeapHigh
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'sum(jvm_memory_used_bytes{job="polaris",area="heap"}) / sum(jvm_memory_max_bytes{job="polaris",area="heap"} > 0) > bool 0.9'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: The Polaris Java heap has stayed above 90% of its maximum. A heap with no defined maximum raises no alert.
          headline: 'Polaris heap is almost full'
          recovered: 'The Polaris heap is back at or under 90 percent.'
          resolved_affects: 'Polaris may have slowed down while the heap was high.'
          resolved_next: 'Watch the HAI Polaris dashboard to see that the heap stays low.'
          affects: 'Polaris may slow down or stop.'
          next_step: 'Watch the HAI Polaris dashboard. Plan more memory for Polaris if the heap stays high.'
          dashboard: 'HAI Polaris'

      - uid: mlflow_server_errors
        title: MlflowServerErrors
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'sum(increase(mlflow_http_request_total{job="mlflow",status=~"5.."}[10m])) > bool 3'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: MLflow answered more than three requests with a 5xx status in ten minutes.
          headline: 'MLflow returns server errors'
          recovered: 'The recorded server-error count is no longer above three in ten minutes.'
          resolved_affects: 'Steps that used MLflow during the errors may have failed.'
          resolved_next: 'Open the HAI MLflow dashboard and check the runs of that time in Airflow.'
          affects: 'Training and promotion steps may fail to log or read runs.'
          next_step: 'Read the MLflow log on the host. The HAI MLflow dashboard shows the error rate.'
          dashboard: 'HAI MLflow'

      - uid: mlflow_slow_requests
        title: MlflowSlowRequests
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'histogram_quantile(0.95, sum by (le) (rate(mlflow_http_request_duration_seconds_bucket{job="mlflow"}[10m]))) > bool 5'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: The 95th percentile of MLflow request time has stayed above five seconds.
          headline: 'MLflow is slow'
          recovered: 'The 95th percentile of MLflow request time is back at or under five seconds.'
          resolved_affects: 'Steps that used MLflow in that time may have run slowly.'
          resolved_next: 'Open the HAI MLflow dashboard and check that the request time stays low.'
          affects: 'Training and promotion steps may run into their time limits.'
          next_step: 'Open the HAI MLflow dashboard to see the request time. Read the MLflow log.'
          dashboard: 'HAI MLflow'

      - uid: grafana_rule_evaluation_failing
        title: GrafanaRuleEvaluationFailing
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'sum(increase(grafana_alerting_rule_evaluation_failures_total{job="grafana"}[10m])) > bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Grafana alert rules fail to evaluate, so some alerts cannot fire.
          headline: 'Grafana rules fail to evaluate'
          recovered: 'Grafana evaluates its alert rules again.'
          resolved_affects: 'An alert that should have fired in the gap may be missing.'
          resolved_next: 'Open the HAI Grafana dashboard and check the rules of the gap.'
          affects: 'Some alerts cannot fire.'
          next_step: 'Open the HAI Grafana dashboard. Read the Grafana log to find the failing rule.'
          dashboard: 'HAI Grafana'

      - uid: grafana_notifications_failing
        title: GrafanaNotificationsFailing
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: '((sum(increase(grafana_alerting_notifications_failed_total{job="grafana"}[15m])) > bool 0) or vector(0)) + ((sum(grafana_alerting_notifications_failed_total{job="grafana"} unless grafana_alerting_notifications_failed_total{job="grafana"} offset 15m) > bool 0) or vector(0)) + ((sum((grafana_alerting_notifications_failed_total{job="grafana"} > 0) and on (instance) (time() - process_start_time_seconds{job="grafana"} < 900)) > bool 0) or vector(0))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Grafana cannot deliver alert notifications to the SNS contact point (a first failure and a first failure after a restart also count).
          headline: 'Grafana cannot send alert emails'
          recovered: 'The notification failure condition has cleared.'
          resolved_affects: 'Emails that failed to send are not sent again, so you may have missed alerts.'
          resolved_next: 'Open Grafana, then Alerting, then Contact points. Read the delivery status of the hai_sns contact point.'
          affects: 'You may miss alert emails.'
          next_step: 'Open Grafana. Go to Alerting, then Contact points. Read the error of the hai_sns contact point.'
          dashboard: 'HAI Grafana'

      - uid: grafana_scheduler_behind
        title: GrafanaSchedulerBehind
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'grafana_alerting_scheduler_behind_seconds{job="grafana"} > bool 60'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The Grafana alert scheduler runs more than a minute behind, so alerts fire late.
          headline: 'Grafana scheduler is behind'
          recovered: 'The Grafana alert scheduler is on time again.'
          resolved_affects: 'Alerts fired late in the gap.'
          resolved_next: 'Open the HAI host capacity dashboard and check the host load.'
          affects: 'Alerts fire late.'
          next_step: 'Open the HAI host capacity dashboard to see if the host is under load.'
          dashboard: 'HAI Grafana'
