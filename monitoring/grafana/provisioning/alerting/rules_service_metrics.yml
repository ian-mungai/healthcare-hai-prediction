# Alerts on the request, error, latency and heap metrics that Polaris and MLflow expose and on Grafana's own alerting metrics.
# Names and labels are the ones monitoring/known_metrics.json records from the pinned sources. The up alerts of these services stay in rules_scrapes.yml.
# The notification policy (policies.yml) sends every alert to the one contact point (contact_points.yml), so no rule names a receiver.
apiVersion: 1

groups:
  - orgId: 1
    name: hai_service_metrics
    folder: HAI
    interval: 1m
    rules:

      - uid: polaris_server_errors
        title: PolarisServerErrors
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'sum(increase(http_server_requests_seconds_count{job="polaris",status=~"5.."}[10m])) > bool 3'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Polaris answered more than three requests with a 5xx status in ten minutes.

      - uid: polaris_heap_high
        title: PolarisHeapHigh
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'sum(jvm_memory_used_bytes{job="polaris",area="heap"}) / sum(clamp_min(jvm_memory_max_bytes{job="polaris",area="heap"}, 0)) > bool 0.9'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: The Polaris Java heap has stayed above 90% of its maximum.

      - uid: mlflow_server_errors
        title: MlflowServerErrors
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'sum(increase(mlflow_http_request_total{job="mlflow",status=~"5.."}[10m])) > bool 3'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: MLflow answered more than three requests with a 5xx status in ten minutes.

      - uid: mlflow_slow_requests
        title: MlflowSlowRequests
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'histogram_quantile(0.95, sum by (le) (rate(mlflow_http_request_duration_seconds_bucket{job="mlflow"}[10m]))) > bool 5'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: The 95th percentile of MLflow request time has stayed above five seconds.

      - uid: grafana_rule_evaluation_failing
        title: GrafanaRuleEvaluationFailing
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'sum(increase(grafana_alerting_rule_evaluation_failures_total{job="grafana"}[10m])) > bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Grafana alert rules fail to evaluate, so some alerts cannot fire.

      - uid: grafana_notifications_failing
        title: GrafanaNotificationsFailing
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'sum(increase(grafana_alerting_notifications_failed_total{job="grafana"}[15m])) > bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Grafana cannot deliver alert notifications to the SNS contact point.

      - uid: grafana_scheduler_behind
        title: GrafanaSchedulerBehind
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'grafana_alerting_scheduler_behind_seconds{job="grafana"} > bool 60'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The Grafana alert scheduler runs more than a minute behind, so alerts fire late.
