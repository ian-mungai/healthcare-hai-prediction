# Airflow alerts. Each rule queries the provisioned Prometheus data source and fires when its expression is 1; the expression is written with bool so it returns 1 or 0.
# The notification policy (policies.yml) sends every alert to the one contact point (contact_points.yml), so no rule names a receiver.
apiVersion: 1

groups:
  - orgId: 1
    name: hai_airflow
    folder: HAI
    interval: 1m
    rules:
      - uid: airflow_scheduler_silent
        title: AirflowSchedulerSilent
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: '(sum(increase(airflow_scheduler_heartbeat_total[10m])) == bool 0) or absent(airflow_scheduler_heartbeat_total)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: The Airflow scheduler sent no heartbeat for 10 minutes.
          headline: 'Airflow scheduler is silent'
          recovered: 'Heartbeats from the Airflow scheduler are reported again.'
          resolved_affects: 'DAG runs that were due while it was silent may have started late or not at all.'
          resolved_next: 'Open Airflow and check that the runs that were due in the meantime have started.'
          affects: 'DAG runs may not start or move on while the scheduler is silent.'
          next_step: 'Check that the Airflow scheduler runs on the host and read its log.'
          dashboard: 'HAI overview'

      - uid: airflow_dag_run_failed
        title: AirflowDagRunFailed
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'sum by (dag_id) (increase(airflow_dagrun_duration_seconds_count{state="failed"}[1h])) > bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: A DAG run failed in the last hour.
          headline: 'Airflow DAG run failed'
          recovered: 'No failed run of this DAG is reported in the last hour.'
          resolved_affects: 'The failure may only have left the one-hour window. The failed run can still need repair. The monitor may also have stopped reporting.'
          resolved_next: 'Check the latest run of this DAG in Airflow. Rerun the failed task only after the cause is fixed.'
          affects: 'A run of this DAG failed, so the steps that need its output may be missing.'
          next_step: 'Open the DAG in Airflow and find the failed run. Read the log of its failed task. Fix the cause, then rerun the failed task if the run still needs repair.'
          dashboard: 'HAI overview'

      - uid: airflow_task_failed
        title: AirflowTaskFailed
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'sum by (dag_id, task_id) (increase(airflow_task_instance_finished_total{state="failed"}[1h])) > bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: A task failed in the last hour.
          headline: 'Airflow task failed'
          recovered: 'No failed attempt of this task is reported in the last hour.'
          resolved_affects: 'Other tasks of the DAG can still fail. The failed attempt may have left later tasks undone. The monitor may also have stopped reporting.'
          resolved_next: 'Check the current state of the DAG run in Airflow.'
          affects: 'A failed attempt may delay later tasks.'
          next_step: 'Open the DAG in Airflow and check whether the task retried and the DAG run completed. Read the log of the failed attempt.'
          dashboard: 'HAI overview'

      - uid: airflow_dag_import_errors
        title: AirflowDagImportErrors
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'airflow_dag_processing_import_errors > bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A DAG file fails to import.
          headline: 'Airflow cannot import a DAG file'
          recovered: 'No DAG import error is reported. The metric may also no longer be reported.'
          resolved_affects: 'Runs that were due while the file was broken may have been missed. The monitor may also have stopped reporting.'
          resolved_next: 'Open Airflow and check that the DAG imports and that its intended run exists.'
          affects: 'The DAG in the broken file does not run until its file imports.'
          next_step: 'Open Airflow and read the import error it lists. Fix the DAG file.'
          dashboard: 'HAI overview'
