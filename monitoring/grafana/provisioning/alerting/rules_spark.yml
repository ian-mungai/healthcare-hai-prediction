# Spark alert for the bronze job, from the progress that the Spark session pushes itself (scripts/lakehouse/spark_progress.py).
# The notification policy (policies.yml) sends every alert to the one contact point (contact_points.yml), so no rule names a receiver.
apiVersion: 1

groups:
  - orgId: 1
    name: hai_spark
    folder: HAI
    interval: 1m
    rules:
      - uid: spark_tasks_failed
        title: SparkTasksFailed
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: hai_prometheus
            model:
              refId: A
              expr: 'max by (job, phase, model_set, job_type, outcome) (hai_spark_tasks_failed) > bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: A Spark task of the bronze load failed. Spark retries a task, so read the job outcome to see whether the load failed.
