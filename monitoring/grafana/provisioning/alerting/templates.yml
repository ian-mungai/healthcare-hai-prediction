# The text of every alert email. Amazon SNS sends plain text: no HTML, no Markdown and a subject of at most 100 characters. The contact point (contact_points.yml)
# names the two templates below. One alert reads as a subject and these blocks, in this order: what happened, when, what it affects, what to do next, where to
# look and details. A block with no content is left out. The words come from the annotations of each rule (summary, headline, recovered, affects, next_step and
# dashboard, in the rules_*.yml files), and the readable names of the labels come from this file. The times are in America/Los_Angeles with UTC in brackets.
# The two lists of names (hai.model_name and hai.hai_name) must agree with MODEL_LABELS and HAI_LABELS in orchestration/training_contract.py: the monitoring file
# check compares them. Grafana does not expand a dollar sign in a template, so the variables below stay as written.
apiVersion: 1

templates:
  - orgId: 1
    name: hai_sns
    template: |
      {{ define "hai.safe13" -}}
      {{ $v := . | reReplaceAll `[\x00-\x20\x7f]+` " " | reReplaceAll `[^ -~]` "?" | trimSpace -}}
      {{ if gt (len $v) 13 }}{{ printf "%.10s..." $v }}{{ else }}{{ $v }}{{ end }}
      {{- end }}

      {{ define "hai.safe17" -}}
      {{ $v := . | reReplaceAll `[\x00-\x20\x7f]+` " " | reReplaceAll `[^ -~]` "?" | trimSpace -}}
      {{ if gt (len $v) 17 }}{{ printf "%.14s..." $v }}{{ else }}{{ $v }}{{ end }}
      {{- end }}

      {{ define "hai.safe32" -}}
      {{ $v := . | reReplaceAll `[\x00-\x20\x7f]+` " " | reReplaceAll `[^ -~]` "?" | trimSpace -}}
      {{ if gt (len $v) 32 }}{{ printf "%.29s..." $v }}{{ else }}{{ $v }}{{ end }}
      {{- end }}

      {{ define "hai.mid10" -}}
      {{ $v := . | reReplaceAll `[\x00-\x20\x7f]+` " " | reReplaceAll `[^ -~]` "?" | trimSpace -}}
      {{ if gt (len $v) 10 }}{{ reReplaceAll `^(.{4}).*(.{4})$` "${1}..${2}" $v }}{{ else }}{{ $v }}{{ end }}
      {{- end }}

      {{ define "hai.mid14" -}}
      {{ $v := . | reReplaceAll `[\x00-\x20\x7f]+` " " | reReplaceAll `[^ -~]` "?" | trimSpace -}}
      {{ if gt (len $v) 14 }}{{ reReplaceAll `^(.{6}).*(.{6})$` "${1}..${2}" $v }}{{ else }}{{ $v }}{{ end }}
      {{- end }}

      {{ define "hai.mid20" -}}
      {{ $v := . | reReplaceAll `[\x00-\x20\x7f]+` " " | reReplaceAll `[^ -~]` "?" | trimSpace -}}
      {{ if gt (len $v) 20 }}{{ reReplaceAll `^(.{9}).*(.{9})$` "${1}..${2}" $v }}{{ else }}{{ $v }}{{ end }}
      {{- end }}

      {{ define "hai.dag" -}}
      {{ $v := . | reReplaceAll `[\x00-\x20\x7f]+` " " | reReplaceAll `[^ -~]` "?" | trimSpace | reReplaceAll `_dag$` "" -}}
      {{ if gt (len $v) 20 }}{{ reReplaceAll `^(.{9}).*(.{9})$` "${1}..${2}" $v }}{{ else }}{{ $v }}{{ end }}
      {{- end }}

      {{ define "hai.safe22" -}}
      {{ $v := . | reReplaceAll `[\x00-\x20\x7f]+` " " | reReplaceAll `[^ -~]` "?" | trimSpace -}}
      {{ if gt (len $v) 22 }}{{ printf "%.19s..." $v }}{{ else }}{{ $v }}{{ end }}
      {{- end }}

      {{ define "hai.safe24" -}}
      {{ $v := . | reReplaceAll `[\x00-\x20\x7f]+` " " | reReplaceAll `[^ -~]` "?" | trimSpace -}}
      {{ if gt (len $v) 24 }}{{ printf "%.21s..." $v }}{{ else }}{{ $v }}{{ end }}
      {{- end }}

      {{ define "hai.sentences" -}}
      {{ . | reReplaceAll `\.[ ]+` ".\n" }}
      {{- end }}

      {{ define "hai.line" -}}
      {{ $v := . | reReplaceAll `[\x00-\x20\x7f-\x{a0}\x{1680}\x{2000}-\x{200b}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]+` " " | trimSpace -}}
      {{ if gt (len $v) 200 }}{{ printf "%.197s..." $v }}{{ else }}{{ $v }}{{ end }}
      {{- end }}

      {{ define "hai.model_name" -}}
      {{ if eq . "m1" }}OLS baseline (m1){{ else if eq . "m2" }}Elastic Net (m2){{ else if eq . "m3" }}Mixed effects (m3){{ else if eq . "m4" }}Gradient boosting (m4){{ else if eq . "m5" }}Spatial (m5){{ else if eq . "m6" }}Fixed effects (m6){{ else }}{{ template "hai.safe22" . }}{{ end }}
      {{- end }}

      {{ define "hai.hai_name" -}}
      {{ if eq . "HAI_1" }}CLABSI (HAI_1){{ else if eq . "HAI_2" }}CAUTI (HAI_2){{ else if eq . "HAI_3" }}SSI colon (HAI_3){{ else if eq . "HAI_4" }}SSI hysterectomy (HAI_4){{ else if eq . "HAI_5" }}MRSA (HAI_5){{ else if eq . "HAI_6" }}C. difficile (HAI_6){{ else }}{{ template "hai.safe24" . }}{{ end }}
      {{- end }}

      {{ define "hai.time" -}}
      {{ . | tz "America/Los_Angeles" | date "3:04 PM MST, Jan 2 2006" }} [{{ . | tz "UTC" | date "15:04" }} UTC]
      {{- end }}

      {{ define "hai.model_short" -}}
      {{ if eq . "m1" }}OLS (m1){{ else if eq . "m2" }}Elastic (m2){{ else if eq . "m3" }}Mixed (m3){{ else if eq . "m4" }}Gradient (m4){{ else if eq . "m5" }}Spatial (m5){{ else if eq . "m6" }}Fixed (m6){{ else }}{{ template "hai.safe13" . }}{{ end }}
      {{- end }}

      {{ define "hai.hai_short" -}}
      {{ if eq . "HAI_1" }}CLABSI (HAI_1){{ else if eq . "HAI_2" }}CAUTI (HAI_2){{ else if eq . "HAI_3" }}SSI colon (HAI_3){{ else if eq . "HAI_4" }}SSI hyst (HAI_4){{ else if eq . "HAI_5" }}MRSA (HAI_5){{ else if eq . "HAI_6" }}C. diff (HAI_6){{ else }}{{ template "hai.safe17" . }}{{ end }}
      {{- end }}

      {{ define "hai.subject_target" -}}
      {{ $instance := or .Labels.model_set .Labels.job_type -}}
      {{ $both := and .Labels.model_set .Labels.job_type -}}
      {{ if .Labels.dag_id }} ({{ template "hai.dag" .Labels.dag_id }}{{ with .Labels.task_id }}, task {{ template "hai.mid14" . }}{{ end }})
      {{- else if and .Labels.job $instance }} ({{ template "hai.mid10" .Labels.job }}{{ if not $both }}{{ with .Labels.phase }}, {{ template "hai.mid10" . }}{{ end }}{{ end }}{{ with .Labels.model_set }}, {{ template "hai.model_short" . }}{{ end }}{{ with .Labels.job_type }}, {{ template "hai.hai_short" . }}{{ end }})
      {{- else if .Labels.job }} (job {{ template "hai.mid10" .Labels.job }}{{ with .Labels.phase }}, phase {{ template "hai.mid10" . }}{{ end }})
      {{- else if .Labels.hai_type }} ({{ template "hai.hai_name" .Labels.hai_type }})
      {{- else if .Labels.feature_set }} (set {{ template "hai.model_name" .Labels.feature_set }})
      {{- else if .Labels.source }} (source {{ template "hai.mid20" .Labels.source }})
      {{- else if .Labels.task }} (setup task {{ template "hai.mid20" .Labels.task }})
      {{- else if .Labels.service }} (service {{ template "hai.mid20" .Labels.service }})
      {{- end }}
      {{- end }}

      {{ define "hai.which" -}}
      {{ if .Labels.job }}Job {{ template "hai.line" .Labels.job }}{{ with .Labels.phase }}, phase {{ template "hai.line" . }}{{ end }}{{ with .Labels.model_set }}, model {{ template "hai.model_name" . }}{{ end }}{{ with .Labels.job_type }}, infection type {{ template "hai.hai_name" . }}{{ end }}.
      {{- else if .Labels.dag_id }}DAG {{ template "hai.line" .Labels.dag_id }}{{ with .Labels.task_id }}, task {{ template "hai.line" . }}{{ end }}.
      {{- else if .Labels.hai_type }}Infection type {{ template "hai.hai_name" .Labels.hai_type }}.
      {{- else if .Labels.feature_set }}Feature set {{ template "hai.model_name" .Labels.feature_set }}.
      {{- else if .Labels.source }}Host state source {{ template "hai.line" .Labels.source }}.
      {{- else if .Labels.task }}Setup task {{ template "hai.line" .Labels.task }}.
      {{- else if .Labels.service }}Service {{ template "hai.line" .Labels.service }}.
      {{- end }}
      {{- end }}

      {{ define "hai.alert" -}}
      {{ $resolved := eq .Status "resolved" -}}
      {{ $which := or .Labels.job .Labels.dag_id .Labels.hai_type .Labels.feature_set .Labels.source .Labels.task .Labels.service -}}
      {{ $summary := "" -}}{{ with .Annotations.summary }}{{ $summary = . }}{{ end -}}
      {{ $affects := "" -}}{{ with .Annotations.affects }}{{ $affects = . }}{{ end -}}
      {{ $next := "" -}}{{ with .Annotations.next_step }}{{ $next = . }}{{ end -}}
      {{ $dashboard := "" -}}{{ with .Annotations.dashboard }}{{ $dashboard = . }}{{ end -}}
      {{ $resolvedAffects := "The alert condition has cleared. Earlier work may still need attention." -}}{{ with .Annotations.resolved_affects }}{{ $resolvedAffects = . }}{{ end -}}
      {{ $resolvedNext := "Check the affected run and its downstream tasks." -}}{{ with .Annotations.resolved_next }}{{ $resolvedNext = . }}{{ end -}}
      {{ $details := or .Labels.alertname .Labels.severity $which -}}
      What happened:
      {{- if $resolved }}
      This alert has cleared.
      {{- with .Annotations.recovered }}
      {{ template "hai.sentences" . }}
      {{- end }}
      {{- if $summary }}
      Earlier problem: {{ $summary }}
      {{- end }}
      {{- else if $summary }}
      {{ template "hai.sentences" $summary }}
      {{- else }}
      {{ with .Labels.alertname }}{{ template "hai.line" . }} is firing.{{ else }}An alert is firing.{{ end }}
      {{- end }}

      When:
      {{- if $resolved }}
      Cleared at {{ template "hai.time" .EndsAt }}
      Began at {{ template "hai.time" .StartsAt }}
      {{- else }}
      Started at {{ template "hai.time" .StartsAt }}
      {{- end }}
      {{- if or $which $resolved $affects }}

      What it affects:
      {{- if $which }}
      {{ template "hai.which" . }}
      {{- end }}
      {{- if $resolved }}
      {{ template "hai.sentences" $resolvedAffects }}
      {{- else if $affects }}
      {{ template "hai.sentences" $affects }}
      {{- end }}
      {{- end }}
      {{- if or $resolved $next }}

      What to do next:
      {{- if $resolved }}
      {{ template "hai.sentences" $resolvedNext }}
      {{- else }}
      {{ template "hai.sentences" $next }}
      {{- end }}
      {{- end }}
      {{- if $dashboard }}

      Where to look:
      Dashboard: {{ $dashboard }} in Grafana.
      Grafana opens through a port forward. Start it with: bash scripts/open_ui.sh grafana
      Then browse to http://localhost:3001
      {{- end }}
      {{- if $details }}

      Details:
      {{- with .Labels.job }}
      Job: {{ template "hai.line" . }}
      {{- end }}
      {{- with .Labels.phase }}
      Phase: {{ template "hai.line" . }}
      {{- end }}
      {{- with .Labels.model_set }}
      Model: {{ template "hai.model_name" . }}
      {{- end }}
      {{- with .Labels.job_type }}
      Infection type: {{ template "hai.hai_name" . }}
      {{- end }}
      {{- with .Labels.hai_type }}
      Infection type: {{ template "hai.hai_name" . }}
      {{- end }}
      {{- with .Labels.feature_set }}
      Feature set: {{ template "hai.model_name" . }}
      {{- end }}
      {{- with .Labels.dag_id }}
      DAG: {{ template "hai.line" . }}
      {{- end }}
      {{- with .Labels.task_id }}
      Task: {{ template "hai.line" . }}
      {{- end }}
      {{- with .Labels.source }}
      Failed source: {{ template "hai.line" . }}
      {{- end }}
      {{- with .Labels.task }}
      Setup task: {{ template "hai.line" . }}
      {{- end }}
      {{- with .Labels.service }}
      Service: {{ template "hai.line" . }}
      {{- end }}
      {{- with .Labels.kind }}
      Check group: {{ template "hai.line" . }}
      {{- end }}
      {{- with .Labels.severity }}
      Severity: {{ template "hai.line" . }}
      {{- end }}
      {{- with .Labels.alertname }}
      Alert rule: {{ template "hai.line" . }}
      {{- end }}
      {{- end }}
      {{- end }}

      {{ define "hai.sns.subject" -}}
      {{ $firing := len .Alerts.Firing -}}
      {{ $resolved := len .Alerts.Resolved -}}
      {{ if gt $firing 0 }}FIRING{{ else }}RESOLVED{{ end }}:
      {{- with .CommonAnnotations.headline }} {{ template "hai.safe32" . }}{{ else }}{{ with .CommonLabels.alertname }} {{ template "hai.safe32" . }}{{ else }} Alert{{ end }}{{ end }}
      {{- if eq (len .Alerts) 1 }}{{ with index .Alerts 0 }}{{ template "hai.subject_target" . }}{{ end }}
      {{- else }} ({{ if $firing }}{{ $firing }} firing{{ end }}{{ if and $firing $resolved }}, {{ end }}{{ if $resolved }}{{ $resolved }} resolved{{ end }})
      {{- end }}
      {{- end }}

      {{ define "hai.sns.message" -}}
      {{ $firing := len .Alerts.Firing -}}
      {{ $resolved := len .Alerts.Resolved -}}
      {{ $shown := .Alerts -}}
      {{ if gt (len .Alerts) 10 }}{{ $shown = slice .Alerts 0 10 }}{{ end -}}
      {{ if gt (len .Alerts) 1 -}}
      {{ len .Alerts }} alerts: {{ if $firing }}{{ $firing }} firing{{ end }}{{ if and $firing $resolved }} and {{ end }}{{ if $resolved }}{{ $resolved }} resolved{{ end }}.

      {{ end -}}
      {{ range $index, $alert := $shown -}}
      {{ if $index }}

      ----------

      {{ end -}}
      {{ template "hai.alert" $alert -}}
      {{ end -}}
      {{ if gt (len .Alerts) 10 }}

      {{ len (slice .Alerts 10) }} more alerts are not shown. Open Alerting in Grafana to see them all.{{ end -}}
      {{- end }}
