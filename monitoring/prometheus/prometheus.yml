# Prometheus on the AWS host. It listens on 127.0.0.1 only, so reach it through the Session Manager tunnel. The Terraform task (infra/services/monitoring.tf)
# mounts this folder at /etc/prometheus, and the retention flags there bound the store.
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # Airflow sends StatsD over UDP to the exporter, which turns it into Prometheus metrics (monitoring/statsd/mapping.yml).
  - job_name: statsd_exporter
    static_configs:
      - targets: ["127.0.0.1:9102"]

  # The model API serves /metrics on this loopback port once it runs on the host (metrics listed in monitoring/known_metrics.json).
  - job_name: hai_api
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]

  # Host jobs push their own metrics to the Pushgateway at start, by heartbeat and at exit (scripts/metrics_push.py). honor_labels keeps the job, phase and
  # outcome labels as the job pushed them; without it Prometheus renames them to exported_job and the dashboards and rules would read nothing.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["127.0.0.1:9091"]

  # Live ECS capacity of the host and the live OpenMetadata health (monitoring/host_state_exporter.py).
  - job_name: host_state_exporter
    static_configs:
      - targets: ["127.0.0.1:9103"]
