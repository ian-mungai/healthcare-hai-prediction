# Prometheus on the AWS host. It listens on 127.0.0.1 only, so reach it through the Session Manager tunnel. The Terraform task (infra/services/monitoring.tf)
# mounts this folder at /etc/prometheus, and the retention flags there bound the store.
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # Airflow sends StatsD over UDP to the exporter, which turns it into Prometheus metrics (monitoring/statsd/mapping.yml).
  - job_name: statsd_exporter
    static_configs:
      - targets: ["127.0.0.1:9102"]

  # The model API serves /metrics on this loopback port once it runs on the host (metrics listed in monitoring/known_metrics.json).
  - job_name: hai_api
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]

  # Host jobs push their own metrics to the Pushgateway at start, by heartbeat and at exit (scripts/metrics_push.py). honor_labels keeps the job, phase and
  # outcome labels as the job pushed them; without it Prometheus renames them to exported_job and the dashboards and rules would read nothing.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["127.0.0.1:9091"]

  # Live ECS capacity of the host and the live OpenMetadata health (monitoring/host_state_exporter.py).
  - job_name: host_state_exporter
    static_configs:
      - targets: ["127.0.0.1:9103"]

  # Built-in endpoints of services that already run. Polaris and OpenMetadata answer the Prometheus text format 0.0.4 on their management and admin ports.
  - job_name: polaris
    metrics_path: /q/metrics
    scrape_protocols: [PrometheusText0.0.4, OpenMetricsText1.0.0]
    static_configs:
      - targets: ["127.0.0.1:8182"]

  - job_name: openmetadata
    metrics_path: /prometheus
    scrape_protocols: [PrometheusText0.0.4, OpenMetricsText1.0.0]
    static_configs:
      - targets: ["127.0.0.1:8586"]

  - job_name: grafana
    static_configs:
      - targets: ["127.0.0.1:3001"]

  # MLflow answers /metrics to its admin user only, so the host state exporter relays that one path with the credential from its own secret.
  - job_name: mlflow
    metrics_path: /mlflow_metrics
    static_configs:
      - targets: ["127.0.0.1:9103"]

  # The three exporters of the services without a metrics endpoint of their own, all on loopback.
  - job_name: redis_exporter
    static_configs:
      - targets: ["127.0.0.1:9121"]
    # Only database 1 (Feast hashes) and 2 (the lease and marker) hold data; the others report empty series.
    metric_relabel_configs:
      - source_labels: [__name__, db]
        regex: "redis_db_keys(_expiring)?;db(0|[3-9]|1[0-5])"
        action: drop

  - job_name: postgres_exporter
    static_configs:
      - targets: ["127.0.0.1:9187"]

  - job_name: node_exporter
    static_configs:
      - targets: ["127.0.0.1:9100"]
