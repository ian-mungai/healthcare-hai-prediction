# promtool fixtures of the service alert rules. Native promtool is the authority for what each query returns; run them as a heavy run:
#   promtool test rules monitoring/promtool/service_alerts_test.yml
# in the pinned prom/prometheus image (infra/services/images.json) with this folder mounted read only. Each test feeds input series every 30 seconds and judges the
# alerts at 60 minutes: an evaluation with exp_alerts must raise exactly that alert, one without must raise none. Missing samples are '_' and stale markers 'stale'.
rule_files:
- service_alerts.yml
evaluation_interval: 30s
tests:
- name: six_observed_5xx
  interval: 30s
  input_series:
  - series: http_server_requests_seconds_count{job="polaris",method="GET",uri="/api/catalog/v1/config",outcome="SERVER_ERROR",application="Polaris",status="500"}
    values: 10+0x110 16+0x19
  alert_rule_test:
  - eval_time: 60m
    alertname: PolarisServerErrors
    exp_alerts:
    - exp_labels:
        severity: warning
- name: three_observed_5xx
  interval: 30s
  input_series:
  - series: http_server_requests_seconds_count{job="polaris",method="GET",uri="/api/catalog/v1/config",outcome="SERVER_ERROR",application="Polaris",status="500"}
    values: 10+0x110 13+0x19
  alert_rule_test:
  - eval_time: 60m
    alertname: PolarisServerErrors
    exp_alerts:
    - exp_labels:
        severity: warning
- name: two_observed_5xx
  interval: 30s
  input_series:
  - series: http_server_requests_seconds_count{job="polaris",method="GET",uri="/api/catalog/v1/config",outcome="SERVER_ERROR",application="Polaris",status="500"}
    values: 10+0x110 12+0x19
  alert_rule_test:
  - eval_time: 60m
    alertname: PolarisServerErrors
- name: rising_4xx_counter
  interval: 30s
  input_series:
  - series: http_server_requests_seconds_count{job="polaris",method="GET",uri="/api/catalog/v1/config",outcome="SERVER_ERROR",application="Polaris",status="404"}
    values: 10+0x110 110+0x19
  alert_rule_test:
  - eval_time: 60m
    alertname: PolarisServerErrors
- name: 5xx_of_another_job
  interval: 30s
  input_series:
  - series: http_server_requests_seconds_count{job="other",method="GET",uri="/api/catalog/v1/config",outcome="SERVER_ERROR",application="Polaris",status="500"}
    values: 10+0x110 40+0x19
  alert_rule_test:
  - eval_time: 60m
    alertname: PolarisServerErrors
- name: no_5xx_series
  interval: 30s
  input_series:
  - series: up{job="polaris"}
    values: 1+0x130
  alert_rule_test:
  - eval_time: 60m
    alertname: PolarisServerErrors
- name: mlflow_six_observed_5xx
  interval: 30s
  input_series:
  - series: mlflow_http_request_total{job="mlflow",method="POST",status="500"}
    values: 10+0x110 16+0x19
  alert_rule_test:
  - eval_time: 60m
    alertname: MlflowServerErrors
    exp_alerts:
    - exp_labels:
        severity: warning
- name: mlflow_two_observed_5xx
  interval: 30s
  input_series:
  - series: mlflow_http_request_total{job="mlflow",method="POST",status="500"}
    values: 10+0x110 12+0x19
  alert_rule_test:
  - eval_time: 60m
    alertname: MlflowServerErrors
- name: mlflow_rising_4xx_counter
  interval: 30s
  input_series:
  - series: mlflow_http_request_total{job="mlflow",method="POST",status="404"}
    values: 10+0x110 110+0x19
  alert_rule_test:
  - eval_time: 60m
    alertname: MlflowServerErrors
- name: mlflow_no_5xx_series
  interval: 30s
  input_series:
  - series: up{job="mlflow"}
    values: 1+0x130
  alert_rule_test:
  - eval_time: 60m
    alertname: MlflowServerErrors
