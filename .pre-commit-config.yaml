# Pre-commit checks for this repository; docs/quality_checks.md lists what each one enforces.
# Every hook is local and pinned: pre-commit, Ruff and MyPy come from requirements.txt in .venv, gitleaks and TFLint
# from scripts/quality/install_tools.py in .tools. Install once with `.venv/bin/pre-commit install`: default_install_hook_types covers all three hook types.
# Then run `.venv/bin/python -m scripts.quality.pre_push install-shim` once: the pre-push run is a Git config hook (Git 2.54 or newer) that Git starts for
# every push with the whole push input, whatever reference pre-commit hands its own hooks. The local_ci_pushed hook below only refuses a push without it.
# Stages: the commit stage holds only fast checks (a typical commit takes about two minutes); every hook marked `stages: [manual]` below is what the hosted
# hooks job runs (scripts/quality/ci_hooks.py) and is covered before a push by the pre-push run (scripts/quality/pre_push.py), which also runs the check groups
# of the pushed range. `pre-commit run --all-files --hook-stage manual` runs the whole manual set on demand.
# There are no other bypasses: do not use SKIP= or git commit --no-verify. The pre-push run clears SKIP and the other pre-commit variables that change which hooks run.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit, manual]
fail_fast: false

repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: Scan staged changes for secrets
        entry: .venv/bin/python -m scripts.quality.scan_secrets --staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: gitleaks-outgoing
        # The full set has nothing staged, so it scans every outgoing source file instead.
        name: Scan all outgoing source files for secrets
        entry: .venv/bin/python -m scripts.quality.scan_secrets
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: credential-files
        name: Credential, state and saved-plan files
        entry: .venv/bin/python -m scripts.quality.repo_checks credential-files
        language: system
      - id: data-files
        name: Data files and files over 5 MB
        entry: .venv/bin/python -m scripts.quality.repo_checks data-files
        language: system
      - id: env-example
        name: Environment variables listed in .env.example
        entry: .venv/bin/python -m scripts.quality.repo_checks env-example
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: removed-names
        name: Removed names gone from code, config and docs
        entry: .venv/bin/python -m scripts.quality.repo_checks removed-names
        language: system
        pass_filenames: false
        always_run: true
      # Cleanup checks: they block; exceptions go in .cleanup_allowlist or scripts/quality/vulture_whitelist.py.
      - id: unused-code
        name: No unused functions, classes or variables (vulture)
        entry: .venv/bin/python -m scripts.quality.repo_checks unused-code
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: unused-dependencies
        name: Dependencies declared and used per runtime (deptry)
        entry: .venv/bin/python -m scripts.quality.repo_checks unused-dependencies
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: orphan-files
        name: Every file referenced by another
        entry: .venv/bin/python -m scripts.quality.repo_checks orphan-files
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: terraform-unused
        name: No unused Terraform declarations (tflint)
        entry: .venv/bin/python -m scripts.quality.repo_checks terraform-unused
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: privacy-scan
        name: No personal data or environment-specific values in project files
        entry: .venv/bin/python -m scripts.quality.repo_checks privacy-scan --all
        language: system
        pass_filenames: false
        always_run: true
      - id: writing-check
        name: Prose follows the writing preferences
        entry: .venv/bin/python -m scripts.quality.repo_checks writing-check --block dash --block slash
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
      - id: front-matter
        name: Documents carry valid front matter (title, description, last_updated)
        entry: .venv/bin/python -m scripts.quality.repo_checks front-matter
        language: system
        pass_filenames: false
        always_run: true
      - id: markdownlint
        # Pinned markdownlint-cli2 from scripts/quality/install_markdownlint.py with the documentation baseline in
        # .markdownlint-cli2.jsonc; E2E records under data/ are skipped. Blocking from the start: the whole project was clean.
        name: Markdown syntax follows the documentation baseline (markdownlint)
        entry: .tools/markdownlint-cli2/node_modules/.bin/markdownlint-cli2 --config .markdownlint-cli2.jsonc
        language: system
        types: [markdown]
        exclude: ^data/
      - id: sqlfluff
        # Pinned SQLFluff with the dbt templater from scripts/quality/install_sqlfluff.py, in its own environment.
        name: Active SQL follows its runtime dialect and templater (SQLFluff)
        entry: .venv/bin/python -m scripts.quality.lint_sources sql
        language: system
        pass_filenames: false
        files: (\.sql$|^\.sqlfluff$|^scripts/quality/(lint_sources\.py$|sqlfluff/))
        stages: [manual]
      - id: ruff
        name: Every nonignored Python source passes Ruff and formatting
        entry: .venv/bin/python -m scripts.quality.lint_sources ruff
        language: system
        pass_filenames: false
        always_run: true
      - id: shell-syntax
        name: Every nonignored shell source passes declared-interpreter syntax
        entry: .venv/bin/python -m scripts.quality.lint_sources shell-syntax
        language: system
        pass_filenames: false
        always_run: true
      - id: shellcheck
        name: Tracked shell sources pass ShellCheck
        entry: .venv/bin/python -m scripts.quality.lint_sources shellcheck
        language: system
        pass_filenames: false
        always_run: true
      - id: actionlint
        name: Workflows and referenced local action metadata pass actionlint
        entry: .venv/bin/python -m scripts.quality.lint_sources actionlint
        language: system
        pass_filenames: false
        always_run: true
      - id: yamllint
        name: Tracked YAML passes the project profile with no duplicate keys
        entry: .venv/bin/python -m scripts.quality.lint_sources yamllint
        language: system
        pass_filenames: false
        always_run: true
      - id: hadolint
        name: Every tracked Dockerfile passes Hadolint
        entry: .venv/bin/python -m scripts.quality.lint_sources hadolint
        language: system
        pass_filenames: false
        always_run: true
      - id: build-contexts
        name: Dockerfile COPY references resolve to earlier stages or declared build contexts
        entry: .venv/bin/python -m scripts.quality.lint_sources build-contexts
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: container-mounts
        name: First-party container imports fit their declared mounts
        entry: .venv/bin/python -m scripts.quality.container_mounts
        language: system
        pass_filenames: false
        always_run: true
      - id: gofmt
        name: Tracked Go sources match gofmt
        entry: .venv/bin/python -m scripts.quality.lint_sources gofmt
        language: system
        pass_filenames: false
        always_run: true
      - id: go-vet
        name: Tracked Go programs pass go vet
        entry: .venv/bin/python -m scripts.quality.lint_sources go-vet
        language: system
        pass_filenames: false
        always_run: true
      - id: tflint
        # Terraform recommended preset plus the pinned AWS ruleset (.tflint.hcl); the plugin is installed with `tflint --init`, by the setup action on the hosted runner.
        # Exceptions: .linter_allowlist.
        name: Terraform follows the TFLint recommended and AWS rules
        entry: .venv/bin/python -m scripts.quality.lint_tools tflint
        language: system
        pass_filenames: false
        files: ^(infra/.*\.(tf|hcl)|\.tflint\.hcl|\.linter_allowlist|config/quality_tools\.json)$
        stages: [pre-commit, manual]
      - id: trivy-config
        # The pinned release trivy in .tools/bin (the one trivy of the project), embedded checks only (no network); *.tfvars, *.tfvars.json and terraform.tfstate* are skipped by name and never read.
        name: Terraform has no trivy config misconfigurations
        entry: .venv/bin/python -m scripts.quality.lint_tools trivy-config
        language: system
        pass_filenames: false
        files: ^(infra/.*\.tf|\.linter_allowlist|config/quality_tools\.json)$
        stages: [pre-commit, manual]
      - id: osv-scanner
        # Queries osv.dev, so it needs the network and runs at the pre-push stage (pre-commit run osv-scanner --hook-stage pre-push --all-files) and in the hosted manual stage.
        name: Pinned requirements have no unreviewed known vulnerabilities (OSV-Scanner)
        entry: .venv/bin/python -m scripts.quality.lint_tools osv-scanner
        language: system
        pass_filenames: false
        files: ^(.*requirements[^/]*\.txt|services/orchestration/constraints-3\.12\.txt|\.linter_allowlist|config/quality_tools\.json)$
        stages: [pre-push, manual]
      - id: zizmor
        # Offline audits only (the online ones need a GitHub token).
        name: Workflows pass the zizmor security audits
        entry: .venv/bin/python -m scripts.quality.lint_tools zizmor
        language: system
        pass_filenames: false
        files: ^(\.github/workflows/.*\.ya?ml|\.linter_allowlist|config/quality_tools\.json)$
        stages: [pre-commit, manual]
      - id: import-linter
        # Contracts in .importlinter state the package boundaries that hold today; import-linter is installed by scripts/quality/install_lint_tools.py.
        name: First-party packages keep their import boundaries (import-linter)
        entry: .venv/bin/python -m scripts.quality.lint_tools import-linter
        language: system
        pass_filenames: false
        files: ^(.*\.py|\.importlinter|config/quality_tools\.json)$
        stages: [pre-commit, manual]
      - id: typos
        # The pinned typos with _typos.toml.
        name: Text and source files have no common misspellings (typos)
        entry: .venv/bin/python -m scripts.quality.lint_tools typos
        language: system
        types: [text]
        stages: [pre-commit, manual]
      - id: check-jsonschema
        # Workflows and actions against the bundled GitHub schemas, every *.schema.json against its metaschema and the contracts mapped in config/quality/json_schemas.json;
        # check-jsonschema is installed by scripts/quality/install_lint_tools.py.
        name: Workflows and JSON contracts satisfy their schemas (check-jsonschema)
        entry: .venv/bin/python -m scripts.quality.lint_tools check-jsonschema
        language: system
        pass_filenames: false
        files: ^(\.github/(workflows|actions)/.*\.ya?ml|.*\.schema\.json|config/quality/json_schemas\.json|config/(orchestration|training|acquisition)/.*\.json|data_contracts/(training|orchestration)/.*\.json)$
        stages: [pre-commit, manual]
      - id: model-metadata
        name: dbt sources and models carry classes, gold facts carry fact types and measures carry additivity
        entry: .venv/bin/python -m scripts.quality.model_metadata
        language: system
        pass_filenames: false
        files: ^(dbt/.*\.(ya?ml|sql)|data_contracts/lakehouse/gold_contract\.json|config/lakehouse/bronze_tables\.json|scripts/(process\.py|quality/(model_metadata\.py|install_sqlfluff\.py|sqlfluff/requirements\.txt)))$
        stages: [manual]
      - id: documentation-review
        name: All documentation reviewed for the staged revision
        entry: .venv/bin/python -m scripts.quality.documentation_review check
        language: system
        pass_filenames: false
        always_run: true
        # The review record is local, so the full set runs documentation-review-untracked instead (a stage split, not a bypass).
        stages: [pre-commit]
      - id: documentation-review-untracked
        name: Documentation review record stays local and untracked
        entry: .venv/bin/python -m scripts.quality.documentation_review check-untracked
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: lint-settings
        name: Lint and type settings never loosened
        entry: .venv/bin/python -m scripts.quality.repo_checks lint-settings
        language: system
        pass_filenames: false
        always_run: true
      - id: suppressions
        name: Suppressions only from the approved list
        entry: .venv/bin/python -m scripts.quality.repo_checks suppressions
        language: system
        types: [python]
      - id: subprocess-imports
        name: Programs start only through the launcher
        entry: .venv/bin/python -m scripts.quality.repo_checks subprocess-imports
        language: system
        types: [python]
      - id: docker-calls
        name: Docker is called only by the launcher
        entry: .venv/bin/python -m scripts.quality.docker_calls
        language: system
        types_or: [python, shell]
      - id: test-checks
        name: Each check blocks its bad sample and passes its good one
        entry: .venv/bin/python -m scripts.quality.run_checks_e2e
        language: system
        pass_filenames: false
        files: ^(scripts/(process|quality/(repo_checks|run_checks_e2e|run_lint_coverage_e2e|lint_sources|scan_secrets|install_tools|install_markdownlint|install_sqlfluff|install_dvc))\.py|scripts/quality/(markdownlint|sqlfluff|dvc)/.*|config/quality_tools\.json|\.yamllint|\.sqlfluff|\.pre-commit-config\.yaml|\.(privacy|writing)_allowlist|\.markdownlint-cli2\.jsonc)$
        stages: [manual]
      - id: test-documentation-review
        name: Documentation review accepts good evidence and rejects bad evidence
        entry: .venv/bin/python -m scripts.quality.run_documentation_review_e2e
        language: system
        pass_filenames: false
        files: ^(scripts/(process|quality/(documentation_review|run_documentation_review_e2e|run_checks_e2e))\.py|\.pre-commit-config\.yaml)$
        stages: [manual]
      - id: local_ci_pushed
        name: Refuse a push when the Git config hook that runs the pre-push gate is missing
        entry: .venv/bin/python -m scripts.quality.pre_push check-shim
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: acquisition-checks
        # 12-14 minutes, so the pre-push run starts it only when the pushed range changes acquisition code, configuration or their dependencies (this files pattern); the native hook of a push skips
        # GitHub CI runs it in its own job, so it stays out of the full set; that job reads this files pattern through
        # scripts/acquisition/run_checks_ci.sh, so it runs for the same paths, plus the CI workflow that runs it. Run it directly
        # before a release: bash scripts/acquisition/run_checks.sh
        name: Acquisition lint, types, registry and offline E2E suites with the 90% coverage gate
        entry: bash scripts/acquisition/run_checks_pushed.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(scripts/acquisition/|config/acquisition/|config/lakehouse/bronze_tables\.json$|tests/test_source_registry\.py$|tests/fixtures/registry_additions_bronze_lineage\.csv$|scripts/process\.py$|scripts/quality/typecheck\.py$|scripts/quality/timing\.sh$|config/quality/mypy_runtimes\.json$|scripts/infrastructure/render_project_config\.py$|requirements\.txt$|\.github/workflows/ci\.yml$)
      - id: local_ci
        name: Run the full local CI
        entry: bash scripts/run_ci.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: commit-msg
        name: Conventional Commits and no AI attribution
        entry: .venv/bin/python -m scripts.quality.repo_checks commit-msg
        language: system
        stages: [commit-msg]
