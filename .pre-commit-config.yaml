# Pre-commit checks for this repository; scripts/quality/repo_checks.py and the hook entries below hold what each one enforces.
# Every hook is local and pinned: pre-commit, Ruff and MyPy come from the host group of uv.lock in .venv, gitleaks, TFLint and uv
# from scripts/quality/install_tools.py in .tools. Install once with `.venv/bin/pre-commit install`: default_install_hook_types covers all three hook types.
# Then run `.venv/bin/python -m scripts.quality.pre_push install-shim` once: the pre-push run is a Git config hook (Git 2.54 or newer) that Git starts for
# every push with the whole push input, whatever reference pre-commit hands its own hooks. The local_ci_pushed hook below only refuses a push without it.
# Stages: the commit stage holds the fast checks and the path checks. A path check (the cleanup checks, the outgoing secret scan, dependency lock, SQLFluff,
# model metadata and the review-record check) also has the manual stage and runs at commit only when a staged file is one it reads (`files`, `exclude`, `types`),
# over its whole scope; with no `files` it reads every file, so any staged file selects it. Two limits follow from what Git hands pre-commit. A commit that
# only deletes files hands it nothing, so a path check skips it. A path check reads the working tree, so a staged deletion that leaves the file on disk
# (git rm --cached) beside a matching edit still lets build-contexts or terraform-unused read the leftover file. The hosted run checks out the committed
# tree and catches both. A commit that stages one Python file takes about three minutes on this Mac: about a minute of it is
# orphan-files, about twenty seconds the other path checks that read Python; a Terraform, Dockerfile or SQL change adds that check's time (SQLFluff about
# five minutes, model-metadata about two). Only test-checks, test-lock and test-documentation-review stay manual-only. The hosted hooks job runs every hook
# with the manual stage except model-metadata (scripts/quality/ci_hooks.py, in full with --all-files on every pushed commit, so a path hook runs there
# whatever the commit changed); the Gold group runs model-metadata (hooks_run_by_groups in config/quality/ci_groups.json). The pre-push run
# (scripts/quality/pre_push.py) runs the changed-file checks, the commit
# messages, the removed names, the secret and privacy scans and the osv-scanner hook over the pushed range, in about two minutes.
# `pre-commit run --all-files --hook-stage manual` runs the whole manual set on demand.
# There are no other bypasses: do not use SKIP= or git commit --no-verify. The pre-push run clears SKIP and the other pre-commit variables that change which hooks run.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit, manual]
fail_fast: false

repos:
  - repo: local
    hooks:
      - id: check-head
        # The bundle's head check (git_and_ci commit.md): a named branch other than main, no operation in progress, current origin/main contained. It fetches main, so it needs the network.
        name: The head is a current named branch
        entry: .venv/bin/python -m scripts.quality.check_head
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
      - id: check-tools
        # The bundle's pinned-tools check: the worktree links point at the main checkout, every pinned tool executable is in place, the requirements copies each lock-installed tool's installer saved (SQLFluff, DVC, import-linter, check-jsonschema) equal its group of uv.lock now, the dbt package archive is in place and the push gate is installed.
        name: The worktree has its pinned tools, archive and push gate
        entry: .venv/bin/python -m scripts.quality.check_tools
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
      - id: gitleaks
        name: Scan staged changes for secrets
        entry: .venv/bin/python -m scripts.quality.scan_secrets --staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: gitleaks-outgoing
        # Scans every file Git does not ignore (tracked or not), so any staged file selects it; the staged scan above covers only the staged diff.
        name: Scan all outgoing source files for secrets
        entry: .venv/bin/python -m scripts.quality.scan_secrets
        language: system
        pass_filenames: false
        # A symlink is refused by the scan, so a staged one selects the hook too (pre-commit's default types skip a symlink).
        types: []
        types_or: [file, symlink]
        stages: [pre-commit, manual]
      - id: credential-files
        name: Credential, state and saved-plan files
        entry: .venv/bin/python -m scripts.quality.repo_checks credential-files
        language: system
      - id: data-files
        name: Data files and files over 5 MB
        entry: .venv/bin/python -m scripts.quality.repo_checks data-files
        language: system
      - id: env-example
        # Reads .env.example, config/quality/env_names.json, every Python file for reads and every other tracked file for uses and setters. Markdown only mentions a
        # name and the cleanup allowlist is not read, so neither selects the hook.
        name: Environment variables listed in .env.example
        entry: .venv/bin/python -m scripts.quality.repo_checks env-example
        language: system
        pass_filenames: false
        exclude: (\.md$|^\.cleanup_allowlist$)
        types: []
        types_or: [file, symlink]
        stages: [pre-commit, manual]
      - id: removed-names
        name: Removed names gone from code, config and docs
        entry: .venv/bin/python -m scripts.quality.repo_checks removed-names
        language: system
        pass_filenames: false
        always_run: true
      - id: task-ids
        name: A task ID beside a shipped DAG names a task the DAG has
        entry: .venv/bin/python -m scripts.quality.repo_checks task-ids
        language: system
        pass_filenames: false
        always_run: true
      - id: command-modules
        name: A python -m command of this repository names a module that exists
        entry: .venv/bin/python -m scripts.quality.repo_checks command-modules
        language: system
        pass_filenames: false
        always_run: true
      - id: typecheck-importers
        name: MyPy on the changed Python files and the files that import them
        entry: .venv/bin/python -m scripts.quality.typecheck_importers
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: temporary-code
        # The list of temporary files is config/quality/temporary_code.json; temporary code may import permanent code, never the reverse.
        name: Permanent code never imports, calls or reads temporary code
        entry: .venv/bin/python -m scripts.quality.repo_checks temporary-code
        language: system
        pass_filenames: false
        always_run: true
      # Cleanup checks: they block; exceptions go in .cleanup_allowlist or scripts/quality/vulture_whitelist.py.
      - id: unused-code
        name: No unused functions, classes or variables (vulture)
        entry: .venv/bin/python -m scripts.quality.repo_checks unused-code
        language: system
        pass_filenames: false
        # Vulture reads every tracked Python file but e2e/ (its whitelist is one), the allowlist and the pinned vulture of the lock.
        files: ^(.*\.py|\.cleanup_allowlist|pyproject\.toml|uv\.lock)$
        exclude: ^e2e/
        stages: [pre-commit, manual]
      - id: unused-dependencies
        name: Dependencies declared and used per runtime (deptry)
        entry: .venv/bin/python -m scripts.quality.repo_checks unused-dependencies
        language: system
        pass_filenames: false
        # Deptry reads every tracked Python file but e2e/ and data/, the runtime map, the allowlist, and the groups of pyproject.toml and the lock.
        files: ^(.*\.py|\.cleanup_allowlist|pyproject\.toml|uv\.lock|config/quality_tools\.json|config/quality/dependency_runtimes\.json)$
        exclude: ^(e2e|data)/
        stages: [pre-commit, manual]
      - id: dependency-lock
        # pyproject.toml declares every dependency in one group per image or tool; uv.lock pins every group with hashes. The check needs no network.
        name: The dependency lock matches pyproject.toml and its own rules (uv)
        entry: .venv/bin/python -m scripts.quality.lock_env check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|uv\.toml|scripts/quality/lock_env\.py|config/quality_tools\.json)$
        stages: [pre-commit, manual]
      - id: orphan-files
        # A file is an orphan when no other tracked file names it, so any staged file (a new one, or an edit that drops a reference) selects the hook.
        name: Every file referenced by another
        entry: .venv/bin/python -m scripts.quality.repo_checks orphan-files
        language: system
        pass_filenames: false
        types: []
        types_or: [file, symlink]
        stages: [pre-commit, manual]
      - id: terraform-unused
        # tflint reads the tracked Terraform files of every folder and its pinned version; the allowlist holds the exceptions.
        name: No unused Terraform declarations (tflint)
        entry: .venv/bin/python -m scripts.quality.repo_checks terraform-unused
        language: system
        pass_filenames: false
        files: (\.tf(\.json)?$|(^|/)\.tflint\.hcl$|^\.cleanup_allowlist$|^config/quality_tools\.json$|^scripts/quality/repo_checks\.py$)
        stages: [pre-commit, manual]
      - id: privacy-scan
        name: No personal data or environment-specific values in project files
        entry: .venv/bin/python -m scripts.quality.repo_checks privacy-scan --all
        language: system
        pass_filenames: false
        always_run: true
      - id: writing-check
        name: Prose follows the writing preferences
        entry: .venv/bin/python -m scripts.quality.repo_checks writing-check --block dash --block semicolon --block slash
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
      - id: docs-references
        name: Tracked files name only tracked docs/ paths
        entry: .venv/bin/python -m scripts.quality.repo_checks docs-references
        language: system
        pass_filenames: false
        always_run: true
      - id: front-matter
        name: Documents carry valid front matter (title, description, last_updated)
        entry: .venv/bin/python -m scripts.quality.repo_checks front-matter
        language: system
        pass_filenames: false
        always_run: true
      - id: markdown-links
        name: Markdown links point at tracked files and existing headings
        entry: .venv/bin/python -m scripts.quality.repo_checks markdown-links
        language: system
        pass_filenames: false
        always_run: true
      - id: markdownlint
        # Pinned markdownlint-cli2 from scripts/quality/install_markdownlint.py with the documentation baseline in
        # .markdownlint-cli2.jsonc; E2E records under data/ are skipped. Blocking from the start: the whole project was clean.
        name: Markdown syntax follows the documentation baseline (markdownlint)
        entry: .tools/markdownlint-cli2/node_modules/.bin/markdownlint-cli2 --config .markdownlint-cli2.jsonc
        language: system
        types: [markdown]
        exclude: ^data/
      - id: sqlfluff
        # Pinned SQLFluff with the dbt templater from scripts/quality/install_sqlfluff.py, in its own environment.
        name: Active SQL follows its runtime dialect and templater (SQLFluff)
        entry: .venv/bin/python -m scripts.quality.lint_sources sql
        language: system
        pass_filenames: false
        # It lints every tracked SQL file through the dbt project (models, macros, schema files, packages and the lint profile: all of dbt/ but the seed data,
        # which a template never reads) with the .sqlfluff settings (the root file, any nested one and an ignore file) of the pinned install.
        files: (\.sql$|(^|/)\.sqlfluff(ignore)?$|^dbt/|^uv\.lock$|^scripts/quality/(lint_sources|install_sqlfluff)\.py$)
        exclude: ^dbt/seeds/.*\.csv$
        stages: [pre-commit, manual]
      - id: ruff
        name: Every nonignored Python source passes Ruff and formatting
        entry: .venv/bin/python -m scripts.quality.lint_sources ruff
        language: system
        pass_filenames: false
        always_run: true
      - id: shell-syntax
        name: Every nonignored shell source passes declared-interpreter syntax
        entry: .venv/bin/python -m scripts.quality.lint_sources shell-syntax
        language: system
        pass_filenames: false
        always_run: true
      - id: shellcheck
        name: Tracked shell sources pass ShellCheck
        entry: .venv/bin/python -m scripts.quality.lint_sources shellcheck
        language: system
        pass_filenames: false
        always_run: true
      - id: actionlint
        name: Workflows and referenced local action metadata pass actionlint
        entry: .venv/bin/python -m scripts.quality.lint_sources actionlint
        language: system
        pass_filenames: false
        always_run: true
      - id: yamllint
        name: Tracked YAML passes the project profile with no duplicate keys
        entry: .venv/bin/python -m scripts.quality.lint_sources yamllint
        language: system
        pass_filenames: false
        always_run: true
      - id: hadolint
        name: Every tracked Dockerfile passes Hadolint and the image folder mode rule
        entry: .venv/bin/python -m scripts.quality.lint_sources hadolint
        language: system
        pass_filenames: false
        always_run: true
      - id: build-contexts
        name: Dockerfile COPY references resolve to earlier stages or declared build contexts
        entry: .venv/bin/python -m scripts.quality.lint_sources build-contexts
        language: system
        pass_filenames: false
        # It reads every tracked Dockerfile, the root Compose file and the image list of infra/services.
        files: (^|/)Dockerfile(\..*)?$|^docker-compose\.yaml$|^infra/services/images\.json$|^scripts/quality/lint_sources\.py$
        stages: [pre-commit, manual]
      - id: container-mounts
        name: First-party container imports fit their declared mounts
        entry: .venv/bin/python -m scripts.quality.container_mounts
        language: system
        pass_filenames: false
        always_run: true
      - id: gofmt
        name: Tracked Go sources match gofmt
        entry: .venv/bin/python -m scripts.quality.lint_sources gofmt
        language: system
        pass_filenames: false
        always_run: true
      - id: go-vet
        name: Tracked Go programs pass go vet
        entry: .venv/bin/python -m scripts.quality.lint_sources go-vet
        language: system
        pass_filenames: false
        always_run: true
      - id: tflint
        # Terraform recommended preset plus the pinned AWS ruleset (.tflint.hcl); the plugin is installed with `tflint --init`, by the install step of the lint tools in .github/workflows/ci.yml on the hosted runner.
        # Exceptions: .linter_allowlist.
        name: Terraform follows the TFLint recommended and AWS rules
        entry: .venv/bin/python -m scripts.quality.lint_tools tflint
        language: system
        pass_filenames: false
        files: ^(infra/.*\.(tf|hcl)|\.tflint\.hcl|\.linter_allowlist|config/quality_tools\.json)$
        stages: [pre-commit, manual]
      - id: trivy-config
        # The pinned release trivy in .tools/bin (the one trivy of the project), embedded checks only (no network); *.tfvars, *.tfvars.json and terraform.tfstate* are skipped by name and never read.
        name: Terraform has no trivy config misconfigurations
        entry: .venv/bin/python -m scripts.quality.lint_tools trivy-config
        language: system
        pass_filenames: false
        files: ^(infra/.*\.tf|\.linter_allowlist|config/quality_tools\.json)$
        stages: [pre-commit, manual]
      - id: osv-scanner
        # Queries osv.dev, so it needs the network and runs at the pre-push stage (pre-commit run osv-scanner --hook-stage pre-push --all-files) and in the hosted manual stage.
        name: The dependency lock has no unreviewed known vulnerabilities (OSV-Scanner)
        entry: .venv/bin/python -m scripts.quality.lint_tools osv-scanner
        language: system
        pass_filenames: false
        files: ^(uv\.lock|.*requirements[^/]*\.txt|\.linter_allowlist|config/quality_tools\.json)$
        stages: [pre-push, manual]
      - id: zizmor
        # Offline audits only (the online ones need a GitHub token).
        name: Workflows pass the zizmor security audits
        entry: .venv/bin/python -m scripts.quality.lint_tools zizmor
        language: system
        pass_filenames: false
        files: ^(\.github/workflows/.*\.ya?ml|\.linter_allowlist|config/quality_tools\.json)$
        stages: [pre-commit, manual]
      - id: import-linter
        # Contracts in .importlinter state the package boundaries that hold today; import-linter is installed by scripts/quality/install_lint_tools.py.
        name: First-party packages keep their import boundaries (import-linter)
        entry: .venv/bin/python -m scripts.quality.lint_tools import-linter
        language: system
        pass_filenames: false
        files: ^(.*\.py|\.importlinter|config/quality_tools\.json)$
        stages: [pre-commit, manual]
      - id: typos
        # The pinned typos with _typos.toml.
        name: Text and source files have no common misspellings (typos)
        entry: .venv/bin/python -m scripts.quality.lint_tools typos
        language: system
        types: [text]
        stages: [pre-commit, manual]
      - id: check-jsonschema
        # Workflows against the bundled GitHub schema, every *.schema.json against its metaschema and the contracts mapped in config/quality/json_schemas.json;
        # check-jsonschema is installed by scripts/quality/install_lint_tools.py.
        name: Workflows and JSON contracts satisfy their schemas (check-jsonschema)
        entry: .venv/bin/python -m scripts.quality.lint_tools check-jsonschema
        language: system
        pass_filenames: false
        files: ^(\.github/(workflows|actions)/.*\.ya?ml|.*\.schema\.json|config/quality/json_schemas\.json|config/(orchestration|training|acquisition)/.*\.json|data_contracts/(training|orchestration)/.*\.json)$
        stages: [pre-commit, manual]
      - id: model-metadata
        name: dbt sources and models carry classes, gold facts carry fact types and measures carry additivity
        entry: .venv/bin/python -m scripts.quality.model_metadata
        language: system
        pass_filenames: false
        # It reads all of dbt/ (YAML, SQL, macros, seed names, project file), the gold contract, the two silver contracts that the deferral record is checked
        # against and the bronze table map.
        files: ^(dbt/.*|data_contracts/lakehouse/(gold_contract|silver_publish|silver_columns)\.json|config/lakehouse/bronze_tables\.json|scripts/(process\.py|quality/(model_metadata\.py|install_sqlfluff\.py|lock_env\.py))|uv\.lock|pyproject\.toml)$
        stages: [pre-commit, manual]
      - id: documentation-review
        name: All documentation reviewed for the staged revision
        entry: .venv/bin/python -m scripts.quality.documentation_review check
        language: system
        pass_filenames: false
        always_run: true
        # The review record is local, so the hosted run checks documentation-review-untracked instead (a stage split, not a bypass).
        stages: [pre-commit]
      - id: documentation-review-untracked
        name: Documentation review record stays local and untracked
        entry: .venv/bin/python -m scripts.quality.documentation_review check-untracked
        language: system
        pass_filenames: false
        # It reads whether the index holds the record and whether a .gitignore ignores it.
        files: (^|/)\.gitignore$|^\.documentation_review\.json$|^scripts/quality/documentation_review\.py$
        stages: [pre-commit, manual]
      - id: lint-settings
        name: Lint and type settings never loosened
        entry: .venv/bin/python -m scripts.quality.repo_checks lint-settings
        language: system
        pass_filenames: false
        always_run: true
      - id: suppressions
        name: Suppressions only from the approved list
        entry: .venv/bin/python -m scripts.quality.repo_checks suppressions
        language: system
        types: [python]
      - id: subprocess-imports
        name: Programs start only through the launcher
        entry: .venv/bin/python -m scripts.quality.repo_checks subprocess-imports
        language: system
        types: [python]
      - id: docker-calls
        name: Docker is called only by the launcher
        entry: .venv/bin/python -m scripts.quality.docker_calls
        language: system
        types_or: [python, shell]
      - id: test-checks
        name: Each check blocks its bad sample and passes its good one
        entry: .venv/bin/python -m scripts.quality.run_checks_e2e
        language: system
        pass_filenames: false
        files: ^(scripts/(process|quality/(repo_checks|markdown_links|run_checks_e2e|run_lint_coverage_e2e|lint_sources|scan_secrets|install_tools|install_markdownlint|install_sqlfluff|install_dvc|lock_env|run_worktree_checks_e2e|check_head|check_tools|case_shards))\.py|scripts/quality/markdownlint/.*|config/quality_tools\.json|config/quality/shard_costs\.json|\.yamllint|\.sqlfluff|\.pre-commit-config\.yaml|\.(privacy|writing)_allowlist|\.markdownlint-cli2\.jsonc)$
        stages: [manual]
      - id: test-lock
        name: The lock exports are pinned with hashes and its checks block their planted defects
        entry: .venv/bin/python -m scripts.quality.run_lock_e2e
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|scripts/quality/(lock_env|run_lock_e2e)\.py|config/quality_tools\.json)$
        stages: [manual]
      - id: test-documentation-review
        name: Documentation review accepts good evidence and rejects bad evidence
        entry: .venv/bin/python -m scripts.quality.run_documentation_review_e2e
        language: system
        pass_filenames: false
        files: ^(scripts/(process|quality/(documentation_review|run_documentation_review_e2e|run_checks_e2e))\.py|\.pre-commit-config\.yaml)$
        stages: [manual]
      - id: local_ci_pushed
        name: Refuse a push when the Git config hook that runs the pre-push gate is missing
        entry: .venv/bin/python -m scripts.quality.pre_push check-shim
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: commit-msg
        name: Conventional Commits and no AI attribution
        entry: .venv/bin/python -m scripts.quality.repo_checks commit-msg
        language: system
        stages: [commit-msg]
