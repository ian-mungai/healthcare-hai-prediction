[run]
# Count collector command lines that end-to-end suites run as child processes.
patch = subprocess
omit =
    */scripts/acquisition/tests/*
    */scripts/acquisition/run_e2e.py
    */scripts/acquisition/run_registry_additions_e2e.py
    # The changed copy of the registry validator that the boundary probe loads from a temporary folder.
    */registry_additions_probe.py
    */scripts/acquisition/verify_e2e_artifact.py
    # One-off tools that already ran; their run records are the evidence.
    */scripts/acquisition/one_off/*
    # Copies of the code that a test unpacks under a pytest folder and runs as a child process. A path cannot show that a copy holds the tree's source, so a copy
    # is neither merged into the tree's file nor counted beside it.
    */pytest-of-*/**/scripts/acquisition/*

[report]
# The same copies are left out when data recorded before this setting, or merged from shards, is reported.
omit =
    */pytest-of-*/**/scripts/acquisition/*
show_missing = True
fail_under = 90
