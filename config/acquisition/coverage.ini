[run]
# Count collector command lines that end-to-end suites run as child processes.
patch = subprocess
omit =
    */scripts/acquisition/tests/*
    */scripts/acquisition/run_e2e.py
    */scripts/acquisition/run_registry_additions_e2e.py
    */scripts/acquisition/verify_e2e_artifact.py
    # One-off tools that already ran; their run records are the evidence.
    */scripts/acquisition/one_off/*

[report]
show_missing = True
fail_under = 90
