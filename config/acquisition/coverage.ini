[run]
# Count collector command lines that end-to-end suites run as child processes.
patch = subprocess
omit =
    */scripts/acquisition/tests/*
    */scripts/acquisition/run_e2e.py
    */scripts/acquisition/run_registry_additions_e2e.py
    # The changed copy of the registry validator that the boundary probe loads from a temporary folder.
    */registry_additions_probe.py
    */scripts/acquisition/verify_e2e_artifact.py
    # One-off tools that already ran; their run records are the evidence.
    */scripts/acquisition/one_off/*

[paths]
# One source, several places: a test that unpacks the code archive runs a copy under a pytest folder, and a worktree or the main checkout has its own absolute
# path. Remapping merges the lines each copy ran into the file of the tree, so a copy is never counted as extra source. The threshold and the omissions are unchanged.
source =
    scripts/acquisition
    */pytest-of-*/*/*/root/scripts/acquisition
    */pytest-of-*/*/root/scripts/acquisition
    */.worktrees/*/scripts/acquisition
    */healthcare-hai-prediction/scripts/acquisition

[report]
show_missing = True
fail_under = 90
