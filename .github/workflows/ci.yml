name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A pull request run checks the whole merge-base..head range, so a newer push may cancel it. A push run checks only its
# pushed range, so each push gets its own group and is never cancelled: a cancelled range would go unchecked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every checkout uses the head commit of a pull request (not GitHub's merge of the head into the base), so a pull request run checks the tree that
# a later push to main can compare with byte for byte. The plan job lets the run after a merge reuse a passed pull request result (see
# scripts/quality/ci_reuse.py); every other job waits for it and runs unless it answers reuse=true.
# Timeouts are about twice the measured time of each job (the table "Measured durations" in docs/quality_checks.md); scripts/quality/run_ci_groups_e2e.py compares them.
jobs:
  plan:
    name: CI Plan
    runs-on: ubuntu-24.04
    # Measured job wall time on main (3 runs, Oct 28 2026): max 0.2 min.
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse }}
      range_start: ${{ steps.range.outputs.start }}
      range_end: ${{ steps.range.outputs.end }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Choose the comparison range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          RANGE_START: ${{ github.event.pull_request.base.sha || github.event.before }}
          RANGE_END: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]] && git cat-file -e "$RANGE_START^{commit}" 2>/dev/null && git cat-file -e "$RANGE_END^{commit}" 2>/dev/null; then
            RANGE_START="$(git merge-base "$RANGE_START" "$RANGE_END")"
          fi
          printf 'start=%s\nend=%s\n' "$RANGE_START" "$RANGE_END" >> "$GITHUB_OUTPUT"

      - name: Decide whether the merged pull request result is reused
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.quality.ci_reuse

  reused_gates:
    name: Quick Gates of a Reused Result
    needs: plan
    if: ${{ needs.plan.outputs.reuse == 'true' }}
    runs-on: ubuntu-24.04
    # Job wall time not measured: the job runs only when a passed result is reused.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: true

      - name: Set up the checks
        uses: ./.github/actions/setup

      - name: Check commit messages and removed names of the pushed range
        if: ${{ github.event.before != '0000000000000000000000000000000000000000' }}
        env:
          RANGE_START: ${{ needs.plan.outputs.range_start }}
          RANGE_END: ${{ needs.plan.outputs.range_end }}
        run: |
          if ! git cat-file -e "$RANGE_START^{commit}" 2>/dev/null; then
            # A history rewrite removes the previous tip: validate the complete new history.
            RANGE_START="$(git rev-list --max-parents=0 "$RANGE_END")"
            git show -s --format=%B "$RANGE_START" > "$RUNNER_TEMP/root_commit_message"
            .venv/bin/python -m scripts.quality.repo_checks commit-msg "$RUNNER_TEMP/root_commit_message"
          fi
          .venv/bin/python -m scripts.quality.repo_checks commit-range "$RANGE_START" "$RANGE_END"
          # The local hook sees only the staged diff; here, names removed anywhere in the pushed range.
          PRE_COMMIT_FROM_REF="$RANGE_START" PRE_COMMIT_TO_REF="$RANGE_END" .venv/bin/python -m scripts.quality.repo_checks removed-names

      - name: Run the quick gates (privacy, secrets, documentation, writing, Markdown and source gates)
        env:
          CI_PART: gates
          CI_SCOPE: range
          RANGE_START: ${{ needs.plan.outputs.range_start }}
          RANGE_END: ${{ needs.plan.outputs.range_end }}
        run: bash scripts/run_ci.sh

  hooks:
    name: Repository Hooks (${{ matrix.group }})
    needs: plan
    if: ${{ needs.plan.outputs.reuse != 'true' }}
    # Pinned: ubuntu-latest moves to Ubuntu 26 from Oct 19 2026; move deliberately after a green test run on the new image.
    runs-on: ubuntu-24.04
    # Measured job wall time on main (3 runs, Oct 28 2026), per matrix entry: beside each timeout below.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: privacy
            timeout: 12  # max 2.5 min
          - group: documentation
            timeout: 30  # max 1.9 min
          - group: code
            timeout: 40  # max 9.8 min
    steps:
      - name: Record hook job start
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          # The two acquisition config files over 5 MB are stored with Git LFS (.gitattributes).
          lfs: true

      - name: Set up the checks
        uses: ./.github/actions/setup

      - name: Check commit messages
        if: ${{ matrix.group == 'privacy' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')) }}
        env:
          RANGE_START: ${{ needs.plan.outputs.range_start }}
          RANGE_END: ${{ needs.plan.outputs.range_end }}
        run: |
          if ! git cat-file -e "$RANGE_START^{commit}" 2>/dev/null; then
            # A history rewrite removes the previous tip: validate the complete new history.
            RANGE_START="$(git rev-list --max-parents=0 "$RANGE_END")"
            git show -s --format=%B "$RANGE_START" > "$RUNNER_TEMP/root_commit_message"
            .venv/bin/python -m scripts.quality.repo_checks commit-msg "$RUNNER_TEMP/root_commit_message"
          fi
          .venv/bin/python -m scripts.quality.repo_checks commit-range "$RANGE_START" "$RANGE_END"
          # The local hook sees only the staged diff; here, names removed anywhere in the pushed range.
          PRE_COMMIT_FROM_REF="$RANGE_START" PRE_COMMIT_TO_REF="$RANGE_END" .venv/bin/python -m scripts.quality.repo_checks removed-names

      - name: Run this complete partition of the manual hooks
        env:
          RANGE_START: ${{ needs.plan.outputs.range_start }}
          RANGE_END: ${{ needs.plan.outputs.range_end }}
        run: .venv/bin/python -m scripts.quality.ci_hooks --group '${{ matrix.group }}' --from "$RANGE_START" --to "$RANGE_END"

      - name: Retain hook evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hooks_${{ matrix.group }}_${{ github.run_id }}_${{ github.run_attempt }}
          path: data/e2e/hooks/
          if-no-files-found: warn
          retention-days: 14

  local_ci:
    name: Local CI Core
    needs: plan
    if: ${{ needs.plan.outputs.reuse != 'true' }}
    runs-on: ubuntu-24.04
    # Measured job wall time on main (3 runs, Oct 28 2026): max 25.3 min, mean 24.9 min.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: true

      - name: Set up the checks
        uses: ./.github/actions/setup

      - name: Run local CI without the launcher E2E
        env:
          CI_PART: core
          CI_SCOPE: range
          RANGE_START: ${{ needs.plan.outputs.range_start }}
          RANGE_END: ${{ needs.plan.outputs.range_end }}
          E2E_ARTIFACT_DIR: ${{ github.workspace }}/data/e2e/configuration
          POLICY_ARTIFACT_DIR: ${{ github.workspace }}/data/e2e/policies
          QUALITY_ARTIFACT_DIR: ${{ github.workspace }}/data/e2e/quality
        run: bash scripts/run_ci.sh

      - name: Retain configuration, policy, quality and broker evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: configuration_e2e_${{ github.run_id }}_${{ github.run_attempt }}
          path: |
            data/e2e/configuration/
            data/e2e/policies/
            data/e2e/quality/
            data/e2e/orchestration_broker/
          if-no-files-found: warn
          retention-days: 14

  lakehouse:
    name: Lakehouse ${{ matrix.layer }} Checks
    needs: plan
    if: ${{ needs.plan.outputs.reuse != 'true' }}
    runs-on: ubuntu-24.04
    # Measured job wall time on main (3 runs, Oct 28 2026), per matrix entry: beside each timeout below.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - layer: Bronze
            part: bronze
            timeout: 20  # max 12.2 min
          - layer: Silver
            part: silver
            timeout: 5  # max 3.3 min
          # The gold layer's model metadata E2E, its longest command, runs in the gold_metadata job; writer_setup has timing assertions and runs
          # alone, before the other gold commands of this job.
          - layer: Gold
            part: gold
            units: checks writer_setup
            timeout: 25  # max 6.3 min
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: true

      - name: Set up the checks
        uses: ./.github/actions/setup

      - name: Run the layer's checks (skipped with a reason when the range changes nothing it depends on)
        env:
          CI_PART: ${{ matrix.part }}
          CI_UNITS: ${{ matrix.units }}
          CI_SCOPE: range
          RANGE_START: ${{ needs.plan.outputs.range_start }}
          RANGE_END: ${{ needs.plan.outputs.range_end }}
          QUALITY_ARTIFACT_DIR: ${{ github.workspace }}/data/e2e/quality
        run: bash scripts/run_ci.sh

      - name: Retain the layer's evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lakehouse_${{ matrix.part }}_${{ github.run_id }}_${{ github.run_attempt }}
          path: |
            data/e2e/quality/
            data/e2e/feature_sources/
            data/e2e/feature_columns/
          if-no-files-found: ignore
          retention-days: 14

  feature_sources:
    name: Feature Sources (Shard ${{ matrix.shard }} of 8)
    needs: plan
    if: ${{ needs.plan.outputs.reuse != 'true' }}
    runs-on: ubuntu-24.04
    # Measured job wall time on main (3 runs, Oct 28 2026): max 22.7 min (shard 1), shards 16.6 to 22.7 min.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: true

      - name: Set up the checks
        uses: ./.github/actions/setup

      - name: Run one feature sources shard with range selection
        env:
          CI_PART: feature_sources
          FEATURE_SHARD: ${{ matrix.shard }}/8
          CI_SCOPE: range
          RANGE_START: ${{ needs.plan.outputs.range_start }}
          RANGE_END: ${{ needs.plan.outputs.range_end }}
          QUALITY_ARTIFACT_DIR: ${{ github.workspace }}/data/e2e/quality
        run: bash scripts/run_ci.sh

      - name: Retain the shard report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: feature_sources_shard_${{ matrix.shard }}_${{ github.run_id }}_${{ github.run_attempt }}
          path: data/e2e/quality/feature_shards/
          if-no-files-found: ignore
          retention-days: 14

  feature_columns:
    name: Feature Columns (Shard ${{ matrix.shard }} of 4)
    needs: plan
    if: ${{ needs.plan.outputs.reuse != 'true' }}
    runs-on: ubuntu-24.04
    # Measured job wall time on main (3 runs, Oct 28 2026): max 7.1 min (shard 1), shards 4.9 to 7.1 min.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: true

      - name: Set up the checks
        uses: ./.github/actions/setup

      - name: Run one feature columns shard with range selection
        env:
          CI_PART: feature_columns
          FEATURE_SHARD: ${{ matrix.shard }}/4
          CI_SCOPE: range
          RANGE_START: ${{ needs.plan.outputs.range_start }}
          RANGE_END: ${{ needs.plan.outputs.range_end }}
          QUALITY_ARTIFACT_DIR: ${{ github.workspace }}/data/e2e/quality
        run: bash scripts/run_ci.sh

      - name: Retain the shard report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: feature_columns_shard_${{ matrix.shard }}_${{ github.run_id }}_${{ github.run_attempt }}
          path: data/e2e/quality/feature_shards/
          if-no-files-found: ignore
          retention-days: 14

  feature_evidence:
    name: Feature Combined Evidence
    needs: [plan, feature_sources, feature_columns]
    if: ${{ !cancelled() && needs.plan.outputs.reuse != 'true' }}
    runs-on: ubuntu-24.04
    # Measured job wall time on main (3 runs, Oct 28 2026): max 1.5 min.
    timeout-minutes: 10
    steps:
      - name: Require every feature shard job to have succeeded
        env:
          SOURCES: ${{ needs.feature_sources.result }}
          COLUMNS: ${{ needs.feature_columns.result }}
        run: |
          if [[ "$SOURCES" != "success" || "$COLUMNS" != "success" ]]; then
            echo "Feature shards failed: sources=$SOURCES columns=$COLUMNS" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: true

      - name: Set up the checks
        uses: ./.github/actions/setup

      - name: Select feature evidence for the checked range
        id: selection
        env:
          RANGE_START: ${{ needs.plan.outputs.range_start }}
          RANGE_END: ${{ needs.plan.outputs.range_end }}
        run: |
          plan="$(.venv/bin/python -m scripts.quality.ci_groups plan --scope range --part features --from "$RANGE_START" --to "$RANGE_END" --format shell)"
          printf '%s\n' "$plan" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ $'\n'"$plan"$'\n' == *$'\nrun lakehouse_features\n'* ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Download every feature shard report
        if: ${{ steps.selection.outputs.run == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: feature_*_shard_*_${{ github.run_id }}_${{ github.run_attempt }}
          path: data/e2e/quality/feature_shards
          merge-multiple: true

      - name: Combine reports and require complete disjoint case coverage
        if: ${{ steps.selection.outputs.run == 'true' }}
        run: |
          .venv/bin/python -m scripts.lakehouse.feature_shards combine --suite sources --count 8 --directory data/e2e/quality/feature_shards/sources
          .venv/bin/python -m scripts.lakehouse.feature_shards combine --suite columns --count 4 --directory data/e2e/quality/feature_shards/columns

      - name: Retain the combined evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: feature_combined_${{ github.run_id }}_${{ github.run_attempt }}
          path: data/e2e/quality/feature_shards/
          if-no-files-found: ignore
          retention-days: 14

  gold_metadata:
    name: Lakehouse Gold Model Metadata E2E
    needs: plan
    if: ${{ needs.plan.outputs.reuse != 'true' }}
    runs-on: ubuntu-24.04
    # Measured job wall time on main (3 runs, Oct 28 2026): max 19.3 min, mean 15.1 min.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: true

      - name: Set up the checks
        uses: ./.github/actions/setup

      # 258 cases that each build a scratch repository and run a pre-commit hook: they run at the same time, up to the runner's CPU count (at most 4).
      - name: Run the gold model metadata E2E (skipped with a reason when the range does not reach the gold layer)
        env:
          CI_PART: gold
          CI_UNITS: model_metadata_e2e
          MODEL_METADATA_WORKERS: auto
          CI_SCOPE: range
          RANGE_START: ${{ needs.plan.outputs.range_start }}
          RANGE_END: ${{ needs.plan.outputs.range_end }}
        run: bash scripts/run_ci.sh

      - name: Retain the model metadata evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model_metadata_e2e_${{ github.run_id }}_${{ github.run_attempt }}
          path: data/e2e/model_metadata/
          if-no-files-found: ignore
          retention-days: 14

  launcher:
    name: Launcher E2E (Shard ${{ matrix.shard }} of 2)
    needs: plan
    if: ${{ needs.plan.outputs.reuse != 'true' }}
    runs-on: ubuntu-24.04
    # Measured job wall time on main (3 runs, Oct 28 2026): max 12.5 min (shard 1), shard 2 max 10.5 min.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: true

      - name: Set up the checks
        uses: ./.github/actions/setup

      - name: Run one launcher E2E shard
        env:
          CI_PART: launcher
          CI_SCOPE: range
          LAUNCHER_SHARD: ${{ matrix.shard }}/2
          RANGE_START: ${{ needs.plan.outputs.range_start }}
          RANGE_END: ${{ needs.plan.outputs.range_end }}
        run: bash scripts/run_ci.sh

      - name: Retain launcher E2E evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: launcher_e2e_${{ matrix.shard }}_${{ github.run_id }}_${{ github.run_attempt }}
          path: data/e2e/launcher/
          if-no-files-found: ignore
          retention-days: 14

  # The acquisition tests run as four shards that share the work by measured time (config/acquisition/shard_weights.json). Each shard records its
  # coverage without a target. The combining job below is the "Acquisition Checks" gate: it needs every shard, merges their coverage and enforces
  # the 90% target on the merged data. It fails when a shard job did not succeed, a shard artifact is missing, a collected test did not run in
  # exactly one shard or the merged coverage is under the target.
  acquisition_shard:
    name: Acquisition Checks (Shard ${{ matrix.shard }} of 4)
    needs: plan
    if: ${{ needs.plan.outputs.reuse != 'true' }}
    runs-on: ubuntu-24.04
    # Expected about 13 minutes with the setup (estimated from the 41 minutes of the unsharded run, whose tests take 39, over four shards). Resize
    # from a complete hosted run.
    # Measured job wall time on main (3 runs, Oct 28 2026): max 12.0 min (shard 1), shards 11.1 to 12.0 min.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Both ends of the pushed range must be in the clone.
          fetch-depth: 0
          lfs: true

      # Collectors resolve the Terraform binary to read bucket outputs; the checks never run it against state.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install shared dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --no-cache-dir -r requirements.txt

      # Same paths as the local acquisition-checks hook; a manual run, a push with no earlier commit or rewritten history runs every check.
      - name: Run this shard of the acquisition tests without AWS credentials or collected data
        env:
          ACQUISITION_PART: shard
          ACQUISITION_SHARD: ${{ matrix.shard }}/4
          RANGE_START: ${{ needs.plan.outputs.range_start }}
          RANGE_END: ${{ needs.plan.outputs.range_end }}
        run: bash scripts/acquisition/run_checks_ci.sh

      - name: Retain the shard manifest and coverage data
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acquisition_shard_${{ matrix.shard }}_${{ github.run_id }}_${{ github.run_attempt }}
          path: data/e2e/acquisition_shards/
          if-no-files-found: warn
          retention-days: 14

      - name: Retain acquisition E2E evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acquisition_e2e_${{ matrix.shard }}_${{ github.run_id }}_${{ github.run_attempt }}
          path: data/e2e/acquisition_checks/
          if-no-files-found: warn
          retention-days: 14

  acquisition:
    name: Acquisition Checks
    needs: [plan, acquisition_shard]
    # Runs after a failed shard too, so that the failure shows here and a skipped gate never counts as a pass; a cancelled run needs no verdict.
    if: ${{ !cancelled() && needs.plan.outputs.reuse != 'true' }}
    runs-on: ubuntu-24.04
    # Measured job wall time on main (3 runs, Oct 28 2026): max 1.8 min.
    timeout-minutes: 10
    steps:
      - name: Require every shard job to have succeeded
        env:
          SHARDS: ${{ needs.acquisition_shard.result }}
        run: |
          if [[ "$SHARDS" != "success" ]]; then
            echo "The acquisition shard jobs finished with result '$SHARDS', not 'success'; the gate fails." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install shared dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --no-cache-dir -r requirements.txt

      - name: Download the shard manifests and coverage data of this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: acquisition_shard_*_${{ github.run_id }}_${{ github.run_attempt }}
          path: data/e2e/acquisition_shards
          merge-multiple: true

      - name: Run Ruff, MyPy and the registry check, then merge the coverage and enforce the 90% gate
        env:
          ACQUISITION_PART: combine
          ACQUISITION_SHARD_COUNT: "4"
          RANGE_START: ${{ needs.plan.outputs.range_start }}
          RANGE_END: ${{ needs.plan.outputs.range_end }}
        run: bash scripts/acquisition/run_checks_ci.sh
