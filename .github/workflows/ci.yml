name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A pull request run checks the whole base..head range, so a newer push may cancel it. A push run checks only its
# pushed range, so each push gets its own group and is never cancelled: a cancelled range would go unchecked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # The checks of a local commit run here as three parallel jobs: the hooks (without local_ci), local CI's core part
  # and the launcher E2E in two shards. Together they run everything the local_ci hook runs.
  hooks:
    name: Repository Hooks
    # Pinned: ubuntu-latest moves to Ubuntu 26 from Oct 19 2026; move deliberately after a green test run on the new image.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          # The two acquisition config files over 5 MB are stored with Git LFS (.gitattributes).
          lfs: true

      - name: Set up the checks
        uses: ./.github/actions/setup

      - name: Check commit messages
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000') }}
        env:
          RANGE_START: ${{ github.event.pull_request.base.sha || github.event.before }}
          RANGE_END: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! git cat-file -e "$RANGE_START^{commit}" 2>/dev/null; then
            # A history rewrite removes the previous tip: validate the complete new history.
            RANGE_START="$(git rev-list --max-parents=0 "$RANGE_END")"
            git show -s --format=%B "$RANGE_START" > "$RUNNER_TEMP/root_commit_message"
            .venv/bin/python -m scripts.quality.repo_checks commit-msg "$RUNNER_TEMP/root_commit_message"
          fi
          .venv/bin/python -m scripts.quality.repo_checks commit-range "$RANGE_START" "$RANGE_END"
          # The local hook sees only the staged diff; here, names removed anywhere in the pushed range.
          PRE_COMMIT_FROM_REF="$RANGE_START" PRE_COMMIT_TO_REF="$RANGE_END" .venv/bin/python -m scripts.quality.repo_checks removed-names

      # The same hooks as a local commit, at the same pinned versions, with the full manual stage. The local_ci hook
      # (scripts/run_ci.sh) runs as the two jobs below instead. Acquisition checks run in their own job.
      - name: Run credential-free checks through the pre-commit hooks
        env:
          SKIP: local_ci
        run: .venv/bin/pre-commit run --all-files --hook-stage manual --show-diff-on-failure

  local_ci:
    name: Local CI Core
    runs-on: ubuntu-24.04
    # About 15 minutes on the runner with its check groups running concurrently.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: true

      - name: Set up the checks
        uses: ./.github/actions/setup

      # Everything scripts/run_ci.sh runs except the launcher E2E; SQLFluff lints in the hooks job.
      - name: Run local CI without the launcher E2E
        env:
          CI_PART: core
          CI_SKIP_SQLFLUFF: "1"
          E2E_ARTIFACT_DIR: ${{ github.workspace }}/data/e2e/configuration
          QUALITY_ARTIFACT_DIR: ${{ github.workspace }}/data/e2e/quality
        run: bash scripts/run_ci.sh

      - name: Retain configuration and quality evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: configuration_e2e_${{ github.run_id }}_${{ github.run_attempt }}
          path: |
            data/e2e/configuration/
            data/e2e/quality/
          if-no-files-found: warn
          retention-days: 14

  launcher:
    name: Launcher E2E (Shard ${{ matrix.shard }} of 2)
    runs-on: ubuntu-24.04
    # About 10 minutes per shard on the runner.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: true

      - name: Set up the checks
        uses: ./.github/actions/setup

      # Same entry as the local_ci hook's launcher part; it skips when the range changes no path the launcher reads.
      - name: Run one launcher E2E shard
        env:
          LAUNCHER_SHARD: ${{ matrix.shard }}/2
          RANGE_START: ${{ github.event.pull_request.base.sha || github.event.before }}
          RANGE_END: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/lakehouse/run_launcher_ci.sh

      - name: Retain launcher E2E evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: launcher_e2e_${{ matrix.shard }}_${{ github.run_id }}_${{ github.run_attempt }}
          path: data/e2e/launcher/
          if-no-files-found: ignore
          retention-days: 14

  acquisition:
    name: Acquisition Checks
    runs-on: ubuntu-24.04
    # Every offline E2E suite runs twice: 12-14 minutes locally, up to 29 minutes here. It runs only when the range
    # changes a path the acquisition-checks hook watches (about 1 minute otherwise); see the run step.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # Both ends of the pushed range must be in the clone.
          fetch-depth: 0
          lfs: true

      # Collectors resolve the Terraform binary to read bucket outputs; the checks never run it against state.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install shared dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt

      # Same paths as the local acquisition-checks hook; a manual run, a new branch or rewritten history runs every check.
      - name: Run acquisition checks without AWS credentials or collected data
        env:
          RANGE_START: ${{ github.event.pull_request.base.sha || github.event.before }}
          RANGE_END: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/acquisition/run_checks_ci.sh

      - name: Retain acquisition E2E evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acquisition_e2e_${{ github.run_id }}_${{ github.run_attempt }}
          path: data/e2e/acquisition_checks/
          if-no-files-found: warn
          retention-days: 14
