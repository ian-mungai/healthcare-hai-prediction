name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    name: Terraform and IAM Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install shared dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python scripts/quality/install_tools.py

      - name: Check commit messages
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000') }}
        env:
          RANGE_START: ${{ github.event.pull_request.base.sha || github.event.before }}
          RANGE_END: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! git cat-file -e "$RANGE_START^{commit}" 2>/dev/null; then
            # A history rewrite removes the previous tip: validate the complete new history.
            RANGE_START="$(git rev-list --max-parents=0 "$RANGE_END")"
            git show -s --format=%B "$RANGE_START" > "$RUNNER_TEMP/root_commit_message"
            .venv/bin/python -m scripts.quality.repo_checks commit-msg "$RUNNER_TEMP/root_commit_message"
          fi
          .venv/bin/python -m scripts.quality.repo_checks commit-range "$RANGE_START" "$RANGE_END"

      - name: Run credential-free checks
        env:
          E2E_ARTIFACT_DIR: ${{ github.workspace }}/data/e2e/configuration
          QUALITY_ARTIFACT_DIR: ${{ github.workspace }}/data/e2e/quality
        run: bash scripts/run_ci.sh

      - name: Retain configuration and quality evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: configuration_e2e_${{ github.run_id }}_${{ github.run_attempt }}
          path: |
            data/e2e/configuration/
            data/e2e/quality/
          if-no-files-found: warn
          retention-days: 14
