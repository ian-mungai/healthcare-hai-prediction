name: Deploy model API

# Releases a serving image (owner decision D18: a model release needs no owner step). The job registers the next task definition revision of the
# model API or the dashboard itself, from the running revision with the new image digest, rolls the service to it and waits until the service is stable.
# .github/scripts/serving_release.sh renders the revision and refuses it, before and after the registration, if it names any role, secret or image
# repository the serving tasks may not use. Off until the owner sets the repository variable OIDC_DELIVERY_ENABLED to true (project guide: OIDC
# delivery). The model-api-deploy environment holds the owner's approval. The deploy role can register only the two serving families, pass only the
# two serving task roles and the serving execution role, and update only the services named in github_oidc_deploy_services.
on:
  workflow_dispatch:
    inputs:
      service:
        description: The serving service to release
        type: choice
        required: true
        options:
          - model_api
          - streamlit
      image_digest:
        description: The digest of the image in the project repository, sha256 and 64 hex digits
        type: string
        required: true

permissions: {}

concurrency:
  group: deploy-model-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Roll the service
    if: ${{ vars.OIDC_DELIVERY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: model-api-deploy
    outputs:
      task_definition: ${{ steps.revision.outputs.task_definition }}
    permissions:
      contents: read
      id-token: write
    env:
      SERVING_SERVICE: ${{ inputs.service }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      CLUSTER: ${{ vars.ECS_CLUSTER_NAME }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      ENVIRONMENT: ${{ vars.DEPLOY_ENVIRONMENT }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Check the inputs
        run: |
          [[ "$SERVING_SERVICE" == model_api || "$SERVING_SERVICE" == streamlit ]] || { echo "Use model_api or streamlit." >&2; exit 1; }
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Use the image digest, sha256 and 64 hex digits." >&2; exit 1; }
          [[ "$CLUSTER" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "Set the repository variable ECS_CLUSTER_NAME." >&2; exit 1; }
          [[ "$PROJECT_NAME" =~ ^[a-z][a-z0-9_]{0,36}$ ]] || { echo "Set the repository variable PROJECT_NAME." >&2; exit 1; }
          [[ "$ENVIRONMENT" =~ ^[a-z]{2,10}$ ]] || { echo "Set the repository variable DEPLOY_ENVIRONMENT." >&2; exit 1; }

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_DEPLOY }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gh_deploy_model_api
          mask-aws-account-id: true

      - name: Register the next revision from the running one and check it
        id: revision
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::$account"
          export AWS_ACCOUNT_ID="$account"
          service="${PROJECT_NAME}_${ENVIRONMENT}_${SERVING_SERVICE}"
          running="$(aws ecs describe-services --cluster "$CLUSTER" --services "$service" --query 'services[0].taskDefinition' --output text)"
          aws ecs describe-task-definition --task-definition "$running" --query taskDefinition --output json | bash .github/scripts/serving_release.sh render "$SERVING_SERVICE" "$IMAGE_DIGEST" > "$RUNNER_TEMP/definition.json"
          bash .github/scripts/serving_release.sh check "$SERVING_SERVICE" < "$RUNNER_TEMP/definition.json"
          arn="$(aws ecs register-task-definition --cli-input-json "file://$RUNNER_TEMP/definition.json" --query taskDefinition.taskDefinitionArn --output text)"
          aws ecs describe-task-definition --task-definition "$arn" --query taskDefinition --output json | bash .github/scripts/serving_release.sh check "$SERVING_SERVICE"
          echo "task_definition=$arn" >> "$GITHUB_OUTPUT"
          echo "service=$service" >> "$GITHUB_OUTPUT"

      - name: Roll the service, wait with a deadline and verify the rollout
        env:
          TASK_DEFINITION: ${{ steps.revision.outputs.task_definition }}
          SERVICE: ${{ steps.revision.outputs.service }}
        run: |
          deployment="$(aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$TASK_DEFINITION" --output json | jq -r '[.service.deployments[] | select(.status == "PRIMARY")][0].id // empty')"
          [[ "$deployment" =~ ^ecs-svc/[0-9]+$ ]] || { echo "The update did not start a deployment." >&2; exit 1; }
          timeout 1500 aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          # A stable service can be the old revision after a rollback, so the final deployment and its task definition are checked, not the task count.
          aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" | bash .github/scripts/deployment_check.sh "$TASK_DEFINITION" "$deployment"
          echo "Service $SERVICE runs the new revision (deployment $deployment completed)." >> "$GITHUB_STEP_SUMMARY"
