name: Set up the checks
description: Terraform, Python, Node.js, Go and the pinned project tools every CI check job needs.

# pip accepts a package found in a restored environment as already satisfied, so the Python environment is built fresh from the
# hash-pinned groups of uv.lock (the host group here; SQLFluff, import-linter and check-jsonschema have their own), and pip checks
# every hash again on a pip cache hit. The native tools (gitleaks, TFLint, trivy, OSV-Scanner, zizmor, typos, uv and the rest) are
# downloaded from the pins of config/quality_tools.json on every run and checked by SHA-256 before they are written to .tools/bin;
# nothing restored from a cache is trusted without that check.
inputs:
  lint-tools:
    description: Also install the Python lint tools and the AWS ruleset of TFLint, which only the hook group that runs those linters needs.
    required: false
    default: "false"
  redis-server:
    description: Also install the pinned Redis server of the Ubuntu 24.04 archive, which only the job that runs the terraform_checks group needs for its Redis cases.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      with:
        terraform_version: "1.16.1"
        terraform_wrapper: false

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: uv.lock

    # markdownlint-cli2 needs Node.js 22 or later.
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: scripts/quality/markdownlint/package-lock.json

    # gofmt and go vet (scripts/quality/lint_sources.py) require exactly Go 1.27.3. The project has no go.sum, so no cache.
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.27.3"
        cache: false

    - name: Restore the dbt package archive
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: data/analytics/dbt/package_archive
        key: dbt-archive-${{ hashFiles('config/lakehouse/dbt_package_archive.json', 'dbt/package-lock.yml') }}

    - name: Restore the Terraform provider cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.terraform.d/plugin-cache
        key: terraform-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('infra/.terraform.lock.hcl', 'infra/iam/.terraform.lock.hcl') }}

    - name: Install shared dependencies
      shell: bash
      run: |
        python -m venv .venv
        .venv/bin/python scripts/quality/install_tools.py
        .venv/bin/python -m scripts.quality.lock_env export host --output "$RUNNER_TEMP/host_lock"
        .venv/bin/python -m pip install --no-cache-dir --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/host_lock/requirements.txt"
        .venv/bin/python -m pip check
        .venv/bin/python -m scripts.quality.install_markdownlint
        .venv/bin/python -m scripts.quality.install_sqlfluff
        # The launcher E2E renders dbt_deps jobs from the pinned local package archive, which Git does not track.
        if ! .venv/bin/python -m scripts.lakehouse.dbt_package_archive verify; then
          .venv/bin/python -m scripts.lakehouse.dbt_package_archive fetch
        fi
        mkdir -p "$HOME/.terraform.d/plugin-cache"
        echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

    # The Redis cases start a real redis-server and the hosted runner image has none. The exact version of the Ubuntu 24.04 archive (noble and noble-updates,
    # packages.ubuntu.com, published 2026-10-06) is installed with its redis-tools of the same version, and the step fails when that version is no longer in the
    # archive: then look up the new version, record it here and in .github/scripts/workflow_input_cases.sh. Local CI uses the machine's own redis-server.
    - name: Install the pinned Redis server
      if: ${{ inputs.redis-server == 'true' }}
      shell: bash
      env:
        REDIS_VERSION: "5:7.0.15-1ubuntu0.24.04.5"
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends "redis-server=$REDIS_VERSION" "redis-tools=$REDIS_VERSION"
        installed="$(dpkg-query --show --showformat='${Version}' redis-server)"
        [[ "$installed" == "$REDIS_VERSION" ]] || { echo "redis-server $installed is installed, not $REDIS_VERSION." >&2; exit 1; }
        redis-server --version

    - name: Install the lint tools
      if: ${{ inputs.lint-tools == 'true' }}
      shell: bash
      env:
        # Without a token, the GitHub API limit on a shared runner address stops the plugin download.
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        .venv/bin/python -m scripts.quality.install_lint_tools
        # The AWS ruleset of the tflint hook: TFLint verifies the release checksums and signature of the plugin pinned in .tflint.hcl.
        .tools/bin/tflint --init --config .tflint.hcl
