name: Set up the checks
description: Terraform, Python, Node.js, Go and the pinned project tools every CI check job needs.

# pip accepts a package found in a restored environment or cache as already satisfied, and requirements.txt has no
# hashes, so the Python environment is built fresh; only the hash-pinned SQLFluff requirements use the pip cache.
runs:
  using: composite
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      with:
        terraform_version: "1.16.1"
        terraform_wrapper: false

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: scripts/quality/sqlfluff/requirements.txt

    # markdownlint-cli2 needs Node.js 22 or later.
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: scripts/quality/markdownlint/package-lock.json

    # gofmt and go vet (scripts/quality/lint_sources.py) require exactly Go 1.27.3. The project has no go.sum, so no cache.
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.27.3"
        cache: false

    - name: Restore the dbt package archive
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: data/analytics/dbt/package_archive
        key: dbt-archive-${{ hashFiles('config/lakehouse/dbt_package_archive.json', 'dbt/package-lock.yml') }}

    - name: Restore the Terraform provider cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.terraform.d/plugin-cache
        key: terraform-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('infra/.terraform.lock.hcl', 'infra/iam/.terraform.lock.hcl') }}

    - name: Install shared dependencies
      shell: bash
      run: |
        python -m venv .venv
        .venv/bin/python -m pip install --no-cache-dir -r requirements.txt
        .venv/bin/python -m pip check
        .venv/bin/python scripts/quality/install_tools.py
        .venv/bin/python -m scripts.quality.install_markdownlint
        .venv/bin/python -m scripts.quality.install_sqlfluff
        # The launcher E2E renders dbt_deps jobs from the pinned local package archive, which Git does not track.
        if ! .venv/bin/python -m scripts.lakehouse.dbt_package_archive verify; then
          .venv/bin/python -m scripts.lakehouse.dbt_package_archive fetch
        fi
        mkdir -p "$HOME/.terraform.d/plugin-cache"
        echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
