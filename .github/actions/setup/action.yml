name: Set up the checks
description: Terraform, Python, Node.js, Go and the pinned project tools every CI check job needs.

# pip accepts a package found in a restored environment or cache as already satisfied, and requirements.txt has no
# hashes, so the Python environment is built fresh; only the hash-pinned requirements of SQLFluff, import-linter and
# check-jsonschema use the pip cache (pip checks every hash again on a cache hit). The native tools (gitleaks, TFLint, trivy,
# OSV-Scanner, zizmor, typos and the rest) are downloaded from the pins of config/quality_tools.json on every run and checked
# by SHA-256 before they are written to .tools/bin; nothing restored from a cache is trusted without that check.
inputs:
  lint-tools:
    description: Also install the Python lint tools and the AWS ruleset of TFLint, which only the hook group that runs those linters needs.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      with:
        terraform_version: "1.16.1"
        terraform_wrapper: false

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          scripts/quality/sqlfluff/requirements.txt
          scripts/quality/lint_requirements/import_linter.txt
          scripts/quality/lint_requirements/check_jsonschema.txt

    # markdownlint-cli2 needs Node.js 22 or later.
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: scripts/quality/markdownlint/package-lock.json

    # gofmt and go vet (scripts/quality/lint_sources.py) require exactly Go 1.27.3. The project has no go.sum, so no cache.
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.27.3"
        cache: false

    - name: Restore the dbt package archive
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: data/analytics/dbt/package_archive
        key: dbt-archive-${{ hashFiles('config/lakehouse/dbt_package_archive.json', 'dbt/package-lock.yml') }}

    - name: Restore the Terraform provider cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.terraform.d/plugin-cache
        key: terraform-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('infra/.terraform.lock.hcl', 'infra/iam/.terraform.lock.hcl') }}

    - name: Install shared dependencies
      shell: bash
      run: |
        python -m venv .venv
        .venv/bin/python -m pip install --no-cache-dir -r requirements.txt
        .venv/bin/python -m pip check
        .venv/bin/python scripts/quality/install_tools.py
        .venv/bin/python -m scripts.quality.install_markdownlint
        .venv/bin/python -m scripts.quality.install_sqlfluff
        # The launcher E2E renders dbt_deps jobs from the pinned local package archive, which Git does not track.
        if ! .venv/bin/python -m scripts.lakehouse.dbt_package_archive verify; then
          .venv/bin/python -m scripts.lakehouse.dbt_package_archive fetch
        fi
        mkdir -p "$HOME/.terraform.d/plugin-cache"
        echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

    - name: Install the lint tools
      if: ${{ inputs.lint-tools == 'true' }}
      shell: bash
      env:
        # Without a token, the GitHub API limit on a shared runner address stops the plugin download.
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        .venv/bin/python -m scripts.quality.install_lint_tools
        # The AWS ruleset of the tflint hook: TFLint verifies the release checksums and signature of the plugin pinned in .tflint.hcl.
        .tools/bin/tflint --init --config .tflint.hcl
