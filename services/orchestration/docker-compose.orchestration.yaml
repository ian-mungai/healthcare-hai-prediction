# The orchestration stack as a specification only: orchestration/launcher.py reads this file and builds every container's create
# specification from it (orchestration_up, orchestration_down and the orchestration_check template). Nothing runs it with
# `docker compose`, and the launcher does not read depends_on: its start order is ORCHESTRATION_ORDER, with a health wait for each
# long-running service and an exit-code check for the migration. The launcher fills every ${HAI_ORCH_*} name from validated values and
# nothing else; health checks are passed to Docker as written (no Compose interpolation, so no $$ escape). A volume names its variable
# without a message because the launcher splits a volume at its colons; a missing value is still refused.
#
# Airflow orchestrates and holds no data credential: no Docker socket, no AWS folder and no lakehouse secret is mounted. Tasks reach
# work only through the launcher at host.docker.internal with the session token mounted
# read-only into the scheduler. Images are pinned: PostgreSQL by digest, the Airflow image by the hai- tag that
# services/orchestration/Dockerfile builds from the official image's digest. The API listens on this Mac's loopback only.
name: hai-orchestration

x-airflow: &airflow
  image: hai-airflow:3.4.0-python3.12
  # The Mac user's UID with group 0, as the official image supports; the session files are written for this UID.
  user: "${HAI_ORCH_UID:?set by the launcher}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__PARALLELISM: ${HAI_ORCH_PARALLELISM:?set by the launcher}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_SQL_ALCHEMY_CONN}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # No schedule or asset trigger runs until the owner approves it (decision O3).
    AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT: "false"
    AIRFLOW__OPENLINEAGE__NAMESPACE: hai-prediction-local
    AIRFLOW__OPENLINEAGE__CONFIG_PATH: /opt/hai/hai_lineage/openlineage.yml
    AIRFLOW__OPENLINEAGE__CONFIG_CONN_ID: ""
    AIRFLOW__OPENLINEAGE__DISABLE_SOURCE_CODE: "true"
    AIRFLOW__OPENLINEAGE__INCLUDE_FULL_TASK_INFO: "false"
    AIRFLOW__OPENLINEAGE__DEBUG_MODE: "false"
    AIRFLOW__OPENLINEAGE__EXECUTION_TIMEOUT: "5"
    PYTHONPATH: /opt/hai
  volumes:
    - ${HAI_ORCH_REPO}/dags:/opt/airflow/dags:ro
    - ${HAI_ORCH_REPO}/orchestration/__init__.py:/opt/hai/orchestration/__init__.py:ro
    - ${HAI_ORCH_REPO}/orchestration/interface.py:/opt/hai/orchestration/interface.py:ro
    - ${HAI_ORCH_REPO}/orchestration/client.py:/opt/hai/orchestration/client.py:ro
    - ${HAI_ORCH_REPO}/services/lineage:/opt/hai/hai_lineage:ro
    - ${HAI_ORCH_REPO}/orchestration/dag_runtime.py:/opt/hai/orchestration/dag_runtime.py:ro
    - ${HAI_ORCH_REPO}/orchestration/ingestion_schedule.py:/opt/hai/orchestration/ingestion_schedule.py:ro
    - ${HAI_ORCH_REPO}/orchestration/training_contract.py:/opt/hai/orchestration/training_contract.py:ro
    - ${HAI_ORCH_STATE}/logs:/opt/airflow/logs
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
      POSTGRES_INITDB_ARGS: --encoding UTF8 --data-checksums
    # Computed by the launcher from the memory free when the stack starts; kept for its life.
    mem_limit: ${HAI_ORCH_MEM_POSTGRES:?set by the launcher}
    volumes:
      # Airflow's metadata lives in the ignored data/orchestration/ folder (decision O4), never in Polaris's database.
      - ${HAI_ORCH_STATE}/postgres:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-d", "airflow"]
      interval: 5s
      timeout: 2s
      retries: 20

  # The database migration: a finite service that runs once behind the deadline entrypoint and must exit 0 before the Airflow services start.
  airflow-migrate:
    <<: *airflow
    command: ["db", "migrate"]
    mem_limit: ${HAI_ORCH_MEM_APISERVER:?set by the launcher}

  airflow-apiserver:
    <<: *airflow
    command: ["api-server"]
    mem_limit: ${HAI_ORCH_MEM_APISERVER:?set by the launcher}
    # Only this service and the scheduler write the lineage provider spool: the API server may emit the provider's state-change callbacks.
    volumes:
      - ${HAI_ORCH_REPO}/dags:/opt/airflow/dags:ro
      - ${HAI_ORCH_REPO}/orchestration/__init__.py:/opt/hai/orchestration/__init__.py:ro
      - ${HAI_ORCH_REPO}/orchestration/interface.py:/opt/hai/orchestration/interface.py:ro
      - ${HAI_ORCH_REPO}/orchestration/client.py:/opt/hai/orchestration/client.py:ro
      - ${HAI_ORCH_REPO}/services/lineage:/opt/hai/hai_lineage:ro
      - ${HAI_ORCH_REPO}/orchestration/dag_runtime.py:/opt/hai/orchestration/dag_runtime.py:ro
      - ${HAI_ORCH_REPO}/orchestration/ingestion_schedule.py:/opt/hai/orchestration/ingestion_schedule.py:ro
      - ${HAI_ORCH_REPO}/orchestration/training_contract.py:/opt/hai/orchestration/training_contract.py:ro
      - ${HAI_ORCH_STATE}/lineage_provider:/opt/hai/lineage_provider
      - ${HAI_ORCH_STATE}/logs:/opt/airflow/logs
    ports:
      - "127.0.0.1:${HAI_ORCH_API_PORT:?set by the launcher}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/v2/version"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  airflow-scheduler:
    <<: *airflow
    command: ["scheduler"]
    # LocalExecutor workers run inside the scheduler, so its limit and the parallelism come from one computation.
    mem_limit: ${HAI_ORCH_MEM_SCHEDULER:?set by the launcher}
    volumes:
      - ${HAI_ORCH_REPO}/dags:/opt/airflow/dags:ro
      - ${HAI_ORCH_REPO}/orchestration/__init__.py:/opt/hai/orchestration/__init__.py:ro
      - ${HAI_ORCH_REPO}/orchestration/interface.py:/opt/hai/orchestration/interface.py:ro
      - ${HAI_ORCH_REPO}/orchestration/client.py:/opt/hai/orchestration/client.py:ro
      - ${HAI_ORCH_REPO}/services/lineage:/opt/hai/hai_lineage:ro
      - ${HAI_ORCH_STATE}/lineage_provider:/opt/hai/lineage_provider
      - ${HAI_ORCH_REPO}/orchestration/dag_runtime.py:/opt/hai/orchestration/dag_runtime.py:ro
      - ${HAI_ORCH_REPO}/orchestration/ingestion_schedule.py:/opt/hai/orchestration/ingestion_schedule.py:ro
      - ${HAI_ORCH_REPO}/orchestration/training_contract.py:/opt/hai/orchestration/training_contract.py:ro
      - ${HAI_ORCH_STATE}/logs:/opt/airflow/logs
      # The broker URL and this session's token; only the scheduler runs tasks, so only it receives them.
      - ${HAI_ORCH_STATE}/session:/opt/hai/broker:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8974/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  airflow-dag-processor:
    <<: *airflow
    command: ["dag-processor"]
    mem_limit: ${HAI_ORCH_MEM_DAG_PROCESSOR:?set by the launcher}
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$HOSTNAME\""]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 30s

  airflow-triggerer:
    <<: *airflow
    command: ["triggerer"]
    mem_limit: ${HAI_ORCH_MEM_TRIGGERER:?set by the launcher}
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --hostname \"$HOSTNAME\""]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 30s

  # The offline checks (scripts/orchestration/in_image_checks.py): a finite job on no network, run by the orchestration_check template.
  airflow-check:
    <<: *airflow
    entrypoint: ["python"]
    command: ["/opt/hai/checks/in_image_checks.py"]
    environment:
      AIRFLOW_HOME: /tmp/airflow
      PYTHONPATH: /opt/hai
      # The real-image DAG runs (scripts/orchestration/real_image_dags.py): a SQLite metadata database in the container and no lineage emission.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////tmp/airflow/airflow.db
      AIRFLOW__CORE__DAGS_FOLDER: /opt/hai/repo/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Airflow reads the creation default once, when the check imports it, so the DAGs of the run are unpaused here and not in the rig (the training DAG's trigger
      # of research_dag fails with a paused target).
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__OPENLINEAGE__DISABLED: "true"
    volumes:
      - ${HAI_ORCH_REPO}/dags:/opt/hai/dags:ro
      - ${HAI_ORCH_REPO}/orchestration/__init__.py:/opt/hai/orchestration/__init__.py:ro
      - ${HAI_ORCH_REPO}/orchestration/interface.py:/opt/hai/orchestration/interface.py:ro
      - ${HAI_ORCH_REPO}/orchestration/client.py:/opt/hai/orchestration/client.py:ro
      - ${HAI_ORCH_REPO}/services/lineage:/opt/hai/hai_lineage:ro
      - ${HAI_ORCH_REPO}/orchestration/graph.py:/opt/hai/orchestration/graph.py:ro
      - ${HAI_ORCH_REPO}/orchestration/dag_runtime.py:/opt/hai/orchestration/dag_runtime.py:ro
      - ${HAI_ORCH_REPO}/orchestration/ingestion_schedule.py:/opt/hai/orchestration/ingestion_schedule.py:ro
      - ${HAI_ORCH_REPO}/orchestration/training_contract.py:/opt/hai/orchestration/training_contract.py:ro
      - ${HAI_ORCH_REPO}/scripts/orchestration/in_image_checks.py:/opt/hai/checks/in_image_checks.py:ro
      # The folders of the real-image DAG runs, read only: the DAGs, the launch library, the offline rig and the tables and fixtures they read.
      - ${HAI_ORCH_REPO}/dags:/opt/hai/repo/dags:ro
      - ${HAI_ORCH_REPO}/orchestration:/opt/hai/repo/orchestration:ro
      - ${HAI_ORCH_REPO}/scripts/orchestration:/opt/hai/repo/scripts/orchestration:ro
      - ${HAI_ORCH_REPO}/scripts/process.py:/opt/hai/repo/scripts/process.py:ro
      - ${HAI_ORCH_REPO}/scripts/quality/lock_env.py:/opt/hai/repo/scripts/quality/lock_env.py:ro
      # The lakehouse modules that the launch library imports (orchestration/layer_report.py, orchestration/ecs_preflight.py): the files that infra/services/airflow.tf mounts.
      - ${HAI_ORCH_REPO}/scripts/lakehouse/__init__.py:/opt/hai/repo/scripts/lakehouse/__init__.py:ro
      - ${HAI_ORCH_REPO}/scripts/lakehouse/bronze_dispatch.py:/opt/hai/repo/scripts/lakehouse/bronze_dispatch.py:ro
      - ${HAI_ORCH_REPO}/scripts/lakehouse/layer_acceptance.py:/opt/hai/repo/scripts/lakehouse/layer_acceptance.py:ro
      - ${HAI_ORCH_REPO}/scripts/lakehouse/pins.py:/opt/hai/repo/scripts/lakehouse/pins.py:ro
      - ${HAI_ORCH_REPO}/scripts/lakehouse/version_listing.py:/opt/hai/repo/scripts/lakehouse/version_listing.py:ro
      - ${HAI_ORCH_REPO}/config/orchestration:/opt/hai/repo/config/orchestration:ro
      - ${HAI_ORCH_REPO}/config/lakehouse/bronze_tables.json:/opt/hai/repo/config/lakehouse/bronze_tables.json:ro
      - ${HAI_ORCH_REPO}/infra/jobs/tests:/opt/hai/repo/infra/jobs/tests:ro
      - ${HAI_ORCH_REPO}/services/orchestration/constraints-3.12.txt:/opt/hai/constraints.txt:ro
      - ${HAI_ORCH_REPO}/config/orchestration/platform.json:/opt/hai/platform.json:ro
    mem_limit: ${JOB_MEMORY_LIMIT:?run through the orchestration_check template}

  airflow-dump:
    <<: *airflow
    entrypoint: ["python"]
    command: ["/opt/hai/checks/db_dump.py"]
    environment:
      AIRFLOW_HOME: /tmp/airflow
      PYTHONPATH: /opt/hai
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_SQL_ALCHEMY_CONN}
    volumes:
      - ${HAI_ORCH_REPO}/scripts/orchestration/db_dump.py:/opt/hai/checks/db_dump.py:ro
      - ${HAI_ORCH_STATE}/dumps:/out
    mem_limit: ${JOB_MEMORY_LIMIT:?run through the orchestration_dump template}
