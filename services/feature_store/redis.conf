# Online feature store (design section 4.2): the launcher passes the password and maxmemory on the command line from the container's environment.
# Nothing is persisted, so a restart empties every database. Database 1 holds Feast's entity hashes, database 2 the lease and the marker, 0 stays empty.
port 6379
protected-mode yes
databases 3
save ""
appendonly no
maxmemory-policy noeviction
