project: hai_prediction
provider: local
registry:
  registry_type: file
  path: ${FEAST_REGISTRY_PATH}
  cache_ttl_seconds: 60
offline_store:
  type: duckdb
online_store:
  type: redis
  redis_type: redis
  connection_string: ${FEAST_REDIS_HOST}:6379,password=${REDIS_PASSWORD},db=1,socket_timeout=5,socket_connect_timeout=5
  skip_dedup: true
entity_key_serialization_version: 3
