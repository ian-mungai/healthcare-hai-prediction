# Local lakehouse services: the Apache Polaris Iceberg REST catalog, its PostgreSQL database, the Spark job image and
# the DuckDB analytics image for read-only queries and the dbt staging models.
# Compose is a specification only: orchestration/launcher.py reads this file, builds every container's create specification from it and
# the template table, and creates the containers itself; no `docker compose` command runs (D1 section 8 item 1). scripts/lakehouse/catalog.py
# supplies the env files from the ignored data/lakehouse/ folder; the repository's .env is never read.
# Images are pinned by digest and every port listens only on this Mac.
name: hai-lakehouse

x-polaris-database: &polaris-database
  POLARIS_PERSISTENCE_TYPE: relational-jdbc
  POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
  QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://polaris-db:5432/polaris
  QUARKUS_DATASOURCE_USERNAME: polaris
  QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?run through scripts/lakehouse/catalog.py}

x-aws-profile: &aws-profile
  type: bind
  source: ${HOME}/.aws
  target: /aws
  read_only: true

services:
  polaris-db:
    image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run through scripts/lakehouse/catalog.py}
      POSTGRES_DB: polaris
      POSTGRES_INITDB_ARGS: --encoding UTF8 --data-checksums
    # Computed by scripts/lakehouse/catalog.py from the memory free when the service starts; kept for its life.
    mem_limit: ${POLARIS_DB_MEMORY_LIMIT:?run through scripts/lakehouse/catalog.py}
    volumes:
      # The catalog database lives in the ignored data/lakehouse/ folder, so recreating the container keeps the tables.
      - ./data/lakehouse/polaris_db:/var/lib/postgresql/data
      - ./services/lakehouse/polaris/create-polaris-schema.sql:/docker-entrypoint-initdb.d/create-polaris-schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "polaris", "-d", "polaris"]
      interval: 5s
      timeout: 2s
      retries: 15

  polaris-bootstrap:
    # The pinned apache/polaris-admin-tool image plus the in-image deadline entrypoint, a static binary because the image has no Python
    # (D1 section 5 item 1); services/lakehouse/polaris_admin/Dockerfile builds it.
    image: hai-polaris-admin:1.8.0
    build:
      context: ./services/lakehouse/polaris_admin
      additional_contexts:
        hai: ./services/hai
    profiles: [setup]
    environment: *polaris-database
    # The one-time bootstrap uses Polaris's computed limit [502].
    mem_limit: ${POLARIS_MEMORY_LIMIT:?run through scripts/lakehouse/catalog.py}
    command:
      - bootstrap
      - --realm=POLARIS
      - --credential=POLARIS,${POLARIS_CLIENT_ID:?run through scripts/lakehouse/catalog.py},${POLARIS_CLIENT_SECRET:?run through scripts/lakehouse/catalog.py}
    depends_on:
      polaris-db:
        condition: service_healthy

  polaris:
    image: apache/polaris:1.8.0@sha256:347615e736cab2c9be0d8c464552ac930be4755302bb0aeb745216bbae99ba5b
    environment:
      <<: *polaris-database
      POLARIS_REALM_CONTEXT_REALMS: POLARIS
      QUARKUS_OTEL_SDK_DISABLED: "true"
      # The server writes table metadata with the project's AWS profile (read-only mount); it never vends credentials.
      AWS_PROFILE: ${AWS_PROFILE:?run through scripts/lakehouse/catalog.py}
      AWS_REGION: ${AWS_REGION:?run through scripts/lakehouse/catalog.py}
      AWS_CONFIG_FILE: /aws/config
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
    volumes:
      - *aws-profile
    # Computed by scripts/lakehouse/catalog.py from the memory free when Polaris starts; its 80% Java heap scales with it.
    mem_limit: ${POLARIS_MEMORY_LIMIT:?run through scripts/lakehouse/catalog.py}
    ports:
      - "127.0.0.1:8181:8181"
      - "127.0.0.1:8182:8182"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 10s
    depends_on:
      polaris-db:
        condition: service_healthy

  spark:
    image: hai-lakehouse-spark:4.1.2-iceberg1.11.0
    build:
      context: ./services/lakehouse/spark
      additional_contexts:
        hai: ./services/hai
    profiles: [job]
    mem_limit: ${JOB_MEMORY_LIMIT:?run through a lakehouse launch script}
    environment:
      AWS_PROFILE: ${AWS_PROFILE:?run through scripts/lakehouse/catalog.py}
      AWS_REGION: ${AWS_REGION:?run through scripts/lakehouse/catalog.py}
      AWS_CONFIG_FILE: /aws/config
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
      POLARIS_URI: http://polaris:8181/api/catalog
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID:?run through scripts/lakehouse/catalog.py}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET:?run through scripts/lakehouse/catalog.py}
      # The job heap, computed by scripts/lakehouse/catalog.py from the running containers before each job.
      SPARK_JOB_MEMORY: ${SPARK_JOB_MEMORY:-}
      JOB_THREADS: ${JOB_THREADS:-}
    volumes:
      - *aws-profile
      # Narrowed from the repository root (D1 section 7 item 3): code and configuration read-only, then only the folders the jobs write.
      # The launcher mounts per job the subset it needs (orchestration/launcher.py SPARK_JOBS); nothing here reaches data/lakehouse/secrets.
      - ./scripts:/workspace/scripts:ro
      - ./config:/workspace/config:ro
      - ./infra/deployment.auto.tfvars.json:/workspace/infra/deployment.auto.tfvars.json:ro
      - ./data/e2e:/workspace/data/e2e
      - ./data/analytics/dbt/runs:/workspace/data/analytics/dbt/runs
    depends_on:
      polaris:
        condition: service_healthy

  analytics:
    image: hai-analytics:duckdb1.5.6-dbt1.11.15
    build:
      context: ./services/analytics
      additional_contexts:
        hai: ./services/hai
    profiles: [query]
    mem_limit: ${JOB_MEMORY_LIMIT:?run through a lakehouse launch script}
    environment:
      AWS_PROFILE: ${AWS_PROFILE:?run through scripts/lakehouse/catalog.py}
      AWS_REGION: ${AWS_REGION:?run through scripts/lakehouse/catalog.py}
      AWS_CONFIG_FILE: /aws/config
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
      # The read-only catalog principal; the root credentials never reach this container. Empty until setup creates it.
      POLARIS_READER_CLIENT_ID: ${POLARIS_READER_CLIENT_ID:-}
      POLARIS_READER_CLIENT_SECRET: ${POLARIS_READER_CLIENT_SECRET:-}
      DUCKDB_MEMORY_LIMIT: ${DUCKDB_MEMORY_LIMIT:-}
      JOB_THREADS: ${JOB_THREADS:-}
    volumes:
      - *aws-profile
      - ./services/analytics/resources.sql:/opt/analytics/resources.sql:ro
      - ./services/analytics/bronze.sql:/opt/analytics/bronze.sql:ro
    depends_on:
      polaris:
        condition: service_healthy

  analytics-dbt:
    image: hai-analytics:duckdb1.5.6-dbt1.11.15
    profiles: [query]
    mem_limit: ${JOB_MEMORY_LIMIT:?run through a lakehouse launch script}
    entrypoint: ["dbt"]
    working_dir: /workspace/dbt
    environment:
      AWS_PROFILE: ${AWS_PROFILE:?run through scripts/lakehouse/catalog.py}
      AWS_REGION: ${AWS_REGION:?run through scripts/lakehouse/catalog.py}
      AWS_CONFIG_FILE: /aws/config
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
      # The read-only catalog principal, named so dbt scrubs the values from its logs.
      DBT_ENV_SECRET_POLARIS_CLIENT_ID: ${POLARIS_READER_CLIENT_ID:-}
      DBT_ENV_SECRET_POLARIS_CLIENT_SECRET: ${POLARIS_READER_CLIENT_SECRET:-}
      DBT_PROFILES_DIR: /workspace/dbt
      DBT_TARGET_PATH: /workspace/out/target
      DBT_LOG_PATH: /workspace/out/logs
      # Packages install from dbt/package-lock.yml into the writable output mount; the project stays read-only.
      DBT_PACKAGES_INSTALL_PATH: /workspace/out/dbt_packages
      # DuckDB's memory limit for the lakehouse target, computed by scripts/lakehouse/memory_budget.py before each run.
      DUCKDB_MEMORY_LIMIT: ${DUCKDB_MEMORY_LIMIT:-}
      JOB_THREADS: ${JOB_THREADS:-}
    volumes:
      - *aws-profile
      - ./services/analytics/resources.sql:/opt/analytics/resources.sql:ro
      # The project is read-only; the staging database, run artifacts and E2E cases live in the ignored data/ folder.
      - ./dbt:/workspace/dbt:ro
      - ./data/analytics/dbt:/workspace/out
    depends_on:
      polaris:
        condition: service_healthy

  quality:
    image: hai-quality:gx1.23.2-duckdb1.5.6
    build:
      context: ./services/quality
      additional_contexts:
        hai: ./services/hai
    profiles: [query]
    mem_limit: ${JOB_MEMORY_LIMIT:?run through a lakehouse launch script}
    # Validation reads one local file; it needs no network, AWS profile or catalog.
    network_mode: none
    entrypoint: ["python", "-m", "scripts.lakehouse.silver_quality"]
    working_dir: /workspace
    environment:
      DUCKDB_MEMORY_LIMIT: ${DUCKDB_MEMORY_LIMIT:-}
      JOB_THREADS: ${JOB_THREADS:-}
    volumes:
      # Code and the build file are read-only; scripts/lakehouse/silver.py mounts the suites, baselines and output folder.
      - ./scripts:/workspace/scripts:ro
      - ./data/analytics/dbt:/workspace/build:ro

  analytics-ui:
    image: hai-analytics:duckdb1.5.6-dbt1.11.15
    profiles: [query]
    mem_limit: ${JOB_MEMORY_LIMIT:?run through a lakehouse launch script}
    entrypoint: ["/opt/analytics/ui.sh"]
    environment:
      AWS_PROFILE: ${AWS_PROFILE:?run through scripts/lakehouse/catalog.py}
      AWS_REGION: ${AWS_REGION:?run through scripts/lakehouse/catalog.py}
      AWS_CONFIG_FILE: /aws/config
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
      POLARIS_READER_CLIENT_ID: ${POLARIS_READER_CLIENT_ID:-}
      POLARIS_READER_CLIENT_SECRET: ${POLARIS_READER_CLIENT_SECRET:-}
      DUCKDB_MEMORY_LIMIT: ${DUCKDB_MEMORY_LIMIT:-}
      JOB_THREADS: ${JOB_THREADS:-}
    volumes:
      - *aws-profile
      - ./services/analytics/resources.sql:/opt/analytics/resources.sql:ro
      - ./services/analytics/bronze.sql:/opt/analytics/bronze.sql:ro
      # Saved UI notebooks live in the ignored data/ folder, so they survive the container.
      - ./data/analytics/ui:/home/analytics/.duckdb/extension_data/ui
    ports:
      # The DuckDB UI has no login: reachable from this Mac only, through the relay in the image.
      - "127.0.0.1:4213:4214"
    depends_on:
      polaris:
        condition: service_healthy
